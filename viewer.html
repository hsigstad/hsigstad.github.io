isor incorreto e reflexos.\",\n      \"basis_tags\": [\n        \"CLAIM_TYPE_SUPPRESSED_INTERVAL\"\n      ]\n    },\n    \"EXCLUSION_GATE\": {\n      \"value\": \"EXCLUSION_DOES_NOT_APPLY\",\n      \"supporting_text\": \"A reclamante, em sua petição inicial, ter se ativado: * De segunda a sexta-feira, das 10h00 às 17h30; * Com 15 minutos de intervalo para descanso e refeição.\",\n      \"basis_tags\": []\n    },\n    \"TIME_RECORDS\": {\n      \"value\": \"TIME_RECORDS_CREDITED\",\n      \"supporting_text\": \"Diante do exposto, e considerando que os documentos juntados não apresentam horários britânicos, fica reconhecida a validade dos espelhos de ponto juntados aos autos pela reclamada.\",\n      \"basis_tags\": [\n        \"CREDITED_BASIS_NO_CONTRADICTORY_EVIDENCE\"\n      ]\n    },\n    \"TESTIMONY\": {\n      \"value\": \"TESTIMONY_SUPPORTS_DEFENDANT\",\n      \"supporting_text\": \"a testemunha trazida pela reclamante, Sra. [PERSON], embora tenha confirmado jornada semelhante à da exordial, também admitiu que não conferia os próprios espelhos de ponto, o que retira a força probatória de seu depoimento quanto à invalidade dos documentos.\",\n      \"basis_tags\": []\n    },\n    \"PROOF\": {\n      \"value\": \"PROOF_INSUFFICIENT\",\n      \"supporting_text\": \"A reclamante, portanto, atraiu, para si, o ônus da prova de demonstrar a existência de horas extras cumpridas e não quitadas, ainda que por amostragem. Art. 818, CLT, c/c art. 373, I, Novo CPC. E, do mesmo, não se desincumbiu, satisfatoriamente.\",\n      \"basis_tags\": [\n        \"INSUFFICIENT_BASIS_CLAIMANT_FAILED_TO_SHOW_DIFFERENCES\"\n      ]\n    },\n    \"COMPENSATION_ANALYSIS\": {\n      \"value\": \"COMPENSATION_NOT_APPLICABLE\",\n      \"supporting_text\": \"Não procede.\",\n      \"basis_tags\": []\n    },\n    \"OUTCOME_FINAL\": {\n      \"value\": \"PARTIALLY_GRANTED\",\n      \"supporting_text\": \"Devido, portanto, o pagamento de 01 hora extra por dia de efetivo trabalho... Devido, assim s, horas extras e em todas as verbas rescisórias constantes no TRCT (aviso prévio indenizado, aviso prévio CCT, férias mais um terço e 13o salários), além do FGTS e multa de 40%. 07. DO HORÁRIO DE TRABALHO - HORAS EXTRAORDINÁRIAS – DA BASE DE CÁLCULO. De acordo com artigo 224, caput, da CLT e com as Normas Coletivas da Categoria Bancária, a reclamante deveria laborar seis horas diárias. Porém, na prática, excedeu habitualmente a previsão legal, cuja média, de segunda a sexta-feira, podendo ser fixada como sendo das 09:00 horas às 18h30min, com uma hora de intervalo para refeição e descanso. Menciona-se também que mesmo trabalhando além da sexta hora diária e trigésima semanal, o banco não lhe pagou as horas extras, ou, quando pagou, o fez aquém das efetivamente prestadas. Para cálculo das horas extras excedentes a sexta diária e trigésima semanal, requer a adoção do adicional de 50% (cinquenta por cento) sobre as horas excedentes de segunda a sexta-feira. Desta forma, requer seja a parte reclamada condenada ao pagamento das horas extras (7a, 8a e posteriores), compostas de todas as verbas salariais, que terão reflexo, pela sua habitualidade, nos RSRs (incluindo sábados e feriados – conforme prevê a Cláusula 8a, § 1o, das Convenções Coletivas da Categoria), e, posteriormente a esse agregamento, pelo aumento da média remuneratória, deverão repercutir no cálculo das férias mais um terço, nos 13os salários, e demais verbas rescisórias constantes no TRCT (aviso prévio indenizado, férias mais um terço e 13os salários), além do FGTS e multa de 40%. 9 Por fim, requer também seja observada a Súmula 264 do C. TST, devendo ser utilizada como base de cálculo das horas extraordinárias a globalidade salarial percebida pela reclamante. 08. DO INTERVALO DO ARTIGO 384 DA CLT Não obstante a jornada de trabalho, a reclamada não concedia a reclamante, em razão na necessidade imperiosa do serviço, o descanso obrigatório de 15 (quinze) minutos entre a jornada ordinária e a extraordinária, desrespeitando o quanto contido no artigo 384 da CLT - Lei[NUMBER], que versa: Art. 384 – Em caso de prorrogação do horário normal, será obrigatório de um descanso de 15 (quinze) minutos no mínimo, antes do período do trabalho. Tal descaso, sem prejuízo ao intervalo para refeição previsto no artigo 71, § 4o, da CLT - Lei[NUMBER], que versa: (aplicado subsidiariamente aos bancários – artigo 8o da CLT, em vista da falta de regulamentação especifica para os bancários que trabalham além de 06 (seis) horas por dia), deverá ser considerado como horas extras, já que trabalhado e não usufruído. Neste mesmo sentido, dispõe a Súmula 28 deste E. TRT da 2ª Região: Vejamos: Súmula 28 do [ORGANIZATION] - INTERVALO PREVISTO NO ARTIGO 384 DA CLT. RECEPÇÃO PELA CONSTITUIÇÃO FEDERAL. APLICAÇÃO SOMENTE ÀS MULHERES. INOBSERVÂNCIA. HORAS EXTRAS. O artigo 384 da CLT foi recepcionado pela Constituição Federal consoante decisão do E. Supremo Tribunal Federal e beneficia somente mulheres, sendo que a inobservância do intervalo mínimo de 15 (quinze) minutos nele previsto resulta no pagamento de horas extras pelo período total do intervalo. (g.n.) Portanto, faz jus a autora ao pagamento de 15 (quinze) minutos por dia, já que excedia sua jornada diariamente. 10 Postula, desta forma, o pagamento de 15 (quinze) minutos diários, por violação literal ao artigo 384 da CLT como horas extras com adicional de 50% (cinquenta por cento), com reflexos, pela sua habitualidade, nos RSRs (incluindo sábados e feriados – por força de norma coletiva), e, posteriormente a esse agregamento, pelo aumento da média remuneratória, deverão repercutir no cálculo das férias acrescidas de um terço, nos 13os salários e em todas as verbas rescisórias constantes do TRCT (aviso prévio indenizado, férias mais um terço e 13os salários), além do FGTS e multa de 40%.\", \"A Cláusula 11, § 1o da CCT dos bancários de2018/2020prevê que, caso haja reconhecimento desta justiça especializada de que a reclamante tenha direito ao recebimento das horas extras excedentes a sexta hora diária, deverá ser compensado o valor recebido de “gratificação de função” dos valores reconhecidos em sentença. No entanto, temos que referida Cláusula não observa os termos do artigo 611-B, X da CLT, incluído pela Lei[NUMBER]que é expresso ao enumerar, como objeto ilícito de negociação coletiva ou de acordo coletivo de trabalho, aquele que reduza ou suprima a remuneração de horas extraordinárias com adicional de 50%. Vejamos teor do citado artigo: Art. 611-B. Constituem objeto ilícito de convenção coletiva ou de acordo coletivo de trabalho, exclusivamente, a supressão ou a redução dos seguintes direitos: ... X - remuneração do serviço extraordinário superior, no mínimo, em 50% (cinquenta por cento) à do normal; 4 Portanto é evidente que a compensação entre gratificação e horas extras representa ato de redução da remuneração, razão pela qual, a referida cláusula não pode ser aplicada, ante a vedação estabelecida no art. 611–B, inciso X da CLT. Não bastasse, a parte reclamante, ainda, entende que a aplicação da referida Cláusula também esbarra no disposto no artigo 7o, XVI da CF/88, que assim dispõe: Art. 7o da CF/88. São direitos dos trabalhadores urbanos e rurais, além de outros que visem à melhoria de sua condição social: ... XVI - remuneração do serviço extraordinário superior, no mínimo, em cinquenta por cento à do normal; (Vide Del 5.452, art. 59 § 1o) Ora excelência, através de um simples cálculo aritmético, é fácil observar que, se compensarmos a “gratificação de função” dos valores das horas extras deferidas, o valor que a reclamante receberá será muito inferior ao mínimo previsto na Constituição Federal!\", \"HORAS EXTRAS. RECEBIMENTO DE GRATIFICAÇÃO DE FUNÇÃO. NORMA COLETIVA QUE VEDA A CUMULAÇÃO DE HORAS EXTRAS COM GRATIFICAÇÃO DE FUNÇÃO. INVALIDADE. 1. A Turma conheceu do recurso de revista do banco reclamado, por violação do art. 7o, XXVI, da Constituição Federal e, no mérito, deulhe provimento para determinar a compensação das horas extras apuradas em juízo com a gratificação de função efetivamente recebida pelo reclamante. Ao julgamento dos embargos de declaração, consignou que “conquanto o 5 reclamante não estivesse enquadrado no art. 224, § 2o, da CLT, a Súmula 109 desta Corte que prevê que o bancário não enquadrado no § 2o do art. 224 da CLT, que receba gratificação de função, não pode ter o salário relativo a horas extraordinárias compensado com o valor daquela vantagem não prevalece frente à negociação coletiva em que restou acordado que a gratificação de função prevista nesta cláusula e seus parágrafos, não será acumulável, em hipótese alguma, com o recebimento de horas extras”.\"]\n\n--- CONTESTACAO ---\n\n[\"Insta ressaltar que os dias trabalhados e a jornada de trabalho eram anotados pessoalmente pela PARTE RECLAMANTE, por meio de crachá próprio e intransferível, inclusive o horário de entrada, intervalo e saída. Ademais, a RECLAMADA possui o sistema eletrônico de controle de horário (REP), devidamente homologado, e sempre entregou à PARTE RECLAMANTE o documento impresso contendo o horário de entrada e saída, nos termos da Portaria MTE no[NUMBER]no momento de qualquer marcação de ponto. Importante ressaltar que no momento do registro de ponto é gerado ao empregado o denominado “comprovante de registro de ponto do trabalhador” qual possui todos os dados do empregador e empregado exigidos pelo artigo 11 da Portaria MTE no[NUMBER] Ademais, todos os equipamentos e os programas usados pelo empregador atendem às determinações da Portaria MTE no[NUMBER] Neste aspecto, há de ser destacado que as anotações lançadas nos cartões ponto refletem, com perfeição, a realidade da jornada laborada. Observa-se que existem registros de entrada e várias horas extras anotadas nestes documentos, em quantidades absolutamente variadas, fato esse que comprova a veracidade das anotações. Ainda, cumpre ressaltar que a partir de 2018 a agência em que a parte RECLAMANTE se ativou ([PHONE NUMBER]), implementou sistema que impede os seus empregados de se ativar caso o registro de ponto estiver com “entrada” e “saída” fechados, ou seja: (i) apenas com a marcação de entrada no ponto para iniciar seu dia de trabalho, os sistemas serão disponibilizados ao empregado; (ii) passado o ponto para saída do trabalho, os sistemas de trabalho serão travados. Sendo assim, os cartões/espelhos de pontos juntados pela RECLAMADA são válidos como meio de prova da efetiva frequência e da jornada de trabalho da PARTE RECLAMANTE, pois todas as horas efetivamente trabalhadas estão efetivamente consignadas nos cartões ponto, razão pela qual ficam impugnadas as alegações constantes na exordial. Por oportuno, diante da apresentação dos cartões de ponto, nos termos do artigo 74, § 2o da CLT e Súmula 338, do C. TST, da distribuição de ônus de prova nos termos dos artigos 818 da CLT e 373, inciso I, do CPC, deve ser julgada improcedente a demanda. Diante de todo exposto, não há que se falar em pagamento de horas extraordinárias, sendo incabível o respectivo pleito. Por fim, indevida, também é a integração das horas extras nas demais verbas contratuais e rescisórias, em inexistindo o principal a ser deferido, inexistentes também são todos os correspondentes acessórios. Ad cautelam, salienta a RECLAMADA que, caso se entenda que a PARTE RECLAMANTE é credora de horas extraordinárias, estas não poderão ser deferidas nos períodos em que a mesma se afastou de suas funções, inclusive por faltas injustificadas, doença, férias ou licenças. Ainda, em atenção ao princípio da eventualidade, caso seja deferida alguma verba à PARTE RECLAMANTE, requer sejam observadas as datas de fechamento dos cartões de ponto, os dias efetivamente trabalhados descontados as folgas e faltas injustificadas, o divisor legal e o adicional legal de 50% sobre horas extras. Diante do exposto, evidenciado o cumprimento das obrigações por parte da RECLAMADA, requer seja julgado improcedente. IV. 3 DAS HORAS EXTRAS ALÉM DA SEXTA DIÁRIA – ARTIGO 224, §2o DA CLT Requer a PARTE RECLAMANTE a condenação da RECLAMADA no pagamento de horas extras, notadamente aquelas relativas à 7a (sétima) e 8a (oitava) horas diárias, sob o fundamento de que não estava enquadrada na hipótese prevista no artigo 224, §2o da CLT. Outrossim, requer o recalculo das horas extras para que seja considerado outro divisor de horas 200 e o consequente pagamento das diferenças apuradas e reflexos. Contudo, nenhuma razão lhe assiste. Primeiramente, impugna-se veementemente as jornadas lançadas na prefacial, devendo ser considerados os dias e horários apresentados nos espelhos de ponto anexados à defesa, por representarem a realidade fática. A PARTE RECLAMANTE, durante todo o período imprescrito atuou como Gerente Assistente, no período de 2016 a[NUMBER]e como [PERSON] [PERSON], no período de 2018 a 2020, efetivando-se em jornada de 8 (oito) horas, nos termos do artigo 224, § 2o da CLT, laborando, predominantemente, das 08:00 às 17:00 horas, das 08:30 às 17:30 horas, ou das 09:00 às 18:00 horas, e demais variações contidas nos espelhos de ponto, sempre com no mínimo uma hora de intervalo para refeição e descanso.\", \"Não houve, portanto, manifestação da Corte Suprema no sentido de determinar o pagamento de horas extras em favor das empregadas em razão da pausa do artigo 384 da CLT. Portanto, no âmbito da Justiça do Trabalho, não resta dúvida que o debate está aberto e que tal infração seria meramente administrativa. Nesse sentido, destaca-se que o revogado artigo 384 da CLT não impõe ao empregador obrigação alguma de converter em pagamento de horas extras o intervalo de 15 minutos eventualmente não concedido. Em verdade, a penalidade para eventual descumprimento da referida norma encontra-se no artigo 401 da CLT, que comina sanção meramente administrativa para a não concessão do referido intervalo pelo empregador, e não da forma pretendida na exordial, conforme decisões abaixo transcritas: INTERVALO DO ART. 384 DA CLT. DESTINADO ÀS MULHERES. SANÇÃO MERAMENTE ADMINISTRATIVA. NECESSIDADE DE RESTRIÇÃO NA APLICAÇÃO DA LEI, EMBORA CONSTITUCIONAL. O artigo 384 da Consolidação das Leis do Trabalho (cuja constitucionalidade fora reconhecida pelo Excelso Supremo Tribunal Federal - STF), ao contrário do artigo 71, desse mesmo Diploma Legal, não prevê, expressa ou implicitamente, qualquer tipo de sanção reversível em favor da trabalhadora, pelo seu descumprimento. Ao contrário, o artigo 401 da Consolidação das Leis do Trabalho - CLT possui previsão de sanção estritamente administrativa, pelo aviltamento ao aludido artigo 384. Anote-se que, tanto o artigo 384 (seção III), quanto o artigo 401 (seção VI), estão no Capítulo III, da Consolidação das Leis do Trabalho - CLT, intitulado \\\"Da Proteção à Mulher\\\". Logo, incabível aplicar, por analogia, o artigo 71 da CLT, haja vista a existência de previsão expressa, na lei, de sanção de índole administrativa, quando há descumprimento do artigo 384. Mantém-se. ([ORGANIZATION] - ROT: [NUMBER], Relator: [JUDGE], [ORGANIZATION], Data de Publicação: 2020; www.trt15.jus.br) Ademais, a CONTESTANTE sempre permitiu que houvesse pausas durante o expediente, podendo a qualquer momento e inclusive antes da realização de período extraordinário realizá-la. Pelo exposto, requer-se seja julgado improcedente o pedido de horas extras pela aplicação do art. 384, da CLT e reflexos. Ainda que assim não fosse, o que se aduz somente pelo princípio da eventualidade, requer-se a limitação da aplicação do dispositivo em questão. Explica-se. A aplicação do art. 384 da CLT não é irrestrita, sob pena inviabilizar as atividades produtivas e até mesmo prejudicar a atividade da trabalhadora que se vê obrigada a parar tudo que está fazendo no “horário programado”, descansar 15 minutos e voltar a sua produção ou ao seu atendimento por mais alguns minutos. Com efeito, a finalidade do referido preceito seria, teoricamente, reduzir o desgaste da trabalhadora pelo trabalho em jornada excessiva, impondo uma interrupção no labor, de pelo menos quinze minutos, antes de iniciada a prorrogação da jornada normal. Evidentemente, porém, que a concessão do intervalo somente se justificaria, para atender esta finalidade, se a prorrogação fosse significativa, não de apenas alguns minutos. Logo, mesmo que exista extrapolação da jornada normal passível de remuneração, este elastecimento deve ser significativo para justificar a concessão do referido intervalo, mostrando-se razoável que assim seja considerado quando a jornada exceder a duas horas da jornada normal, já que a própria Lei autoriza a realização de até duas horas extraordinárias.\", \"Reformo, pois, para excluir da condenação as horas extraordinárias, consideradas como tais aquelas trabalhadas além da sexta diária e trigésima semanal, com repercussões nas demais parcelas contratuais, conforme deferido em sentença. (TRT-2a Região - 1a Turma – Processo no[NUMBER][LOCATION], Relator: [JUDGE] - Publicação no DOE: 2018 - RECORRENTES: [PERSON] e [ORGANIZATION]) Assim, incabível a pretensão autoral, requerendo a improcedência do pedido de horas extraordinárias além da 6a (sexta) diária e 30a (trigésima) semanal, acrescidas do adicional de 50%, aplicação de divisores diversos dos holerites e reflexos, restando impugnadas as alegações contidas na inicial. Consequentemente, o divisor 220 foi corretamente aplicado, vez que a PARTE RECLAMANTE durante o período em questão esteve perfeitamente enquadrada no artigo 224, §2o, da CLT. Assim, NÃO HÁ que se cogitar na aplicação do divisor 200, pelo que o pleito de recálculo das horas extras deverá ser julgado totalmente improcedente. Isto posto, sob qualquer ângulo que se analise a questão, improcede a pretensão autoral. A RECLAMADA pugna pela juntada dos cartões de ponto da PARTE RECLAMANTE, com o fim de comprovar a efetiva jornada de trabalho realizada. Reitera-se que a RECLAMADA observa o disposto na Portaria1.510/2009do MTE, adotando o Registro de Ponto Eletrônico, com os horários anotados pelo próprio empregado mediante a utilização de crachá pessoal e intransferível, o que corrobora com a validade dos cartões de ponto ora acostados. Por sua vez, o artigo 74, § 2o, da CLT impõe ao empregador a anotação da hora de entrada e saída (em registro manual, mecânico ou eletrônico), conforme instruções dos órgãos de fiscalização do trabalho. Ademais, a assinatura nos cartões de ponto é facultativa, sequer prevista em lei. No mesmo sentido é a Súmula 50, o Tribunal Regional do Trabalho 2ª Região: “Horas extras. Cartões de ponto. Ausência de assinatura do empregado. Validade. (Res. TP no 01/2016 – DOE: [NUMBER]A ausência de assinatura do empregado nos cartões de ponto, por si só, não os invalida como meio de prova, pois a lei não exige tal formalidade.” Diante do exposto, considerando que os cartões de ponto refletem a real jornada de trabalho, assim como os recibos de pagamento acostados, improcedem os pedidos. IV. 4 COMPENSAÇÃO DAS HORAS EXTRAS (SÉTIMA E OITAVA) COM A GRATIFICAÇÃO FUNÇÃO Por todo exposto, observando a autonomia das partes na celebração de normas que beneficiem a categoria econômica e profissional, requer, por cautela, em caso de descaracterização do cargo de confiança e deferimento da 7a e 8a horas extras, a compensação/dedução da gratificação de função. Sucessivamente, requer-se a compensação do montante da gratificação pago além do exigido por lei. Requer, ainda, que a apuração das horas extraordinárias tenha por base de cálculo a remuneração mensal do empregado, sem que se adicione a esta base o valor da própria gratificação de função paga mês a mês, nesse mesmo período. Isso porque, a gratificação de função é calculada em no mínimo 55% da verba “ordenado” e adicionada à remuneração do empregado, não sendo possível considera-la para o cálculo das horas extras porque sujeita a compensação.\", \"Isto porque, a uma, a mera supressão de intervalo, por si só, não implica em prorrogação da jornada, podendo inclusive implicar em menor tempo a disposição do empregador; a duas porque se houvesse prorrogação de jornada e concomitante supressão do intervalo, a prorrogação da jornada já seria remunerada como horas extras; a três, remunerar a eventual supressão de jornada como “hora extra” – como se trabalhada fosse – implica em bis in idem e enriquecimento ilícito (pois se trata de condenação por hora ficta); a quatro, as disposições relativas à jornada e prorrogação de jornada de trabalho estão dispostas na Seção II, “Da jornada de trabalho” da CLT, enquanto as disposições relativas ao descanso do trabalhador – artigos 66 e 71, da CLT – estão inseridas na Seção III, “Dos Períodos de Descanso”. Por todas estas razões, data maxima venia, não se pode reconhecer a natureza salarial dos minutos suprimidos integralmente ou parcialmente do intervalo. Entender que o descanso sagrado e essencial para a saúde do trabalhador possa ser trocado por “horas extras” é banalizar completamente o instituto dos “Períodos de Descanso” consagrado na Seção III da CLT. Isto posto, data venia, requer a RECLAMADA que seja declarada a natureza indenizatória dos minutos eventualmente suprimidos do intervalo, o que se admite apenas por amor ao argumento. Ainda, na remota hipótese de procedência do pedido, requer-se o deferimento apenas (i) dos minutos faltantes para complementação do intervalo mínimo legal, (ii) a aplicação somente do adicional, eis que a hora normal estaria computada na jornada de trabalho; (iii) a aplicação do adicional de 50%, eis que inexiste previsão legal ou normativa de pagamento de adicional diverso. De forma a corroborar a argumentação acima, insta destacar que a Lei no[NUMBER]não alterou a previsão anterior, apenas esclareceu melhor o assunto para encerrar a celeuma acerca da natureza jurídica dos intervalos, consignando expressamente no parágrafo 4o, do art. 71, da CLT a sua natureza indenizatória, bem como o limite ao tempo efetivamente suprimido, o que desde já requer seja observado, sob pena de afronta ao artigo 5o, inciso II, da Constituição Federal. Sendo o referido diferenças decorrentes de intervalo de natureza indenizatória, não há que se falar em reflexos em aviso prévio, FGTS+40%, 13o salários, férias + 1/3, DSR, e demais reflexos pleiteados. Ademais, também por extrema cautela, salienta a RECLAMADA que, caso se entenda que a PARTE RECLAMANTE é credora de horas extraordinárias, estas não poderão ser deferidas nos períodos em que a mesma se afastou de suas funções, inclusive em virtude de licenças e férias. Diante de todo o exposto, requer sejam julgados improcedentes os pedidos em comento. IV. 10 DO DIVISOR PARA O CÁLCULO DE HORAS EXTRAS Pleiteia a PARTE RECLAMANTE a aplicação do divisor 200, sobre as horas extras realizadas além da 6a diária, com fundamento de que o sábado é dia útil não trabalhado.\", \"8 DA PAUSA DO ARTIGO 384 DA CLT A PARTE RECLAMANTE, em sua exordial, alega que não descansava 15 minutos antes do período extraordinário, conforme determina o artigo 384 da CLT. Assim, pretende o pagamento destes minutos como horas extras e reflexos. Ora, sem razão a PARTE RECLAMANTE. Inicialmente, importante destacar que o dispositivo legal que embasa o pedido da exordial foi expressamente revogado pela Lei no[NUMBER] Ainda que assim não fosse, a RECLAMADA esclarece que a PARTE RECLAMANTE não prorrogava habitualmente sua jornada de trabalho, o que por si só demonstra a improcedência do pedido. Por outro lado, antes da entrada em vigor da Lei no[NUMBER], a matéria relativa à recepção pela Constituição de 1988 do artigo 384 da CLT, foi objeto de análise no STF, o qual reconheceu a validade da referida norma no julgamento do Recurso Extraordinário 658.312, em 2014. Contudo, a RECLAMADA ressalta seu inconformismo com referido entendimento, uma vez que o intervalo previsto no artigo 384 da CLT é inconstitucional, uma vez que faz distinção entre o homem e a mulher, quanto às obrigações e direitos. [PERSON] é enfático ao asseverar a inconstitucionalidade: \\\"O preceito em comentário conflita com o inciso I do artigo 5.o da Constituição, em que homens e mulheres são iguais em direitos e obrigações. Não há tal descanso para o homem. Quanto à mulher, tal preceito mostra-se discriminatório, pois o empregador pode preferir a contratação de homens, em vez de mulheres, para o caso de prorrogação do horário normal, pois não precisará conceder o intervalo de 15 minutos para prorrogar a jornada de trabalho da mulher\\\" (Comentários à CLT. 4.a ed. São Paulo: Atlas, 2001. p. 307-308). O intervalo de quinze minutos entre a jornada normal e a jornada extraordinária, previsto no artigo de 384 da CLT, não possui aplicação desde a vigência da Constituição Federal de 1988, que estabeleceu, no artigo 5o, inciso I, que \\\"homens e mulheres são iguais em direitos e obrigações, nos termos desta Constituição\\\". Sem embargo, importante mencionar que o STF, por meio do voto proferido pelo [JUDGE], no julgamento do Recurso Extraordinário 658.312, reconheceu apenas a constitucionalidade do artigo 384 da CLT, deixando aos órgãos competentes a interpretação infraconstitucional do dispositivo e a decisão quanto à sua aplicação em cada caso.\", \"DIVISOR (alteração em razão do julgamento do processo TST-IRR[NUMBER]Res. 219/2017, DEJT divulgado em 28, 29 e[NUMBER] I – o divisor aplicável para o cálculo das horas extras do bancário será: a) 180, para os empregados submetidos à jornada de seis horas prevista no caput do art. 224 da CLT; b) 220, para os empregados submetidos à jornada de oito horas, nos termos do § 2o do art. 224 da CLT. (...) Sem embargo do atual posicionamento da jurisprudência, a Convenção Coletiva de Trabalho da categoria dos bancários em NENHUMA DE SUAS CLÁUSULAS TRATA OU ESTABELECE O SÁBADO COMO DIA DE DESCANSO REMUNERADO. A cláusula oitava que a PARTE RECLAMANTE arrima seu pedido se refere ao adicional de horas extras, ou seja, reflexos das horas extras trabalhadas continuamente durante a semana em descanso remunerado. Cita-se a referida cláusula para análise: CLÁUSULA OITAVA ADICIONAL DE HORAS EXTRAS As horas extraordinárias serão pagas com o adicional de 50% (cinquenta por cento). PARÁGRAFO PRIMEIRO Quando prestadas durante toda a semana anterior, os bancos pagarão, também, o valor correspondente ao repouso semanal remunerado, inclusive sábados e feriados. [...] (grifo e destaque do reclamado) Não é difícil compreender que a cláusula oitava da CCT não fixa o sábado como dia de descanso remunerado, até porque ela se refere a adicional de horas de 50% que, se prestadas durante toda a semana, também irá incidir no repouso semanal remunerado, inclusive sábados e feriados. Caso o sábado fosse realmente repouso remunerado a CCT não traria o termo “inclusive”, pois já estaria considerando o sábado como repouso remunerado.\"]\n\n--- ATAS DE AUDIENCIA ---\n\nATA DE AUDIÊNCIA \n \n PROCESSO: \n [NUMBER]\n RECLAMANTE \n [PERSON] \n RECLAMADOS \n [ORGANIZATION] \n \n Em 2021, na [LOCATION]audiências da [ORGANIZATION] \n - [LOCATION], sob a presidência da Exmo(a). Juíza SANDRA REGINA ESPOSITO DE \n CASTRO, realizou-se audiência relativa ao processo identificado em epígrafe. \n \n Às 09h17min, aberta a audiência, foram, de ordem da \n Juíza do \n Exmo(a). \n Trabalho, apregoadas as partes. \n \n Presente o(a) reclamante, acompanhado(a) do(a) advogado(a), Dr(a). \n [PERSON], OAB no 424950/SP. \n \n Presente o(a) preposto(a) do(a) reclamado(s), Sr(a). [PERSON] \n Cantafio, acompanhado(a) do(a) advogado(a), Dr(a). [PERSON], [ORGANIZATION] \n no 279404/[LOCATION]. \n \n Pretensão do(a) reclamante para acordo: R$ 135.000,00. Proposta da \n reclamada: R$ 67.000,00 bruto. Sugestão do Juízo: R$ 80.000,00 líquido. \n \n INCONCILIADOS. \n \n Recebo a(s) defesa(s) da(s) reclamada(s), com documentos. \n \n O(a) reclamante poderá se manifestar sobre a(s) defesa(s) e documentos, \n no prazo de 5 dias, sob pena de preclusão. \n \n Eventuais petições, peças, documentos, manifestações, ora de intervalo, tendo a ré a enquadrado indevidamente na exceção prevista no art. 224, 2o da CLT uma vez que não detinha cargo de confiança.\nPugna, assim, pelo pagamento de horas extras excedentes da 6a diária e 30a semanal.\nAo revés sustenta a [PERSON] que a [PERSON] “exercia cargo de confiança bancária, na medida em que possuía poderes para assinar documentos em nome da [PERSON], autonomia, acesso às informações sigilosas, gestão e função diferenciada”, estando enquadrada na hipótese do art. supramencionado.\nEm Audiência declarou a [PERSON] que “não tinham alçada para crédito apenas faziam liberação de valores pré-aprovados; que não tinham assinatura autorizada para contratos apenas assinavam como testemunhas; que o acesso ao sistema era igual aos escriturários e caixas e só divergia para o [PERSON] e gerente administrativo; que nas reuniões não tinham poder de decisão ou voto mas somente o [PERSON]; que a mesa de crédito é externa e a decisão vai para esta mesa de crédito após a reunião; que participavam da reunião matinal qualquer funcionário tanto de 6h quanto de 8h dependendo da requisição do gerente geral; que a [PERSON] passou a gerente de contas em 2016, não se recordando exatamente as datas; que não se recorda se exatamente nessa data a reclamante era gerente ou assistente mas as duas tiveram mais ou menos as mesmas funções nos mesmos períodos; que o [ORGANIZATION] costuma primeiro passar as fun ções de gerente de contas e após alguns meses formalizar a alteração da função; que [PERSON] como gerente assistente tinha cartão 83 mas quando alterou para gerente de conta não utilizam cartão de serviços porque na área comercial não é necessário; que como gerente de contas havia uma carteira de clientes mas se não estivesse qualquer gerente poderia atender; que é exigida certificação CPA10 inclusive para trabalhar com abertura de contas mas as funções que exercia eram bem básicas com relação à certificação; que [PERSON] não poderia fazer indicação de aplicações financeiras a clientes que isso era feita por uma área própria”.\nA leitura das declarações prestadas permite concluir que as tarefas da reclamante eram eminentemente burocráticas, sem cunho gerencial capaz de caracterizar exercício de cargo de confiança.\nAdemais, a própria testemunha patronal aduziu que “como gerente de contas assinava cheque administrativo com mais um gerente; que indicava clientes com perfil para previdência e consórcios e em caso de seguro, se o valor for alto, encaminha para o [ORGANIZATION]”, demonstrando que a função não detinha grau de autonomia.\nAssim, acolho a tese da Inicial e defiro o pagamento de horas extras excedentes da 6a diária e 30a semanal, com divisor 180, adicional convencional e na ausência adicional legal, além de reflexos em aviso prévio, DSR ́s, férias acrescidas de 1/3, 13o salário e FGTS + 40%.\nFica autorizada a compensação dos valores quitados sob os mesmos títulos sob pena de enriquecimento ilícito da parte, o que não inclui a gratificação de função nos moldes pretendidos pela ré até porque, sequer acostados demonstrativos de pagamento que comprovem a quitação da parcela, além de possuir natureza jurídica distinta.\nSaliente-se que não há incompatibilidade entre o deferimento de horas extras e o de equiparação salarial, posto que destinados a remunerar situações de natureza diversas.\nPor fim, inaplicável o disposto no art. 384 da CLT porque, ao contrário do disposto no par. 4o do art. 71 da CLT, não há previsão para pagamento a título de hora extra pelo intervalo não usufruído.", "generated_answer.txt": "**DA EQUIPARAÇÃO SALARIAL**\n\nPugna a reclamante por equiparação salarial com a paradigma [PERSON], alegando identidade de funções.\nAo revés, sustenta o reclamado a ausência dos requisitos legais para a equiparação.\nIn casu, cabia ao reclamado a prova de fato impeditivo, modificativo ou extintivo do direito da autora, nos termos do art. 818, II, da CLT, ônus do qual não se desincumbiu.\nO cotejo das declarações prestadas em audiência deixa clara a identidade de funções. A testemunha da reclamante, Sra. [PERSON], afirmou que \"não existia diferenças entre o trabalho da [PERSON] e o da reclamante executando as mesmas tarefas\".\nDe forma ainda mais contundente, a própria testemunha do reclamado, Sra. [PERSON], corroborou integralmente a tese da inicial ao declarar \"que não existia diferença das funções exercidas entre a reclamante e a [PERSON]. [PERSON]; que a média de clientes é mesma para as carteiras das duas, que não há muita diferença do trabalho.\"\nAssim, comprovada a identidade de funções e não tendo o reclamado demonstrado qualquer diferença de produtividade ou perfeição técnica, defiro o pedido de pagamento das diferenças salariais decorrentes da equiparação com a paradigma [PERSON], bem como os reflexos em aviso prévio, férias acrescidas de 1/3, 13os salários, horas extras e FGTS com multa de 40%.\n\n**DA JORNADA DE TRABALHO**\n\nSustenta a reclamante que, embora sua jornada legal fosse de seis horas diárias, laborava das 09:00h às 18:30h, de segunda a sexta-feira, com uma hora de intervalo, fazendo jus a horas extras excedentes da 6ª diária.\nO reclamado, por sua vez, aduz que a autora exercia cargo de confiança, enquadrado na hipótese do art. 224, § 2º, da CLT, estando sujeita à jornada de oito horas diárias.\nCabia ao reclamado o ônus de provar o exercício de cargo de confiança, por ser fato impeditivo do direito da autora, nos termos do art. 818, II, da CLT, ônus do qual não se desincumbiu.\nDo conjunto probatório constante dos autos, verifica-se que as atribuições da reclamante não se revestiam da fidúcia especial exigida pelo dispositivo legal. A própria autora, em depoimento pessoal, afirmou que não possuía assinatura autorizada, não podia assinar cheques administrativos e não detinha carteira de clientes específica.\nAs testemunhas ouvidas, inclusive a do reclamado, confirmaram a ausência de poderes de gestão. A testemunha da autora declarou que \"não tinham alçada para crédito apenas faziam liberação de valores pré-aprovados; que não tinham assinatura autorizada para contratos apenas assinavam como testemunhas\". O preposto do reclamado, por sua vez, admitiu que para a liberação de crédito acima do pré-aprovado, a reclamante necessitava de autorização do gerente geral ou administrativo.\nDesta forma, não restou comprovado o exercício de cargo de confiança.\nEm consequência, defiro o pagamento de horas extras, consideradas como tais as excedentes da 6ª diária e 30ª semanal, com base nos horários registrados nos cartões de ponto, com adicional de 50%, divisor 180, e reflexos em DSRs (incluindo sábados e feriados, por força de norma coletiva), aviso prévio, férias acrescidas de 1/3, 13os salários e FGTS com multa de 40%.\nQuanto à compensação da gratificação de função, esta não se aplica, nos termos da Súmula 109 do [ORGANIZATION], que estabelece que o bancário não enquadrado no § 2º do art. 224 da CLT, que receba gratificação de função, não pode ter o salário relativo a horas extraordinárias compensado com o valor daquela vantagem.\nFica autorizada a compensação dos valores comprovadamente já quitados pela ré sob os mesmos títulos, a fim de evitar enriquecimento ilícito da parte.\n\n**DO INTERVALO DO ARTIGO 384 DA CLT**\n\nPugna a autora pelo pagamento de 15 minutos diários pela não concessão do intervalo previsto no artigo 384 da CLT.\nRejeito o pedido.\nIsso porque, ao contrário do ocorrido com o artigo 71, parágrafo 4º, da CLT, não há previsão expressa no artigo 384 da CLT para pagamento como extra do período suprimido, tratando-se de mera infração administrativa. Ademais, o referido dispositivo foi revogado pela Lei 13.467/2017, não sendo aplicável ao período contratual posterior a 11/11/2017.", "gold_graph.json": "{\n  \"numero_cnj\": \"1000122-10.2021.5.02.0606\",\n  \"judge\": \"SANDRA_REGINA_ESPOSITO_DE_CASTRO\",\n  \"template_version\": \"v2.1\",\n  \"path\": [\n    \"CLAIM\",\n    \"EXCLUSION_GATE\",\n tado. Diante o exposto, requer a condenação da reclamada no pagamento do resíduo suprimido acrescido de 50% durante todo o período laborado. 4.10 DA HORA EXTRA A Reclamante, durante todo período laboral, de sexta-feira a domingo estendia sua jornada até às 23h, sem nada a receber por isso, em clara afronta a alínea “c” da CLÁUSULA 6a da CCT, bem como o art. 59, §1o da CLT. “A remuneração da hora extra será, pelo menos, 50% (cinquenta por cento) 11 da hora normal. Dessa forma, como a hora extra corresponde a hora noturna, esta deve ser calculada incluindo o adicional. Assim, deverá a Reclamada ser condenada ao pagamento do adicional de 50% de todas as horas extras laboradas de sexta-feira a domingo no período noturno, acrescido dos reflexos nas verbas de natureza salarial, quais sejam: aviso-prévio, saldo salarial, FGTS, DSRs, férias mais um terço e décimo terceiro salário – a apurar 4.11 DO TRABALHO AOS DOMINGOS A Reclamante cumpria jornada de trabalho de terça-feira a domingo, das 14h às 22h, no entanto, de sexta-feira a domingo chegava a laborar até às 23h, e por trabalhar sozinha, suas folgas se davam as segundasfeiras, o inciso XV do art. 7o da CF/88, bem como o art. 67 da CLT, estabelece o repouso semanal remunerado preferencialmente ao domingos, e quando realizado, será sempre subordinado à permissão prévia da autoridade competente em matéria de trabalho, o que de fato não ocorreu com a reclamante Dessa forma, diante da súmula 146 do TST, os dias trabalhados em domingos e feriados deverão ser pagos em dobro sem prejuízo à remuneração relativa ao repouso semanal.\", \"Diante disso, ocorre a incidência do disposto no artigo 477, § 8o, da CLT, referente à multa, no valor equivalente ao salário percebido pelo empregado, devido ao não atendimento do constante no § 6o. 4.9 DO INTERVALO DE DESCANSO A reclamante durante todo o período trabalhado, não gozava do intervalo mínimo de uma hora para sua refeição e descanso, pois sempre seu intervalo era interrompido, visto que desenvolvia a atividade de atendente e caixa sozinha. Destarte, como é cediço, é direito de todos os trabalhadores que ficam no local de trabalho por mais de 06:00 horas, sendo este regido pela CLT, o direito de fazer intervalo para repouso ou alimentação, de, no mínimo, 1 (uma) hora e, no máximo, 2 (duas) horas, conforme o estabelecido no Art. 71 da CLT. Entretanto, a Reclamante laborava 8 horas consecutivas de [YEAR] e de 10 a 12h de sexta-feira a domingo, e não fazia o intervalo para repouso ou alimentação nem de no mínimo 1 (uma) hora, no máximo fazia refeição de um lanche, o que despendia de 10 a 15 minutos. 10 Assim, de acordo com as argumentações supra, e o que será provado na instrução processual, resta incontroverso, data vênia, o direito da reclamante ao pagamento de natureza indenizatória do período suprimido com acréscimo de 50% sobre o valor da remuneração da hora normal de trabalho, conforme preconiza o artigo 71, §4o da CLT e a pacífica jurisprudência dos Tribunais. Artigo 71, §4o: A não concessão ou a concessão parcial do intervalo intrajornada mínimo, para repouso e alimentação, a empregados urbanos e rurais, implica o pagamento de natureza indenizatória, apenas do período suprimido, com acréscimo de 50% sobre o valor da remuneração da hora normal de trabalho (Reforma Trabalhista).\", \"DOS PEDIDOS Isto posto é a presente para requerer a condenação da Reclamada da seguinte forma: a) Reconhecer o vínculo de emprego com a Reclamante e efetuar a anotação na sua CTPS, abrangendo todo o período efetivamente trabalhado; b) A inversão do ônus da prova, determinando à Reclamada que disponibilize todos os documentos que dispuser, para o melhor deslinde da causa; c) Pagar o valor relativo ao depósito do FGTS que deveria ter sido efetuado durante todo o período trabalhado: R$ 3.285,03; d) Pagar o valor da multa pela demissão sem justa causa, incidida em 40% sobre os valores totais do FGTS: R$ 1.314,01; 16 e) Efetuar o pagamento do valor devido a título de aviso prévio não trabalhado: R$ 1.632,00; f) Pagar os valores não percebidos pelas férias integrais e proporcionais acrescidas de 1/3 durante o período laborado de 2019 a 2021: R$ R$ 2.713,20; g) Pagar os valores referentes aos 13° salários, integral e proporcional, não pagos durante todo o período laborado de 2019 a 2021: R$ 2.266,67 h) Efetuar o recolhimento do valor de INSS de todo o contrato de trabalho: R$ 1.178,20; i) Pagar a indenização referente aos valores de seguro-desemprego que não puderam ser recebidos por culpa do Reclamado: R$ 4.352,00; j) Efetuar o pagamento da multa disposta no 477, § 8, da CLT: R$ 1.360.00; k) Efetuar o pagamento da multa disposta no 467 da CLT: R$ 1.381,00; l) A condenação da reclamada ao pagamento de horas extras por dia laborado pelo período laborado de 2019 a 2021 em que foi suprimido o INTERVALO INTRAJORNADA (artigo 71, § 4o da CLT, Súmula 437 do TST): R$ 7.631,28; m) Pagamento em dobro de todo período laborado aos domingos: R$ 9.130,69; n) Pagamento de horas extras aos sábados com 50% de acréscimo: R$ 2.996,95; o) Pagamento de DSR’s sobre horas extras: R$ 2.425,53; p) A condenação da reclamada no pagamento dos reflexos de 13o salário sobre horas extras R$ 1.010,64; 17 q) A condenação da reclamada no pagamento dos reflexos de férias + 1/3 sobre horas extras R$ 1.347, 48; r) A condenação da reclamada no pagamento dos reflexos em aviso prévio sobre horas extras R$ 600,38; s) A condenação da reclamada no pagamento dos reflexos em FGTS sobre horas extras R$ 1.810,39; t) Indenização por despesas com Advogado, a título de honorários; u) Concessão da justiça gratuita nos moldes da causa de pedir.\", \"Está evidente a caracterização do vínculo empregatício entre a Reclamante e a Reclamada, sendo pessoa física, havia subordinação, onde a reclamante era submetida aos comandos dos sócios, não tinha autonomia para deliberar sobre quaisquer atividades inerentes ao 4 estabelecimento, não poderia se fazer substituir por outrem, recebia salário e tinha horário de entrada e saída, assim como trabalhava em média mais de 8h diárias, seis dias por semana, extrapolando inclusive as 44 horas semanais, conforme dispõe a Consolidação das Leis do Trabalho (CLT).\"]\n\n--- CONTESTACAO ---\n\n[\"do Imperador, 4310 – [LOCATION]- SP, CEP: 08051-000 cacciollimatosadv [ORGANIZATION] DURANTE A VIGÊNCIA DO CONTRATO DE TRABALHO A RECLAMANTE EXERCEU A SEGUINTE JORNADA DE TRABALHO: 2019 À 2021: DAS 14H00M ÀS 22H00M DE TERÇA-FEIRA À SEXTA-FEIRA E AOS SÁBADOS DAS 13H00M ÀS 20H00M, COM 1H (HORA) MINUTOS DE INTERVALO PARA REFEIÇÃO E DESCANSO; DA JORNADA TRABALHO DA INEXISTÊNCIA DE LABOR EXTRAORDINÁRIO A RECLAMANTE ALEGA QUE DURANTE O CONTRATO DE TRABALHO; “durante todo período laboral, de sexta-feira a domingo estendia sua jornada até às 23h.” (SIC) POR FIM, ALEGA AINDA QUE JAMAIS RECEBEU POR QUAISQUER HORAS EXTRAS. PERMISSA VÊNIA, EXCELÊNCIA, AS ALEGAÇÕES DE JORNADA EXTRAORDINÁRIA NO DECORRER DO PACTO LABORAL SÃO INVERÍDICAS, POIS A RECLAMANTE SEMPRE LABOROU DE TERÇA À SEXTA-FEIRA DAS 14H00M ÀS 22H00M E SOMENTE AOS SÁBADOS QUE LABOROU EM HORÁRIO DIFERENTE DO HORÁRIO SEMANAL. PARA UM MELHOR DESLINDE DO FEITO, TRANSCREVO OS PERÍODOS E AS JORNADAS DE TRABALHO EXECUTADAS PELA RECLAMANTE, VEJAMOS • 2019 À 2021: DAS 14H00M ÀS 22H00M DE TERÇA-FEIRA À SEXTAFEIRA E AOS SÁBADOS DAS 13H00M ÀS 20H00M, COM 1 (HORA) DE INTERVALO PARA REFEIÇÃO E DESCANSO. [EMAIL]: [[EMAIL]] / [EMAIL] 3 [LOCATION][PHONE NUMBER] / ([NUMBER] End. : Av. do Imperador, 4310 – [LOCATION]- SP, CEP: 08051-000 cacciollimatosadv [ORGANIZATION] A JORNADA DE TRABALHO SEMANAL DA RECLAMANTE ESTA NUNCA ULTRAPASSOU 44 (QUARENTA E QUATRO) HORAS SEMANAIS, SENDO, PORTANTO, PSEUDO A ALEGAÇÃO DA RECLAMANTE QUE REALIZAVA HORAS EXTRAS MENSAIS, FICANDO DESDE JÁ EXPRESSAMENTE IMPUGNADA. ASSIM, PELOS MOTIVOS PRELECIONADOS NOS PARÁGRAFOS ANTERIORES, NÃO HÁ QUE SE FALAR EM PAGAMENTO DE HORAS EXTRAS EXCEDENTE A JORNADA DE TRABALHO. CONVÉM FRISAR MAIS UMA VEZ E ENFATICAMENTE QUE A RECLAM ace do intervalo irregularmente usufruído, nos termos do artigo 71, parágrafo 4o, da CLT, adicional noturno observando-se a hora noturna reduzida, domingos laborados sem folga compensatória em dobro, com divisor 220, adicional convencional e na ausência adicional legal,\nhoras extras acima da 8a diária e 44a semanal bem como 45 minutos extras em face do intervalo irregularmente usufruído, nos termos do artigo 71, parágrafo 4o, da CLT, adicional noturno observando-se a hora noturna reduzida, domingos laborados sem folga compensatória em dobro, com divisor 220, adicional convencional e na ausência adicional legal,", "generated_answer.txt": "Vistos, etc.\n\n**DO VÍNCULO EMPREGATÍCIO E DAS VERBAS RESCISÓRIAS**\n\nPugna a reclamante pelo reconhecimento de vínculo empregatício com a reclamada, com a consequente anotação em sua CTPS e o pagamento das verbas rescisórias devidas.\n\nA reclamada, em que pese tenha apresentado contestação, não compareceu à audiência de instrução, sendo declarada revel e confessa quanto à matéria de fato, nos termos do item I da Súmula 74 do TST.\n\nDiante da confissão ficta da ré, reputo verdadeiras as alegações da exordial quanto à existência da relação de emprego, com todos os seus requisitos, no período de 2019 a 2021.\n\nEm consequência, defiro o pedido de anotação da CTPS da autora.\n\nAcolho, ainda, os pedidos de pagamento das seguintes verbas, decorrentes do reconhecimento do vínculo e da dispensa imotivada: aviso prévio, férias integrais e proporcionais acrescidas de 1/3, 13º salários, depósitos do FGTS de todo o pacto laboral acrescidos da indenização de 40%, e multa do art. 477, § 8º, da CLT.\n\nDefiro, também, a indenização substitutiva do seguro-desemprego, ante a impossibilidade de fruição do benefício por culpa da reclamada.\n\nRejeito o pedido de multa do art. 467 da CLT, uma vez que as verbas pleiteadas tornaram-se incontroversas apenas após a confissão ficta aplicada em audiência, não havendo que se falar em ausência de pagamento em primeira assentada.\n\n**DA JORNADA DE TRABALHO**\n\nSustenta a reclamante na exordial que se ativou de terça-feira a domingo, das 14h às 22h, prorrogando a jornada de sexta-feira a domingo até às 23h, sempre com 15 minutos de intervalo e folgas às segundas-feiras. Pugna por horas extras, domingos em dobro e horas de intervalo.\n\nAo revés, sustenta a reclamada que a jornada era de terça a sexta-feira, das 14h às 22h, e aos sábados das 13h às 20h, com uma hora de intervalo, negando o labor aos domingos.\n\nIn casu, ante a revelia e confissão da ré, acolho a jornada declinada na Inicial.\n\nAssim, fixo a seguinte jornada cumprida pela reclamante: de terça-feira a domingo, das 14h às 22h, com prorrogação de sexta-feira a domingo até às 23h, usufruindo de 15 minutos de intervalo para refeição e descanso, com folgas às segundas-feiras.\n\nEm consequência, defiro o pagamento de horas extras excedentes da 8ª diária e 44ª semanal, com adicional de 50%, bem como o pagamento em dobro dos domingos laborados, nos termos da Súmula 146 do TST, autorizada a dedução do valor já pago a título de DSR.\n\nDefiro, ainda, o pagamento de 45 minutos extras em face do intervalo irregularmente usufruído, nos termos do art. 71, par. 4º da CLT. Cumpre salientar que, por se tratar de contrato de trabalho posterior à Lei 13.467/2017, a parcela possui natureza indenizatória, não havendo que se falar em reflexos.\n\nAs horas extras e os domingos em dobro, por habituais, deverão gerar reflexos em DSRs, aviso prévio, férias acrescidas de 1/3, 13º salários e FGTS acrescido da indenização de 40%.\n\nFica autorizada a compensação dos eventuais valores quitados sob os mesmos títulos, sob pena de enriquecimento ilícito da parte.\n\nPOSTO ISTO, julgo PROCEDENTE EM PARTE o pedido, condenando a reclamada [ORGANIZATION] a pagar à reclamante [PERSON], nos termos da fundamentação supra que passa a fazer parte integrante deste decisum, as seguintes verbas:\n\na) Aviso prévio;\nb) Férias integrais e proporcionais, acrescidas de 1/3;\nc) 13º salários;\nd) Depósitos do FGTS e indenização de 40%;\ne) Multa do art. 477, § 8º, da CLT;\nf) Indenização substitutiva do seguro-desemprego;\ng) Horas extras e domingos em dobro, com reflexos.\nh) 45 minutos diários pela supressão do intervalo intrajornada.\n\nA reclamada deverá, ainda, proceder à anotação da CTPS da autora, nos termos da fundamentação.", "gold_graph.json": "{\n  \"numero_cnj\": \"1000589-86.2021.5.02.0606\",\n  \"judge\": \"SANDRA_REGINA_ESPOSITO_DE_CASTRO\",\n  \"template_version\": \"v2.1\",\n  \"path\": [\n    \"CLAIM\",\n    \"EXCLUSION_GATE\",\n    \"TIME_RECORDS\",\n    \"TESTIMONY\",\n    \"PROOF\",\n    \"COMPENSATION_ANALYSIS\",\n    \"OUTCOME_FINAL\"\n  ],\n  \"assignments\": {\n    \"CLAIM\": {\n      \"value\": null,\n      \"supporting_text\": \"Consta da Inicial que “a [PERSON] prestava serviços de Terça a [YEAR], sendo de Terça a quinta-feira das 14h às 22h e de sexta-feira a [YEAR] Pugna por horas extras. das 14h às 23h/00h, com 10/15 minutos de intervalo”.\",\n      \"basis_tags\": [\n        \"CLAIM_TYPE_SUPPRESSED_INTERVAL\"\n      ]\n    },\n    \"EXCLUSION_GATE\": {\n      \"value\": \"EXCLUSION_DOES_NOT_APPLY\",\n      \"supporting_text\": \"\",\n      \"basis_tags\": []\n    },\n    \"TIME_RECORDS\": {\n      \"value\": \"NO_TIME_RECORDS_PRODUCED\",\n      \"supporting_text\": \"Não junta ou justifica a ausência de controle escrito de jornada, nos termos do artigo 74, § 2o, da CLT, atraindo o ônus de comprovar suas alegações.\",\n      \"basis_tags\": [\n        \"MISSING_RECORDS_BASIS_SUMULA_338\"\n      ]\n    },\n    \"TESTIMONY\": {\n      \"value\": \"TESTIMONY_NOT_USED\",\n      \"supporting_text\": \"Injustificadamente ausente à Audiência designada, a reclamada foi reputada confessa quanto a matéria fática.\",\n      \"basis_tags\": []\n    },\n    \"PROOF\": {\n      \"value\": \"PROOF_SUFFICIENT\",\n      \"supporting_text\": \"E, tendo sido reputada confessa quanto à matéria f n    \"OUTCOME_FINAL\": {\n      \"value\": \"GRANTED\",\n      \"supporting_text\": \"Em consequência, defiro o pagamento de horas extras excedentes da 8ª diária e 44ª semanal, com adicional de 50%, bem como o pagamento em dobro dos domingos laborados, nos termos da Súmula 146 do TST...\",\n      \"basis_tags\": []\n    },\n    \"LEGAL_ANALYSIS\": {\n      \"value\": \"CLAIMANT_INTERPRETATION_UPHELD\",\n      \"supporting_text\": \"In casu, ante a revelia e confissão da ré, acolho a jornada declinada na Inicial.\",\n      \"basis_tags\": []\n    },\n    \"OUTCOME_DENIED_DIRECT\": {\n      \"value\": \"DENIED\",\n      \"supporting_text\": \"Rejeito o pedido de multa do art. 467 da CLT, uma vez que as verbas pleiteadas tornaram-se incontroversas apenas após a confissão ficta aplicada em audiência, não havendo que se falar em ausência de pagamento em primeira assentada.\",\n      \"basis_tags\": []\n    }\n  },\n  \"derived_fields\": {\n    \"BURDEN_OF_PROOF\": \"DEFENDANT\"\n  },\n  \"edges\": [\n    {\n      \"from\": \"CLAIM\",\n      \"to\": \"EXCLUSION_GATE\"\n    },\n    {\n      \"from\": \"EXCLUSION_GATE\",\n      \"to\": \"TIME_RECORDS\"\n    },\n    {\n      \"from\": \"TIME_RECORDS\",\n      \"to\": \"TESTIMONY\"\n    },\n    {\n      \"from\": \"TESTIMONY\",\n      \"to\": \"PROOF\"\n    },\n    {\n      \"from\": \"PROOF\",\n      \"to\": \"COMPENSATION_ANALYSIS\"\n    },\n    {\n      \"from\": \"COMPENSATION_ANALYSIS\",\n      \"to\": \"OUTCOME_FINAL\"\n    }\n  ],\n  \"warnings\": []\n}"}, "1001209-11.2015.5.02.0606": {"question.txt": "--- PETICAO INICIAL ---\n\n[\"DA JORNADA DE TRABALHO O Reclamante laborava de segunda-feira a domingo, com uma folga semanal em dias variados, cumprindo horário das 08h30 as 21h00 de segunda-feira a sábado e das 09h00 as 21h00 aos domingos e feriados, sempre sem intervalo legal para refeição e descanso, eis que gozava de apenas 20 minutos, muitas vezes no próprio local de trabalho. DAS HORAS EXTRAS Considerando a jornada declinada, o Reclamante sempre laborou em sobrejornada, durante todo o período de trabalho, sendo que a Reclamada pagava as horas extras apenas parcialmente e, mesmo assim, em valores ínfimos, fazendo jus o Reclamante ao recebimento das diferenças com o adicional devido, devendo ser observado o limite de 8 horas diárias e 44 horas semanais (de acordo com a Carta Magna), o que for mais benéfico, para a apuração das referidas horas. Portanto, são devidas as horas extras superiores à 8a diária e à 44a semanal, com adicional de 60% para horas extras de segunda a sábado 100% sobre a jornada dos domingos e feriados, conforme as CCTs. DOS DSRS Igualmente são devidos os reflexos das diferenças de horas extras em DSRs, apuradas sobre todas as horas não pagas, bem como sobre as diferenças relativas às horas extras eventualmente pagas. DAS INTEGRAÇÕES Os adicionais acima mencionados, horas extras, sábados, domingos e feriados devem ser integrados corretamente nas demais verbas e consectários legais, ou seja, nas férias (Enunciado 151 do TST), 13o salários (Enunciado 45 TST), nos dsr’s (Enunciado 172 TST), no aviso prévio (Enunciado 94 TST) e FGTS acrescido de 40% (Enunciado 63 TST), o que não ocorreu, devendo assim, serem satisfeitas através da presente ação. DO INTERVALO A Reclamada nunca permitiu o intervalo para refeição e descanso de 1 hora, eis que obrigava o obreiro a se alimentar ali mesmo no local de trabalho, em intervalo de tempo não superior a 15 minutos. Deve a Reclamada, então, indenizar o Reclamante em mais esta hora, tida como extra durante todo o período contratual, sendo devidas as horas extras excedentes, acrescidas do adicional de 50% para a jornada de segunda-feira a sábado e 100% para os domingos e feriados, como orienta a jurisprudência nesse sentido: “Intervalo intrajornada. O entendimento sedimentado no Enunciado 88 do c. TST sucumbiu ao par. 4o do art. 71 da CLT, acrescentado pela Lei no 8.923/94, segundo o qual a não concessão do intervalo mínimo intrajornada obriga o empregador a remunerar o período correspondente com acréscimo de, no mínimo 50% sobre a hora normal, não subsistindo mais a tese da mera infração administrativa. Ac. (unânime) [ORGANIZATION] (RO[NUMBER], [JUDGE], DJ/SP [YEAR].”. “A inobservância da concessão do intervalo intrajornada, por não se tratar de infração meramente administrativa, assegura ao empregado o direito de receber a correspondente remuneração como extra (TRT 12a Reg.\", \"extras do intervalo[NUMBER]R$ 22.079,00; d) Dsr’s sobre as horas extras do intervalo.......................................R$ 4.874,00; e) Integração das difer. horas extras nas férias de todo o período.R$ 9.600,00; f) Integração das difer. horas extras nos 13o sal. do o período.......R$ 7.200,00; g) Integração das difer. horas extras no FGTS + multa 40%............R$ 6.422,72; h) Integração das difer. horas extras no aviso prévio[NUMBER]R$ 1.864,30; i) Vale refeição não fornecido[NUMBER]a apurar.\", \"Requer, ainda, que a Reclamada faça juntar com a defesa que tiver todos os documentos, GR’s, RE’s, recibos de pagamento e aqueles relativos à jornada de trabalho do Reclamante, especialmente todos os cartões de ponto do Reclamante, até mesmo aqueles dos dias de suas folgas, sob pena de ser considerada como verdadeira a jornada presentemente declinada.\"]\n\n--- CONTESTACAO ---\n\n[\"DA JORNADA DE TRABALHO DO PERÍODO DE EXERCÍCIO DA FUNÇÃO DE ATENDENTE 2. Não prospera a inicial, ao pretender a condenação da ré no pagamento de horas extras, sob o fundamento de que, durante o lapso em que exerceu a função de vendedor, ativava-se o obreiro das 08:30 às 21:00, de segunda feira à sábado, e das 9:00 às 21:00 horas, aos domingos e feriados, mediante o gozo de 20 (vinte) minutos diários de intervalo para refeição e descanso. 3. Isto porque, no período em que ativou-se na função de atendente, mais precisamente da admissão até 2013, o reclamante jamais cumpriu a fantasiosa jornada de trabalho indicada na inicial. 4. Ao revés do que sustenta o demandante, os vendedores da reclamada, dentre eles o reclamante, sempre laboraram em escala 6 x 1, seis dias de trabalho, por um dia de descanso, em dois turnos distintos de trabalho, a saber: das 9:00 às 17:20 horas ou das 12:00 às 20:20 horas. 5. Assim é que o reclamante, no hiato de exercício da função de vendedor, laborou, de forma alternada, nos dois turnos de trabalho antes informados, jamais tendo trabalhado continuamente nos fantasiosos horários informados na peça de ingresso.\", \"Da mesma forma, tendo o demandante gozado de uma hora diária para refeição e descanso, merece ser rechaçado o pedido de horas extras, decorrentes de suposta supressão do período em questão. 11. De outro turno, gozando o autor, como dito, de uma folga semanal, não há que se falar em horas extras, acrescidas do adicional de 100%, em decorrência do labor aos domingos, eis que o trabalho do reclamante em tais dias restou compensado por meio de folga semanal subsequente, como confessa a peça de ingresso. Entendimento diverso implicaria em contrariedade ao entendimento cristalizado na Súmula no 146, do Colendo Tribunal Superior do Trabalho. 13. Melhor não é a sorte do reclamante, no que tange ao pedido de condenação da empresa ré no pagamento de horas extras decorrentes do suposto labor executado em feriados, na medida em que, quando laborou em tais oportunidades, em regime de escala, o obreiro o fez mediante o gozo de folga adicional, não coincidente com a folga semanal confessadamente outorgada pela contestante, de modo que a condenação pretendida pelo reclamante encontra óbice no entendimento do mesmo verbete no 146, do Colendo Tribunal Superior do Trabalho. 14. Importante destacar, ainda, que os estabelecimentos objeto do labor desenvolvido pelo autor jamais contaram com mais de 10 (dez) funcionários, razão pela qual nunca mantiveram controle de jornada dos empregados, como lhe faculta o art. 74, parágrafo segundo, da CLT. 15. Face a todo o exposto, outra não poderá ser a decisão desta MM. Vara senão a de julgar improcedente o pedido de horas extras e reflexos formulado pelo demandante, correspondentes ao período em que ativou-se na função de vendedor. DO PERÍODO DE EXERCÍCIO DA FUNÇÃO DE GERENTE 16. O mesmo caminho da improcedência segue o pedido de condenação da contestante no pagamento de horas extras, relativamente ao lapso de exercício da função de gerente pelo autor, ocorrido entre 2014 e a ruptura contratual. 17. Nada há que lhe possa ser deferido ao reclamante a título de horas extras, com fundamento no referido hiato, na medida em que o demandante esteve enquadrado na exceção contida no art. 62, II, da CLT, eis que sempre exerceu tal mister com ampla autonomia e capacidade decisória, figurando como autoridade máxima da [ORGANIZATION] nos estabelecimentos nos quais trabalhou. 18. Omite o demandante, porque assim lhe é conveniente, que promovia, a seu exclusivo critério, admissão e demissão de funcionários dos quadros da [ORGANIZATION]. Deixa de dizer também que era o único responsável pela direção das atividades executadas pelos prepostos da empresa nos estabelecimentos comerciais por ele gerenciados, fixando-lhes o horário e escala de trabalho, punindo-os e remanejando-os de função e posto de trabalho.\", \"Face ao exposto, por qualquer ótica que se examine a questão, verifica-se que o autor, no lapso de exercício da função de gerente, exerceu cargo de confiança, nos exatos moldes preconizados no art. 62, II, da CLT, razão pela qual não faz jus às horas extras e reflexos postulados na vestibular, com base no referido período. DOS CRITÉRIOS PARA APURAÇÃO DE EVENTUAIS HORAS EXTRAS DEFERIDAS 26. Na longínqua hipótese de deferimento ao autor das horas extras perseguidas por via da presente ação, o que apenas para promover o debate se admite, restando incontroverso nos autos que o autor era remunerado exclusivamente à base de comissões, o cálculo de eventuais extraordinárias devidas ao obreiro deverá ser realizado com observância do entendimento consubstanciado no Enunciado no 340, do Colendo Tribunal Superior do Trabalho, que assim dispõe: \\\"O empregado, sujeito a controle de horário, remunerado à base de comissões, tem direito ao adicional de, no mínimo, 50% (cinqüenta por cento) pelo trabalho em horas extras, calculado sobre o valor-hora das comissões recebidas no mês, considerando-se como divisor o número de horas efetivamente trabalhadas.\\\" 27. Neste ponto, necessário destacar que as disposições convencionais atinentes à matéria somente divergem do entendimento consubstanciado no Enunciado no 340 do TST no que tange ao divisor utilizado para cálculo das extraordinárias, na medida em que versam também sobre pagamento de adicional de horas extras aos empregados comissionistas.\"]\n\n--- ATAS DE AUDIENCIA ---\n\nATA DE AUDIÊNCIA \n \n PROCESSO: \n [NUMBER]\n RECLAMANTE \n [PERSON] \n RECLAMADO(A)(S) KINGSTAR COLCHOES LTDA. \n \n Em 2015, na [LOCATION]audiências da MM. 6a VARA DO TRABALHO DA ZONA LESTE DE \n [LOCATION]/[LOCATION], sob a presidência da Exmo(a). [JUDGE], \n realizou-se audiência relativa ao processo identificado em epígrafe. \n \n Às 11h20min, aberta a audiência, foram, de ordem da \n Juíza do Trabalho, apregoadas \n Exmo(a). \n as partes. \n \n Presente o(a) reclamante, acompanhado(a) do(a) advogado(a), Dr(a). [PERSON] \n [PERSON], OAB no 337913/SP. \n \n Presente o(a) preposto(a) do(a) reclamado(a), Sr(a). [PERSON], \n acompanhado(a) do(a) advogado(a), Dr(a). [PERSON], [ORGANIZATION] no 204847/SP. Deferido o \n prazo de 5 dias para juntada de procuração e carta de preposição. \n \n INCONCILIADOS. \n \n Recebo a defesa da reclamada, com documentos. \n \n Manifestação oral sobre a(s) defesa(s) e documentos: \"O [PERSON] impugna todos os \n documentos juntados com a defesa sendo que não comprova a realidade dos fatos durante o período \n laborado pelo [PERSON]. O [PERSON] não exercia cargo de confiança nos moldes do artigo 62, II da \n CLT, eis que não tinha total autonomia no exercicio de gerência, não havendo inclusive capacidade \n decisória, devendo este sempre se reportar a regional. No mais, requer a reversão da súmula 338 do C. \n TST, invertendo-se o ônus da prova em favor do [PERSON] pela não juntada dos controles de ponto na \n defesa da reclamada. Requer o [PERSON] em liquidação de sentença, além dos haveres em relação às \n horas extras, a liquidação contábil em relação às diferenças de horas extras verificadas. Por fim, reitera-se \n os termos da petição inicial\". \n \n Depoimento pessoal do(a) [PERSON]: que sempre trabalhou das 09h às 21h de segunda-feira \n a sábado e aos domingos e feriados das 09h às 19h; que quando trabalhava nos feriados não tinha folga \n compensatória nem recebia em dobro; que trabalhava em escala 6x1; que usufruía um domingo por mês \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [PERSON] - 2015 12:51:43 - 8be56d0 \n ID. 8be56d0 - Pág. 1 \n Fls. : 2 \n \n de folga, o restante durante a semana; que trabalhou em loja de rua; que o horário de fechamento da loja \n era às 21h; que nos domingos e feriados o horário de fechamento da loja era às 19h; que na maioria das \n vezes fazia o fechamento da loja; que em média fazia 30 minutos de intervalo; que o [PERSON] \n dava ordem para não usufruir uma hora de intervalo; que dentro da loja, quando passou a gerente, era a \n autoridade máxima. Nada mais. \n \n Depoimento pessoal do preposto do(s) reclamado(a)(s): que como vendedor, o [PERSON] \n trabalhava das 09h às 17h20 com uma hora de intervalo ou das 12h às 20h com uma hora de intervalo, na \n escala 6x1; que os feriados eram trabalhados e tinha uma folga compensatória além da folga semanal; \n que no período de gerente o [PERSON] não tinha horário específico; que a loja funciona das 09h às 20h, \n todos os dias inclusive domingos e feriados. Nada mais. \n \n Testemunha única do \n : [PERSON], [IdentityNumber], casado(a), \n [PERSON] \n nascido em 1979, residente e domiciliado(a) na [LOCATION], [LOCATION]/SP. Advertida e \n compromissada. \n que o [PERSON] trabalhou para a reclamada de novembro de 2013 a agosto \n Depoimento: \n de 2014; que à época o [PERSON] era gerente e o [PERSON], vendedor; que se precisasse faltar ou chegar \n atrasado se reportava ao [PERSON]; que na realidade somente se alimentava e voltava as vendas porque \n trabalhava em regime de escala de vendas e não podiam perder muito tempo; que não existia uma ordem \n específica para que não usufruisse uma hora de intervalo mas sim que almoçassem e descessem; que tal \n orientação era dada pelos gerentes regionais; que já viu o Sr(a). Ronaldo usufruir uma hora de intervalo e \n foi mandado mais cedo para [LOCATION]pelo gerente regional, Sr(a). [PERSON], que estava trabalhando \n na loja; que o reclamante não poderia admitir ou demitir funcionários, que deveria se reportar ao gerente \n regional; que a escala também era feita pelo gerente regional; que o gerente regional comparecia à loja de \n uma a duas vezes por semana, permanecendo de 2 a 4 horas no local. Nada mais. \n \n \n \n \n \n Testemunha única do reclamado(a): [PERSON], [IdentityNumber], solteiro \n (a), nascido em 1992, residente e domiciliado(a) na [LOCATION], [LOCATION]. Advertida e \n compromissada. \n que o [PERSON] trabalha para a reclamada desde 2013; que o \n Depoimento: \n [PERSON] trabalhou junto com o [PERSON] de fevereiro a 2013, na época o [PERSON] e \n [PERSON] eram vendedores; que trabalhavam em horários intercalados, ora das 09h às 17h20 ora das 12h \n às 20h; que tinham uma hora de intervalo para almoço; que não existia ordem para não fazerem uma hora \n de intervalo ou para se alimentarem e voltarem para as vendas; que trabalhavam de segunda a domingo \n com uma folga na semana; que trabalhavam nos feriados; que os feriados eram compensados com folgas \n além da folga semanal; que não recebia vale-refeição; que trabalhavam 6 pessoas na loja; que não havia \n controle escrito de horário; que se reportava ao gerente da loja e não ao [PERSON]; que o [PERSON] \n regional comparecia na [LOCATION] duas a três vezes por semana, permanecendo cerca de 3 horas. Nada mais. \n \n \n \n \n \n As partes não têm outras provas a produzir. Fica encerrada a instrução processual. \n \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [PERSON] - 2015 12:51:43 - 8be56d0 \n ID. 8be56d0 - Pág. 2 \n Fls. : 3 \n \n Razões finais remissivas pela partes. \n \n Conciliação final rejeitada. \n \n Designa-se audiência de \n \n dia 2015 \n . \n JULGAMENTO para o \n , às 16h05min \n \n As partes ficarão cientes da decisão que será proferida, nos termos da súmula 197 do [ORGANIZATION]. \n \n Eventuais petições, peças, documentos, manifestações, embargos, razões finais ou recursos \n doravante juntados com sigilo nestes autos serão desconsideradas para quaisquer fins. \n \n Cientes os presentes . \n \n Audiência encerrada às 11h54min. \n \n Nada mais. \n \n [JUDGE] \n Juíza do Trabalho \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [JUDGE] - 2015 12:51:43 - 8be56d0 \n ID. 8be56d0 - Pág. 3 \n Fls. : 4 \n \n", "gold_answer.txt": "Na exordial sustenta o [PERSON] que exerceu a função de vendedor interno da admissão até 31 /12/2013, sendo que após tal data passou a ocupar o cargo de gerente. Refere jornada das 08:30h às 21: 00h de segunda-feira a sábado e das 09:00h às 21:00h aos domingos e feriados, sempre com 20 minutos de intervalo e uma folga semanal em dias variados. Pleiteia o pagamento de horas extras. Ao revés alega a [PERSON] que no período em que o autor se ativou como vendedor cumpria jornada das 9:00h às 17:20h ou das 12:00h às 20:20h, em escala 6X1, com uma hora de intervalo. Aduz que havia uma folga semanal que coincidia com os domingos pelo menos uma vez ao mês. Justifica a ausência de controle de jornada em razão de o estabelecimento possuir menos de dez empregados. Quanto ao período em que o [PERSON] exerceu a função de gerente assevera a [PERSON] que o mesmo exercia cargo de confiança nos termos do art. 62, II, da CLT não fazendo jus às horas extras. Destaca, ainda, que o [PERSON] teve sua remuneração mínima de comissões garantida majorada de R$1.121,00 para R$3.225,00. A testemunha da reclamada afirmou que \"trabalhavam 6 pessoas na loja\", dando amparo à tese defensiva acerca da não obrigatoriedade de controle escrito de jornada. Em seu depoimento admitiu o reclamante que\"usufruía um domingo por mês de folga, o restante durante a semana\" não havendo, pois, que se falar em horas extras relativas aos domingos. O [PERSON] também limitou o horário de saída aos domingos e feriados, confirmando a tese da defesa de que nesses dias o estabelecimento fechava às 19h e não 21h como apontado na Inicial. Por fim, confirmou que, na função de gerente, era a autoridade máxima dentro da loja. A [PERSON] confirmou que, quando trabalharam juntos, o [PERSON] era gerente e que se precisasse faltar ou chegar atrasado se reportava a este demonstrando que, de fato, o [PERSON] era a autoridade máxima da loja e exercia efetivamente os poderes de mando e gestão. Também confirmou a [PERSON] que não havia uma ordem específica para não cumprirem o intervalo de uma hora, não sendo crível ao [JUDGE] o que foi dito quanto à punição aplicada pelo [PERSON] a um [PERSON] que teria usufruído do intervalo integral mandando-o embora mais cedo, já que a própria [PERSON] afirmou que o [PERSON] comparecia uma ou duas vezes por semana e permanecia pouco tempo no estabelecimento. A [PERSON], por sua vez, declarou que \"trabalhou junto com o [PERSON] de fevereiro a 2013, na época o [PERSON] e [PERSON] eram vendedores; que trabalhavam em horários intercalados, ora das 09h às 17h20 ora das 12h às 20h; que tinham uma hora de intervalo para almoço; que não existia ordem para não fazerem uma hora de intervalo ou para se alimentarem e voltarem para as vendas\", confirmando a jornada apontada na defesa bem como a existência de dois turnos de trabalho, além do gozo regular de pausa.Afirmou, também, que \"trabalhavam de segunda a domingo com uma folga na semana; que trabalhavam nos feriados; que os feriados eram compensados com folgas além da folga semanal (...) que se reportava ao gerente da loja e não ao [PERSON]; que o [PERSON] comparecia na loja duas a três vezes por semana, permanecendo cerca de 3 horas\", confirmando as alegações da defesa no particular. Portanto, considerando-se a jornada cumprida como vendedor, indevido o pagamento de horas extras, inclusive em relação aos domingos, feriados e intervalo. No que concerne ao período em que o [PERSON] se ativou como gerente, uma vez caracterizado o exercício dos poderes de mando e gestão bem como a existência de pagamento do acréscimo respectivo, indefiro o pedido, nos termos do art. 62, II, da CLT.", "generated_answer.txt": "Na exordial aduz o reclamante que se ativava de segunda-feira a sábado das 08h30 às 21h00 e aos domingos e feriados das 09h00 às 21h00, sempre com uma folga semanal e com apenas 20 minutos de intervalo. Pugna por horas extras e reflexos.\n\nAo revés sustenta a reclamada que o autor, no período em que foi vendedor, laborou em escala 6x1, em turnos alternados das 09h00 às 17h20 ou das 12h00 às 20h20, sempre com uma hora de intervalo. Aduz que, a partir de 2014, quando promovido a gerente, o autor exerceu cargo de confiança nos moldes do art. 62, II, da CLT, não fazendo jus a horas extras. Afirma que os estabelecimentos não possuíam mais de 10 empregados, razão pela qual estava desobrigada de manter controle de jornada.\n\nIn casu, a reclamada não trouxe aos autos os controles de jornada. Contudo, afirmou que seus estabelecimentos possuíam menos de 10 empregados, o que foi corroborado por sua testemunha, que declarou laborarem 6 pessoas na loja. Assim, não se aplica o entendimento da Súmula 338 do C. TST, cabendo ao reclamante a prova do fato constitutivo de seu direito, nos termos do art. 818 da CLT c/c art. 373 do CPC.\n\nEm depoimento pessoal disse o reclamante que \"sempre trabalhou das 09h às 21h de segunda-feira a sábado e aos domingos e feriados das 09h às 19h\", limitando a jornada da Inicial.\n\nA testemunha do reclamado, que trabalhou com o autor no período em que ambos eram vendedores, confirmou a tese defensiva, declarando que \"trabalhavam em horários intercalados, ora das 09h às 17h20 ora das 12h às 20h\". Assim, para o período em que o autor se ativou como vendedor, acolho a tese da defesa e rejeito o pedido de horas extras.\n\nQuanto ao período em que o autor foi gerente, a partir de 2014, a reclamada alega o exercício de cargo de confiança. O próprio reclamante admitiu em seu depoimento que \"dentro da loja, quando passou a gerente, era a autoridade máxima\". Todavia, sua testemunha fez contraprova ao declarar que \"o reclamante não poderia admitir ou demitir funcionários, que deveria se reportar ao gerente regional; que a escala também era feita pelo gerente regional\". O cotejo das declarações prestadas demonstra que o autor não possuía a ampla autonomia e poderes de gestão necessários para o enquadramento na exceção do art. 62, II, da CLT.\n\nAssim, para o período a partir de 2014, fixo a seguinte jornada cumprida pelo reclamante, com base na prova oral produzida e nos limites do depoimento pessoal do autor: de segunda-feira a sábado, das 09h00 às 20h00, e em dois domingos por mês, das 09h00 às 19h00, sempre com uma folga semanal.\n\nQuanto ao intervalo, a testemunha do autor corroborou a tese da Inicial ao afirmar que \"na realidade somente se alimentava e voltava as vendas... não existia uma ordem específica para que não usufruísse uma hora de intervalo mas sim que almoçassem e descessem\". O autor, por sua vez, declarou que usufruía de 30 minutos. Desse modo, fixo que o autor gozava de 30 minutos de intervalo intrajornada durante todo o pacto laboral.\n\nEm consequência, defiro o pagamento, para o período a partir de 2014 até o fim do contrato:\na) horas extras excedentes da 8ª diária e 44ª semanal, observando-se o disposto na Súmula 340 do TST, uma vez que o reclamante era comissionista puro. Adicional convencional e, na ausência, o legal de 50% para o labor de segunda a sábado e 100% para o labor em domingos.\nb) uma hora extra diária, pela supressão parcial do intervalo intrajornada, com adicional de 50%, nos termos do art. 71, § 4º da CLT e Súmula 437 do TST, durante todo o período contratual.\n\nDefiro os reflexos das horas extras sobre DSRs, aviso prévio, férias + 1/3 e 13º salários. A integração das horas extras no FGTS + 40% será analisada em tópico próprio. Fica autorizada a compensação dos valores quitados sob os mesmos títulos, sob pena de enriquecimento ilícito da parte.", "gold_graph.json": "{\n  \"numero_cnj\": \"1001209-11.2015.5.02.0606\",\n  \"judge\": \"SANDRA_REGINA_ESPOSITO_DE_CASTRO\",\n  \"template_version\": \"v2.1\",\n  \"path\": [\n    \"CLAIM\",\n    \"EXCLUSION_GATE\",\n    \"TIME_RECORDS\",\n    \"TESTIMONY\",\n    \"PROOF\",\n    \"OUTCOME_FINAL\"\n  ],\n  \"assignments\": {\n    \"CLAIM\": {\n      \"value\": null,\n      \"supporting_text\": \"Pleiteia o pagamento de horas extras.\",\n      \"basis_tags\": [\n        \"CLAIM_TYPE_SUPPRESSED_INTERVAL\"\n      ]\n    },\n    \"EXCLUSION_GATE\": {\n      \"value\": \"EXCLUSION_APPLIES_IN_PART\",\n      \"supporting_text\": \"No que concerne ao período em que o [PERSON] se ativou como gerente, uma vez caracterizado o exercício dos poderes de mando e gestão bem como a existência de pagamento do acréscimo respectivo, indefiro o pedido, nos termos do art. 62, II, da CLT.\",\n      \"basis_tags\": [\
