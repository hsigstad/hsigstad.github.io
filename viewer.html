 requer, ao menos, que sejam deferidas horas extras excedentes a 8a hora diária e/ou 44a semanal, no período de 2017 até 2019, nos mesmos moldes acima, uma vez que em tal período a reclamante não recebia gratificação pela função em sua folha de pagamento.\", \"2 - DAS HORAS EXTRAS E DO SALÁRIO POR FORA A partir de 2017 a Reclamante passou a exercer a função de Encarregada de Seção, laborando no [ORGANIZATION], passando a receber salário por fora, no importe de R$ 300,00 por mês, além do salário pago normalmente em folha de pagamento. Outrossim, não houve a alteração da função na CTPS e no holerite. Desde então, a reclamante passou a trabalhar no horário das 06:30hs às 17:20hs, de segunda-feira a sábado, com controle da jornada através de cartão de ponto.\", \"II - DO MÉRITO 1 - DO CONTRATO DE TRABALHO A Reclamante foi contratada para trabalhar para a empresa [ORGANIZATION] em 2016, para exercer a função de balconista, com remuneração inicial de R$ 1.192,00 por mês e jornada de trabalho das 12:20hs às 20:20hs, com uma folga na semana e em dois domingos ao mês.\"]\n\n--- CONTESTACAO ---\n\n[\"Durante o período de contrato de trabalho, a reclamante alega que laborava em jornada extraordinária, pede pelo pagamento das horas extras, salário por fora, e seguro desemprego. DO MÉRITO DAS HORAS EXTRAS A reclamante alega na inicial que laborava das 6h30 às 17h20, chegando a estender a jornada até as 19h, contudo tal informação não corresponde a verdade dos fatos. Verdade é que a jornada realizada pela reclamante, era das 7h as 15h20, de segunda a domingo, com duas horas de intervalo, sendo que quando laborava aos domingos, gozava de folga compensatória. Alega ainda que a Reclamada não pagava o valor das horas extras e tão pouco dava folga compensatória, contudo tal informação não condiz com a realidade dos fatos. Cabe ressaltar ainda, que a Reclamante anotava diariamente seu controle de ponto, e efetuava conferencia mensalmente. A juntada dos controles de ponto são provas incontestáveis, uma vez que fazem a real prova da jornada de trabalho da reclamante. A reclamante pede pela juntada dos controles de ponto, o que se faz neste ato, não podendo se falar em prova testemunhal que se sobreponha a prova documental. Assim não existem dúvidas de que toda a jornada de trabalho efetuada pela reclamante é a constante dos controles de ponto, até mesmo porque se verifica nestes o lançamento das horas extras e feriados trabalhados, determinando a veracidade de todas as alegações constantes da defesa. A jornada de trabalho da Reclamante sempre respeitou o limite semanal de 44 horas, sendo esta em jornada variável, e em eventual labor em horários suplementar, sendo que estes eram pagos com o adicional, conforme se observa nos recibos de pagamentos. Ficando claro que as alegações feitas pela Reclamante não condizem com a realidade, vez que os holerites em anexos demonstram o pagamento efetivo das horas extras trabalhadas pela Reclamante. As horas extras efetivamente prestadas, foram devidamente pagas, observa-se que nas ocasiões em que a reclamante trabalhou em jornada extraordinária, este recebeu os valores de forma correta, e ainda quando laborava aos domingos gozava de folga compensatória, comprovadas nos cartões de ponto em anexo. Indevido o pedido de pagamento de horas extras por labor em feriados, uma vez que, quando existente o labor em feriados e Domingos, estes eram compensados com as respectivas folgas compensatórias, tornando o pedido formulado em peça exordial em totalmente descabido e improcedente.\", \"Assim, não há que se falar no pagamento de horas extras em razão de domingos ou feriados trabalhados e não pagos, haja vista ter havido, sempre, a devida contraprestação a todo trabalho prestado. Desta forma deve ser julgado improcedente os pedidos formulados na inicial. Dos DSR's Não há o que se falar em pagamento de horas extras, em qualquer das hipóteses mencionadas anteriormente, sendo certo que, onde não se alcança principal, descabe o acessório, tornando por consequência o pedido formulado em peça exordial de pagamento de reflexos de horas extras em aviso prévio, 13° salários, férias acrescidas de 1/3 constitucional, FGTS e multa de 40% e DSR's e em demais verbas rescisórias em totalmente descabido e improcedente. Saliente-se, Excelência, que a majoração do valor do DSR, em razão da integração das horas extras habitualmente prestadas, não repercute no cálculo das férias, do 13° salário, do aviso prévio e do FGTS, por ausência de previsão legal e sob pena de caracterizar \\\"bis in idem\\\", conforme determinado pela OJ 394, da SBDI-1, do C.TST:OJ [NUMBER] DA SDI - I DO C. TST: Repouso semanal remunerado -RSR. Integração das horas extras. Não repercussão no cálculo das férias, do décimo terceiro salário, do aviso prévio e dos depósitos do FGTS. (DeJT[NUMBER] A majoração do valor do repouso semanal remunerado, em razão da integração das horas extras habitualmente prestadas, não repercute no cálculo das férias, da gratificação natalina, do aviso prévio e do FGTS, sob pena de caracterização de \\\"bis in idem\\\". Desta forma, restam totalmente improcedentes os pedidos relativos à condenação da Reclamada ao pagamento de diferenças de reflexos sobre FGTS e multa de 40%, bem como seguro desemprego, ou ainda liberação de guias TRCT para soerguimento de FGTS e Seguro-desemprego em relação a diferenças de horas extras, uma vez que estas sempre incidiram corretamente aos consectários salariais e rescisórios no curso do contrato de trabalho, porquanto são estas totalmente incabíveis na modalidade rescisória que ocorreu na espécie, razão pela qual mister se faz sejam julgados improcedentes referidos pedidos.\", \"Neste sentido, já determinava a Lei 605/49 destaca que o repouso semanal será preferencialmente, MAS NÃO SERÁ OBRIGATORIAMENTE AOS DOMINGOS, posto que há de se ponderar, ainda, que a coincidência aos domingos não é absoluta, mas, preferencial, como explica [PERSON] (2002:918): A coincidência, contudo, é preferencial, e não absoluta. Há empresas autorizadas a funcionar em domingos (desrespeitando, pois, licitamente, essa coincidência preferencial). Tais empresas deverão, porém, organizar uma escala de revezamento entre seus empregados, de modo a permitir a incidência periódica em domingos de [YEAR] Nessa escala, tem se admitido que a cada 7 semanas laboradas o empregado folgue, pelo menos, em I domingo (critério especificado pelo art. 2 da Portaria n.417/66, do Ministério do Trabalho).\"]\n\n--- ATAS DE AUDIENCIA ---\n\nATA DE AUDIÊNCIA \n \n PROCESSO: \n [NUMBER]\n [PERSON] \n [PERSON] \n RECLAMADOS \n RECEITA \n ARTESANAL \n DISTRIBUIDORA \n E \n COMERCIO \n DE \n ALIMENTOS EIRELI \n \n Em 2021, na [LOCATION]audiências da [ORGANIZATION] DE SÃO \n [LOCATION] - ZONA LESTE/[LOCATION], sob a presidência da Exmo(a). [JUDGE] \n ESPOSITO DE CASTRO, realizou-se audiência relativa ao processo identificado em \n epígrafe. \n \n Às 08h30min, aberta a audiência, foram, de ordem da \n Juíza do \n Exmo(a). \n Trabalho, apregoadas as partes. \n \n Presente o(a) reclamante, acompanhado(a) do(a) advogado(a), Dr(a). CLÉCIO \n [PERSON], [ORGANIZATION] no 307247/[LOCATION]. \n \n \n Presente o(a) preposto(a) do(a) reclamado(s), Sr(a). [PERSON], \n acompanhado(a) do(a) advogado(a), Dr(a). [PERSON], [ORGANIZATION] no \n 122435/[LOCATION]. \n \n INCONCILIADOS. \n \n Depoimento pessoal do(a) reclamante: que a [PERSON] trabalhava das 6h30 \n às 19h, mas marcava o cartão de ponto às 17h20 e voltava ao trabalho; que tinha \n uma folga na semana e cada dois domingos; que fazia uma hora de intervalo para \n refeição e descanso; que a [PERSON] era [PERSON] e ficava até mais tarde para \n organizar o trabalho da equipe; que passou a [PERSON] após um ano na empresa \n ficando 3 meses treinando a função; que apenas depois de efetivada na função de \n [PERSON] passou a receber a mais, R$ 300,00 pago \"por fora\"; que apenas em \n Assinado eletronicamente por: [PERSON] - Juntado em: 2021 12:53:28 - c6ac5a6 \n Fls. : 12 \n \n 2019 sua CTPS foi anotada com a função de encarregada; que após este \n período passou a receber gratificação de função em torno de R$ 600,00 no [ORGANIZATION]; \n que neste período não mais R$ 300,00 \"por fora\"; que desde o período de \n experiência na função de encarregada trabalhava até mais tarde. Nada mais. \n \n \n \n \n \n \n \n \n Depoimento pessoal do preposto do(s) reclamado(s)(s): que a [PERSON] \n passou a [PERSON] em 2019 mas não se recorda a data exata; que todo \n encarregado treina para a função mas não sabe dizer quanto tempo a [PERSON] \n treinou; que a [PERSON] trabalhava das 7h às 16h20 na função de [PERSON], \n antes das 7h às 15h20; que a [PERSON] não fazia hora extra como [PERSON]; \n que não ficou até às 19h; que a [PERSON] não recebia valor fora do holerite; que a \n [PERSON] como [PERSON] fazia duas horas de intervalo e antes disso uma hora. \n Nada mais. \n \n \n Primeira testemunha do reclamante: [PERSON], identidade no \n 29212214-7, casado(a), nascido em 1977, residente e domiciliado(a) na [LOCATION] \n Grande, 115, [LOCATION]. \n sob a alegação de que é \n Testemunha contraditada \n amiga íntima da reclamante, sendo por isso suspeita para depor, conforme art. 829 \n da CLT. Inquirida, negou a amizade íntima, que só foi convidada para ser \n testemunha. Contradita rejeitada. Advertida e compromissada. Depoimento: que a \n [PERSON] trabalhou para a [PERSON] de 2017 a 2020, na \n função de gerente de loja; que a [PERSON] no período já era encarregada de seção; \n que a [PERSON] trabalhava das 6h30 ao fechamento, às 21h/21h30; que a \n [PERSON] entrava às 6h30 e trabalhava até 19h/20h; que a [PERSON] não tinha \n cartão de ponto porque seu cargo era de confiança; que a [PERSON] batia o ponto \n na entrada e às 17h20 e permanecia trabalhando até 19h cerca de 5 vezes na \n semana a pedido do chefe Sr(a). José Luiz proprietário da [PERSON]; que a \n [PERSON] recebia \"por fora\" cerca de R$ 300,00 a R$ 500,00 mas afirma que não era \n de hora extra e sim pelo exercício da função de liderança; que todo líder recebia tal \n Assinado eletronicamente por: [PERSON] - Juntado em: [NUMBER]:53:28 - c6ac5a6 \n Fls. : 13 \n \n quantia \"por fora\"; que trabalhou com a reclamante na loja [ORGANIZATION] \n Carmosina. Nada mais. \n \n \n Primeira testemunha do reclamado(s): [PERSON], \n [IdentityNumber], casado(a), nascido em 1993, residente e domiciliado \n (a) na [LOCATION], [LOCATION]/SP. Advertida e compromissada. \n que [PERSON] trabalha para [PERSON] desde 2017, na função de \n Depoimento: \n balconista de frios; que trabalhou com [PERSON]; que na época a [PERSON] era \n encarregada; que [PERSON] trabalhava das 12h40 às 21h, com uma hora de \n intervalo para refeição e descanso; que [PERSON] trabalhava das 7h às 16h20, \n com duas horas de intervalo para refeição e descanso; que ao que sabe [PERSON] \n não fazia hora extra; que não via [PERSON] marcando o cartão de ponto; que \n nunca presenciou [PERSON] trabalhando até às 19h; que [PERSON] nunca \n exerceu a função de líder ou encarregada; que após a saída da [PERSON] o \n responsável da loja era [PERSON] e os funcionários acionavam [PERSON]. Nada mais. \n \n \n \n \n \n \n As partes não têm outras provas a produzir. Fica encerrada a instrução \n processual. \n \n Faculta-se às partes a apresentação de razões finais no prazo comum de 48 horas, \n sob pena de preclusão. \n \n Conciliação final rejeitada. \n \n Designa-se audiência de \n \n dia 2021 \n JULGAMENTO para o \n , às 16h02min. \n \n As partes serão intimadas da sentença pelo [ORGANIZATION]. \n \n Assinado eletronicamente por: [PERSON] - Juntado em: 2021 12:53:28 - c6ac5a6 \n Fls. : 14 \n \n Eventuais petições, peças, documentos, manifestações, embargos, razões \n finais ou recursos doravante juntados com sigilo nestes autos serão desconsideradas \n para quaisquer fins. \n \n Cientes os presentes . \n \n Audiência encerrada às 09h10min. \n \n \n Nada mais. \n \n [J  aliada ao aduzido por sua testemunha. Rejeito, pois, o pedido de horas extras.", "generated_answer.txt": "Pugna a reclamante por horas extras, sustentando que a partir de 2017 laborou das 06:30h às 19:00h, com uma hora de intervalo, uma folga semanal e em dois domingos por mês.\nAo revés sustenta a reclamada que a jornada cumprida pela autora era das 07:00h às 15:20h, com duas horas de intervalo, sendo que eventuais horas extras foram devidamente quitadas.\nDiante da documentação juntada pela ré, cabia à reclamante a prova do fato constitutivo de seu direito, nos termos do art. 818 da CLT c/c art. 373 do CPC, ônus do qual se desincumbiu satisfatoriamente no decorrer da instrução processual.\nEm depoimento pessoal disse a reclamante que \"trabalhava das 6h30 às 19h, mas marcava o cartão de ponto às 17h20 e voltava ao trabalho\".\nSua testemunha, [PERSON], corroborou a tese da Inicial ao declarar que \"a reclamante entrava às 6h30 e trabalhava até 19h/20h; que a reclamante batia o ponto na entrada e às 17h20 e permanecia trabalhando (...) a pedido do chefe Sr. [PERSON] proprietário da reclamada\".\nPor sua vez, a testemunha da ré, [PERSON], prestou declarações contraditórias, pois inicialmente afirmou que a reclamante era encarregada e depois declarou que esta \"nunca exerceu a função de líder ou encarregada\", o que retira a credibilidade de seu depoimento.\nAssim, do cotejo das declarações prestadas e dos demais elementos constantes dos autos, fixo a seguinte jornada cumprida pela reclamante a partir de 2017: das 06:30h às 19:00h, com uma hora de intervalo, uma folga semanal e dois domingos de folga por mês.\nEm consequência, defiro o pagamento de horas extras excedentes da 8ª diária e 44ª semanal, com divisor 220, adicional de 50%, e reflexos em aviso prévio, DSR's, 13º salários, férias acrescidas de 1/3 e FGTS + 40%. Fica autorizada a compensação dos valores comprovadamente quitados sob os mesmos títulos, a fim de evitar o enriquecimento ilícito da parte.", "gold Súmula TST n. 338 – JORNADA DE TRABALHO – ÔNUS DA PROVA”. III – Os cartões de ponto que demonstrarem horários de entrada e saída uniformes são inválidos como meio de prova, invertendo-se o ônus da prova, relativo às horas extras, que passa a ser do empregador, prevalecendo a jornada da inicial se dele não se desincumbir” (Ex-OJ n. 306. DJ[NUMBER] Portanto, além das provas testemunhais em audiência, já há nos autos a confissão real da reclamada de que as fichas de controles de jornada são anotadas unilateralmente pelos seus prepostos, e assinadas no inicio da jornada, por isso não expressam a realidade, motivo pelo qual devem ser declaradas nulas nos termos do art. 9o da CLT, pois além de anotações unilaterais da reclamada, os horários e/ou jornadas anotados são invariáveis e não correspondem à verdadeira jornada do reclamante. 04. DAS HORAS EXTRAS O reclamante trabalhava na jornada acima descrita, mas a reclamada não remunerava as horas extras corretamente. Conforme Convenção Coletiva do Trabalho, são extraordinárias as horas laboradas além das 6h30min em dias normais, e todas àquelas horas laboradas em domingos, feriados e folgas sem compensação, sendo que o reclamante laborava em média, mais de 150 horas extra por mês, as quais devem ser remuneradas com acréscimo de 50% em dias normais, e 100% todas aquelas trabalhadas em domingos, feriados e folgas não compensadas. Assim, o reclamante faz jus ao recebimento das horas extras além das 6h30min diárias com adicionais de 50%, e com 100% todas àquelas horas laboradas aos domingos, feriados e folgas sem compensação, de todo o contrato de trabalho, com suas integrações e reflexos em todas as demais verbas, inclusive no aviso prévio, férias + 1/3, 13o salário, FGTS + 40%, e especialmente no DSR, conforme determina a Súmula 146 do TST. 05. REDUÇÃO DO INTERVALO – IMPOSSIBILIDADE – SÚMULA 437 DO TST As Convenções Coletivas anexas preveem a possibilidade de redução para 30 minutos do intervalo destinado à refeição e descanso. Entretanto, o Colendo TST com base no art. 71 da CLT e no art. 7o, XXII da CF/88, editou a Súmula 437 (Conversão das Orientações Jurisprudenciais nos 307, 342, 354, 380 e 381 da SBDI-1 pela Resolução no 185/2012, DeJT[NUMBER], e excluiu expressamente a possibilidade de redução ou supressão do intervalo par refeição e descanso para todas as atividades, inclusive para os motoristas e cobradores de ônibus, assim determinando: II – É inválida cláusula de acordo ou convecção coletiva de trabalho contemplando a supressão ou redução do intervalo intrajornada porque este constitui medida de higiene, saúde e segurança do trabalho, garantida por norma de ordem pública (art.71 da CLT e art.7o, XXII da CF/1988), infenso à negociação coletiva. Nos termos da Súmula 437, o Colendo TST reconhece expressamente que esta 01 hora de intervalo para refeição e descanso é sagrada, e não pode ser suprimida ou reduzida parcialmente, pois além de vital para alimentação e recuperação física do trabalhador, está assegurada pela CLT e pela Constituição Federal. Com o intuito de impedir ou desestimular a supressão ou redução do intervalo intrajornada, a Súmula 437 determina o pagamento do período integral do intervalo como hora extra, não apenas aquele suprimido, além de computa-lo como efetiva jornada de trabalho, conforme Súmula 437 do TST, transcrita abaixo: Intervalo intrajornada para repouso e alimentação. Aplicação do art.71 da CLT I. Após a edição da Lei no 8923/94, a não-concessão total ou a concessão parcial do intervalo intrajornada mínimo, para repouso e alimentação a empregados urbanos e rurais, implica o pagamento total do período correspondente, e não apenas daquele suprimido, com acréscimo de, no mínimo, 50% sobre o valor da remuneração da hora normal de trabalho (art. 71 da CLT), sem prejuízo do computo da efetiva jornada de labor para efeito de remuneração. Assim sendo, o reclamante requer digne-se Vossa Excelência declarar nulas anotações dos controles de jornada, inclusive do intervalo e condenar as reclamadas no pagamento de 01 hora extra por dia, acrescida do percentual de 50% nos dias normais e 100% em domingos, feriados e folgas trabalhadas, sem compensação, conforme Sumula 437 do TST, durante toda a relação empregatícia, com integrações e reflexos em todas as demais verbas. 06. DO TRABALHO EM DOMINGOS, FERIADOS E FOLGAS SEM COMPENSAÇÃO. O reclamante trabalhou em domingos, com 2/3 folgas por mês e nos feriados, sem compensação, usufruindo apenas duas folgas por mês, e não recebe esta jornada como hora extra, com adicional de 100%. Assim, o reclamante faz jus ao recebimento de todas as horas laboradas em domingos, folgas e feriados não compensados, com o adicional de 100%, com integração e reflexos em todas as demais verbas, férias + 1/3, 13o salario, FGTS, e especialmente no DSR, nos termos do sumula 146 do TST. 07. DO INTERVALO MINIMO DE 11 HORAS ENTRE JORNADAS E DE 24h SEMANAL. Conforme jornada declinada no tópico especifica, o intervalo de 11 horas entre uma jornada e outra nunca foi observado pela ré, bem como o intervalo semanal de 24h, em afronta ao disposto nos artigos 66 e 67 da CLT. Assim, por analogia ao disposto no § 4o, do art. 71 da CLT e com base nos artigos 66/67 da CLT e na OJ 355 da [ORGANIZATION] do C. TST, o reclamante requer a condenação da reclamada no pagamento de todas horas subtraídas do intervalo mínimo de 11 horas entre jornada, bem o intervalo semanal de 24h como extraordinárias, com o acréscimo de 50% em dias normais, e 100% nos domingos , feriados e folgas trabalhadas não compensadas com integrações e reflexos no DSR, aviso prévio, férias + 1/3, 13o salários, FGTS + 40%, e demais verbas.\", \"DSR SOBRE HORAS EXTRAS JÁ PAGAS DURANTE O CONTRATO A reclamada pagou incorretamente algumas horas extras, porém não pagou os respectivos DSR ́s, inclusive sobre aquelas horas laboradas aos domingos, feriados e folgas sem compensação. Assim, o reclamante requer a condenação da reclamada no pagamento de DSR e/ou diferenças sobre as horas extras já pagas durante o contrato de trabalho, sendo que a integralidade da jornada laborada nos domingos, feriados e folgas não compensados deverão ser calculadas com o adicional de 100%, e consideradas no cálculo do DSR, nos termos da Sumula 146 do TST. 10. BASE DE CÁLCULO PARA FÉRIAS–13o SALÁRIO – INDENIZAÇÃO. A reclamada não pagou corretamente as férias + 1/3 proporcional e 13o salário durante todo o contrato de trabalho, pois não incluíram as integrações e reflexos das horas extras. Desta forma, o reclamante faz jus a recebimento das diferencias das férias + 1/3 proporcional e 13o salários de todo período com base na totalidade de sua remuneração (salário, horas extras, adicionais, DSR), compensando-se os valores pagos sob o mesmo titulo e comprovados tempestivamente nos autos. 11. HORA NOTURNA REDUZIDA - ADICIONAL NOTURNO – DIFERENÇAS. O Reclamante trabalhou em horário parcialmente noturno, e a reclamada não pagava corretamente o adicional, e também não considerava a hora noturna reduzida de 52min30seg. Por isso, a reclamada deve em média de 8 minutos de extra por hora, resultando na média de 1hora extra por dia decorrente da hora ficta reduzida de 52min 30segundos. O Reclamante faz jus ao recebimento do adicional noturno corretamente, bem como as horas extras decorrente da hora noturna reduzida de 52min30seg, com as integrações e reflexos em todas as demais verbas, durante todo o contrato de trabalho.\", \"DOS PEDIDOS Diante do exposto, pleiteia-se: a) reconhecer a globalidade salarial, para calculo das horas extras e noturnas, DSR ́s integrações e reflexos; b) declarar a nulidade de todos os controles de jornada, nos termos do art.9o da CLT, ante os vícios e fraudes noticiadas, além das provas produzidas em audiência neste processo com observação da confissão do preposto no processo[NUMBER], e das testemunhas das reclamadas os srs [PERSON] e [PERSON] nos processos[NUMBER]e[NUMBER]este dias 2013, com atas anexas aos autos; c) Declarar a nulidade da suposta demissão por justa causa, transformando em demissão sem justa causa, liberação das guias pertinentes do FGTS + 40% e Seguro Desemprego, sob as penas da lei. d) Pagamento das verbas rescisórias: saldo de salario, aviso prévio proporcional ao tempo de serviço, férias + 1/3 integral e proporcional, e 13o salario, acrescidas das integrações e reflexos das horas extras e todos adicionais, compensando eventuais valores pagos comprovado tempestivamente nos autos......................R$ apurar; e) Pagamento das diferenças das horas extras, laboradas excedentes às 6h30min por dia ou 40 semanais (CCT anexas), com o adicional de 50%, sendo domingos, feriados e folgas trabalhadas com 100% de adicional, de todo o período, com integrações e reflexos em DSR, férias proporcionais + 1/3, 13o salario, FGTS + 40%......R$ apurar; f) Pagamento de uma hora extra por dia, com 50% de acréscimo nos dias normais, e 100% em domingos, feriados e folgas não compensados, pela ausência do intervalo para refeição e descanso, de todo período trabalhado, com suas integrações e reflexos em todas demais verbas, DSR, proporcionais + 1/3, 13o salário, FGTS de todo período trabalhado......R$ apurar; g) Pagamento como extraordinárias todas as horas laboradas em domingos, feriados e folgas não compensadas, com adicional de 100%, em todo período, com integrações e reflexos nas férias proporcionais + 1/3, 13o salários, FGTS, DSR, nos termos da Sumula 146 do [ORGANIZATION]........R$ apurar; h) Pagamento como extraordinárias as horas subtraídas do intervalo mínimo intrajornada de 11h (art. 66), bem como o intervalo semanal de 24h (art. 67) com acréscimo 50% em dias normais, e 100% nos domingos, feriados e folgas trabalhadas sem compensação, com integrações e reflexos em DSR, aviso, férias +1/3, 13o salario, FGTS de todo período, com base no art. 66/67 da CLT e OJ-355 da SDI-1 do TST, aplicáveis analogicamente ao § 4o do art.71 da CLT........R$ apurar; i) liberação das guias (CD-SD), para saque do seguro desemprego, sob pena de indenização do valor equivalente, de acordo com as normas e tabelas pertinentes, que será apurado em liquidação de sentença.........R$ apurar; j) Pagamento do DSR sobre as horas extras pleiteadas nestes autos, bem com no DSR e/ou diferenças sobre as horas extras já pagas durante o contrato de trabalho.........R$ apurar; k) pagamento das diferenças de adicional noturno, bem com reconhecer a redução ficta da hora noturna para todos os fins inclusive adicionais noturnos e o pagamento de 7 minutos e 30 segundos por hora noturna trabalhada, como horas extras durante todo período, com adicional noturno legal, reflexos e integrações nas férias +1/3, 13o salario proporcional e FGTS de todo período.........R$ apurar; l) Pagamento da totalidade do vale-refeição no primeiro ano de labor, e de diferença do vale-refeição, cesta-básica, 13o salário, referente aos dias em que trabalhou em dupl a jornada, bem como aos dias trabalhados, domingos, feriados e folgas sem compensação, durante todo o contrato......R$ apurar; m) Pagamento/recolhimento de FGTS+40% e/ou diferenças de todo o período contratual, liberação das guias para levantamento sob pena de expedição de alvarás, ou execução direta......R$ apurar; n) Pagamento por dano moral pelos motivos expostos na causa de pedir, cujo valor deve ser arbitrado por este Juízo, ao qual o reclamante sugere ao menos o valor equivalente a 30 vezes a remuneração mensal que deveria receber na data da rescisão......R$ apurar; o) Pagamento das férias + 1/3 de todo período, de forma dobrada, eis que trabalhadas, com base na remuneração integral do reclamante.....R$ apurar; p) Retificar todos os arquivos mensais enviados para o INSS e FGTS (GEFIP e SEFIP), para informar corretamente a integralidade das verbas salarias recebidas durante todo o contrato de trabalho, bem como as diferenças recebidas nestes autos, conforme determina o art. 32, I, II, IV e § 2o da Lei 8212/91, comprovando nos autos em 30 dias após a homologação dos cálculos, sob pena de multa diária de R$100,00 em favor do reclamante (art. 461 §4o CPC).\", \"DAS VERBAS RESCISÓRIAS O reclamante não recebeu corretamente as verbas rescisórias, quais sejam; saldo salário, aviso prévio, férias + 1/3, 13o salário proporcional de todo período e FGTS + 40% do contrato e com integrações e reflexos das horas extras nos DSR, de todo período laborado pelo reclamante. Assim, a reclamada deverá ser condenada no pagamento das diferencias das verbas rescisórias acrescidas das horas extras, com integrações e reflexos no DSR, aviso prévio, férias + 1/3, 13o salário proporcional e FGTS + 40% de todo período trabalhado e Seguro Desemprego, sob pena de aplicação do artigo 467 e 477 da CLT, uma vez que as horas extras eram habituais, compensando eventuais valores pagos comprovado tempestivamente nos autos. VALE-REFEIÇÃO, PRIMEIRO ANO NÃO RECEBIDO No primeiro ano de labor não recebeu o vale refeição, assim, requer a condenação da reclamada no pagamento do vale deste período. 03. DA JORNADA DE TRABALHO O reclamante cumpria a jornada de trabalho das 12h50/13h às 01h30min/02h, em média, de segunda-feira a domingo, com umas 3 folgas por mês, laborando nos feriados, exceto natal ou ano novo.\", \"Além de exigir uma carga horária muito superior às previstas nas Convenções Coletivas, a reclamada não fornece o vale refeição para os dias laborados aos domingos, feriados, folgas trabalhadas, tão pouco para os dias laborados em dupla jornada. Ao exigir do reclamante o trabalho em jornada de cerca de 13horas por dia, está caracterizada a dupla jornada, onde um empregado executa tarefas de dois empregados, mas recebe apenas os direitos de um, ou seja, a reclamada reduz seus custos operacionais à custa do reclamante. Constata-se, assim, que a ré deveria contratar outro empregado para cumprir a segunda jornada, com o qual teria o compromisso de pagar um vale refeição por dia e uma cesta básica por mês, bem como e 13o salário.\", \"Assim, o reclamante requer a condenação da reclamada no pagamento de mais um vale-refeição nos dias em que o reclamante trabalhou em dupla jornada, e dois vale refeição para os dias trabalhados, domingos, feriados e folgas sem compensação, observando-se os valores do vale-refeição e cesta-básica previsto nas convenções.\"]\n\n--- CONTESTACAO ---\n\n[\"PARÂMETROS PARA CÁLCULO DE HORAS EXTRAS Eventualmente, e ainda, em respeito ao princípio da impugnação específica, caso alguma hora extra seja deferida, o que sinceramente não se acredita, aduz o reclamante, falaciosamente, que segundo o parâmetro normativo para apuração das horas extras deve levar em conta jornada diária de 6h30. Contudo, a Norma Coletiva da categoria, expressamente, em sua Cláusula no 50, Parágrafo 2o, vigente no exercício de 2014/2015, e por equivalência material às outras Normas Coletivas pretéritas, adota a base de 7h00min como parâmetro para uma jornada de 7 horas diárias, 42 horas semanais e 210 horas mensais, para cálculo de incidência do adicional de horas extras, não cabendo o seu pagamento até este limite, dispositivo que ora se colacionada: \\\"Parágrafo 2o - A remuneração da jornada normal diária dos motoristas e cobradores contratados na forma prevista no parágrafo antecedente, será calculada à base de 07h00min horas (sete horas), do salário-hora nominal, não cabendo até este limite, a incidência do adicional de horas extraordinárias\\\" (grifos nossos) Ademais, o mesmo artigo informa que o divisor que deverá ser utilizado para todos os fins é o de 210H. Portanto, não assiste razão ao reclamante. 8. INTERVALO INTRAJORNADA E REFLEXOS Alega o reclamante que não usufruía de 60 minutos diariamente para refeição e descanso, requerendo o pagamento de 1 hora extra diária com o respectivo adicional. Porém, não assiste razão ao reclamante. Primeiramente, ressalta-se que o reclamante gozava de no mínimo 1 hora de intervalo intrajornada. Consigna-se que a jornada de trabalho do reclamante é fruto de negociação coletiva que observa as peculiaridades da atividade desenvolvida pelos integrantes da categoria, consoante autorizado pelo artigo 71, § 5o, da Consolidação das Leis do Trabalho. A convenção coletiva da categoria prevê o intervalo de 1 hora para refeição e descanso, o que sempre foi observado pela reclamada, sendo que 30 minutos são gozados de forma contínua, ou seja, sem fracionamento, e os outros 30 minutos, além de serem remunerados em separado na folha de pagamento, também são gozados de forma fracionada entre cada viagem. Entre as viagens que realizam os motoristas e cobradores gozam de 10/15 minutos para descanso e refeição a cada parada antes de iniciar nova viagem. De modo que o intervalo efetivamente gozado é superior a 1 hora, sendo variável de acordo com o número de viagens que cada trabalhador faz diariamente. Didaticamente, significa que, se o trabalhador faz duas viagens completas, além dos 30 minutos que são gozados de forma contínua, ele goza de pelo menos mais 40 minutos fracionados, pois em média aguarda 10/15 minutos no ponto antes de iniciar nova viagem, ou seja, goza de mais uma hora de intervalo intrajornada diariamente. Não obstante, o obreiro ainda é remunerado em folha de pagamento pelos 30 minutos fracionados. ORA, DOUTO JULGADOR, JAMAIS HOUVE A REDUÇÃO DO INTERVALO INTRAJORNADA, MAS APENAS SEU FRACIONAMENTO. Assim, a condenação em horas extras caracterizaria \\\"bis in idem\\\", pois todo o tempo à disposição da empresa excedente a jornada habitual é pago como hora extraordinária. Portanto, não há que se falar em horas extraordinárias, diante da redação do parágrafo 5o do artigo 71, acrescido à CLT, inserido pela Lei[NUMBER], que visou implantar novas diretrizes na relação empregado/empregador nas funções inerentes ao transporte público. Ressalta a reclamada que o fracionamento foi permitido pela Lei[NUMBER]Portanto, afastada qualquer argumentação de impossibilidade absoluta de fracionamento do intervalo, já que a norma confirma a validade das normas coletivas que disciplinam a questão mediante acordo ou convenção coletiva de trabalho. O novo permissivo legal acata a necessidade de atenção especial à classe de trabalhadores do transporte, haja vista as peculiaridades de suas funções; bem como reconhece a validade dos intervalos entre uma viagem e outra. Na verdade, a nova redação do parágrafo 5o do artigo 71 da CLT põe fim à discussão sobre a validade ou não do intervalo fracionado, pois reconhece a inexistência de supressão do intervalo e confere legitimidade ao fracionamento em razão da especialidade da função. Nesse sentido, é jurisprudência: EMENTA: EMPRESAS DE TRANSPORTE PÚBLICO URBANO - INTERVALO INTRAJORNADA. Nos termos do art. 71 § 5o da CLT, com a redação dada pela Lei 12.619/12, é válida a cláusula estabelecida em acordo ou convenção coletiva de trabalho que estabelece o fracionamento do intervalo intrajornada de empregados de empresa de transporte coletivo, em razão das peculiaridades das condições de trabalho a que são submetidos esses trabalhadores, desde que garantida a mesma remuneração. No caso dos autos, válida a cláusula estabelecida em CCT's permitindo o fracionamento e restando comprovado que a cláusula era cumprida, indevido, como extra, o intervalo intrajornada. Apelo da reclamada provido. TRT 3a Região. Processo: [NUMBER]RO[NUMBER]RO).Órgão Julgador: Nona Turma Relator: [PERSON] .Revisor: [PERSON] .Vara de Origem: 15a. Vara do Trab.de Belo Horizonte. Publicação: 2014. (grifei) FRACIONAMENTO DO INTERVALO INTRAJORNADA DO MOTORISTA DE ÔNIBUS REVISTO EM CONVENÇÃO COLETIVA DE TRABALHO. VALIDADE. O fracionamento do intervalo para refeição e descanso do motorista de ônibus previsto em convenção coletiva de trabalho é válido, pois tem supedâneo no parágrafo 5o do art. 71 da CLT e na Constituição Federal (art. 7o, XIII e XXVI). ([ORGANIZATION] - RO: [NUMBER]SP[NUMBER]A28, Relator:[JUDGE], Data de Julgamento: 2014, [ORGANIZATION], Data de Publicação: 2014)(grifei) RECURSO DE REVISTA. INTERVALO INTRAJORNADA - FRACIONAMENTO - JORNADA REDUZIDA - NORMA COLETIVA - VALIDADE - TRANSPORTE COLETIVO URBANO - COBRADOR (alegação de violação aos artigos 7o, incisos XII, XIII, XIV, XXII e XXVI, da Constituição Federal, 4o, 71, caput e §§ 2o, 3o e 4o, 74, §2o, e 457 da Consolidação das Leis do Trabalho e 128 do Código de Processo Civil e à Lei no 8.923/94 e à Portaria no 3.626/91, contrariedade às Orientações Jurisprudenciais nos 307 e 342 da SBDI-1 desta Corte e às Súmulas nos 05, 20 e 27 do TRT da 3ª Região e divergência jurisprudencial). A peculiaridade fática evidenciada nos autos, referente ao trabalhador de [ORGANIZATION], está a possibilitar o fracionamento dos intervalos intrajornada, usufruídos após cada viagem cumprida pelo coletivo, sem que seja reconhecida a existência de prejuízo à saúde e segurança dos empregados. É que, ante a natureza do serviço e em virtude das condições especiais de trabalho a que estão expostos os condutores e cobradores de veículos rodoviários, a redução do intervalo intrajornada e a consequente antecipação do horário de término da jornada lhes são favoráveis. Assim, entendo que não há como desconsiderar-se a particularidade contida no instrumento normativo pactuado. Sendo reconhecidamente mais benéfico ao empregado o fracionamento do seu intervalo, é de se considerar que a autonomia privada coletiva merece, no presente caso, ser elevada a nível constitucional pela Carta Maior de 1988, (artigo 7o, inciso XXIV), e, portanto, privilegiada. Recurso de revista não conhecido. (TST - RR: [NUMBER]Relator: [JUDGE]. 2o Turma. Data de Publicação: DEJT[NUMBER]grifei) Portanto, a cláusula da CCT da categoria (cláusula 52a, I, e §5o, da CCT) que prevê a possibilidade de fracionamento da 1 hora do intervalo intrajornada, sendo 30 minutos gozados de forma continua e os outros 30 minutos, além de serem remunerados em separado na folha de pagamento, sejam gozados de forma fracionada entre cada viagem, é perfeitamente válida, não havendo fundamento legal para a condenação da reclamada ao pagamento de horas de intervalo como horas extras. Reitera que a possibilidade de fracionamento da jornada de trabalho foi devidamente autorizada na Convenção Coletiva, consoante se verifica pela cláusula 50a, §5o, da convenção coletiva de2013/2014e por igualdade material nas anteriores, in verbis: Assim também é o entendimento da d. Desembargadora da 2a Região da Justiça do Trabalho [JUDGE] no processo[NUMBER], do seu voto em Recurso Ordinário do qual foi relatora, publicado no DOE em[NUMBER]: \\\"EMENTA: JORNADA DE TRABALHO. INTERVALO INTRAJORNADA. NEGOCIAÇÃO COLETIVA. POSSIBILIDADE. A Constituição Federal em seu art. 7o adotou a autonomia coletiva privada como forma de adequação das normas trabalhistas às condições da época, lugar e empresa, desde que sob tutela do sindicato da categoria. Nesse contexto houve o primeiro passo para a alteração do sistema de tutela estatal para a tutela sindical ou coletiva de modo que tanto a jornada de trabalho como o salário podem ser objeto de negociação pelo sindicato ainda que em desfavor ao empregado individualmente considerado, pois o que se busca definir é justamente a norma mais favorável aos trabalhadores coletivamente considerados, de tal forma que a negociação por vezes significa ganho de um lado e perda de outro, perda de alguns para manter o emprego de outro. Recurso da ré a que se dá provimento\\\". Ressalte-se que todos os colaboradores têm entre 10/15 minutos de intervalo para descanso entre uma viagem e outra, configurando um intervalo intrajornada muito maior do que 1 hora, o que enfatiza a preocupação da reclamada com a saúde de seus funcionários. Ademais, vale destacar que a convenção coletiva da categoria reduziu a jornada de trabalho dos motoristas e cobradores para 7 horas de trabalho diárias, conforme se verifica na cláusula 50a, I, §2o: \\\"Parágrafo 2o - A remuneração da jornada normal diária dos motorista e cobradores contratados na forma prevista no parágrafo antecedente, será calculada à base de 07h00min horas (sete horas), do salário-hora nominal, não cabendo até este limite, a incidência do adicional de horas extraordinárias.\\\" A Constituição Federal de 1988 em seu art. 7o adotou a autonomia coletiva privada como forma de adequação das normas trabalhistas às condições do tempo, lugar e empresa, desde que sob a tutela do sindicato da categoria, sendo certo que o entendimento jurisprudencial do C.TST, em virtude das condições especiais de trabalho a que são submetidos estritamente os condutores e cobradores de veículos rodoviários, conferiu validade cláusula de acordo ou convenção coletiva de trabalho contemplando o fracionamento do intervalo. O constituinte visou prestigiar a autocomposição dos interesses coletivos mediante a participação direta das partes envolvidas e de seus membros representados, sem a intervenção do Estado, ou seja, estatuía a nível constitucional a prevalência da autonomia privada coletiva. Ademais, o permissivo negocial autorizador do fracionamento do intervalo intrajornada encontra-se em perfeita sintonia com o Princípio da Adequação Setorial Negociada, vez que observados os dois critérios objetivos para validade da norma coletiva, quais sejam: 1) a norma autônoma juscoletiva implementou um padrão setorial superior ao padrão geral oriundo da legislação heterônoma aplicável, especialmente, pela remuneração de 30 minutos do intervalo intrajornada em folha de pagamento, embora tenha sido mantida a 1 hora do intervalo intrajornada; 2) a norma transacionou parcelas justrabalhistas apenas relativas, haja vista existir expresso permissivo jurídico heterônomo a seu respeito. Ressalta-se, ainda, que a norma constitucional, não exige autorização do órgão do Ministério do Trabalho para referida prática, bastando tão-somente a negociação coletiva. Portanto, havendo previsão normativa para o fracionamento do descanso intrajornada, o reclamante não faz jus ao pagamento de horas extras pelo desrespeito do art. 71, § 4o da CLT, de modo que entendimento em sentido contrário ofenderia o disposto no art. 7o, XXVI, bem como o artigo 71, § 5o, da CLT.\", \"(TRT 4 - Ro[NUMBER], Relatora: [JUDGE], Julgamento: 2009, Órgão Julgador: [ORGANIZATION]) (Grifo Nosso) Esclarece ainda que, em algumas ocasiões, a jornada estabelecida foi excedida, sendo que o reclamante recebeu pontualmente as horas extras devidas, acrescidas do respectivo adicional, ou gozou de folga compensatória. Portanto, não há que se falar em pagamento de diferenças de horas extras. Diga-se ainda que, na hipótese dos autos, foi efetivado acordo para compensação de horas de trabalho, em consonância com o disposto em Lei, de modo que poderia, como o fez o reclamante, gozar de folga compensatória, sendo abatidas referidas horas das trabalhadas em jornada extraordinária. Conforme disposto no art. 59, \\\"caput\\\", da CLT, bem como a Súmula n.85, I, do Tribunal Superior do Trabalho, a compensação de jornada de trabalho deve ser ajustada por acordo individual escrito, acordo coletivo ou convenção coletiva, in verbis referidos dispositivos: Art. 59 - A duração normal do trabalho poderá ser acrescida de horas suplementares, em número não excedente de 2 (duas), mediante acordo escrito entre empregador e empregado, ou mediante contrato coletivo de trabalho. SUMÚLA 85 - COMPENSAÇÃO DE JORNADA A compensação de jornada de trabalho deve ser ajustada por acordo individual escrito, acordo coletivo ou convenção coletiva. A jurisprudência revela que o acordo individual de compensação de jornada é plenamente válido. Senão, vejamos: Compensação de jornada. Acordo individual. Validade. É valido o acordo individual para compensação de horas quando não existir previsão contrária em norma coletiva. Ademais, o art. 7o, inciso XIII, da CF/88 não revogou o art. 59 da CLT, pelo contrário, tornou-o mais amplo, salientando-se que a lei não veda a realização de sobrejornada, desde que não ultrapasse a duas horas diárias. A compensação, ademais, revelou-se totalmente aceita pelo reclamante que não se insurgiu contra o fato de ter todos os sábados livres durante o pacto laboral. ([ORGANIZATION], RO[NUMBER], 2a T., [PERSON], DOE[NUMBER]Grifo Nosso) Na mesma esteira, também indevidos os reflexos, tendo em vista a improcedência do principal, horas extras, a mesma sorte segue o pedido acessório, reflexos em DSR's, Fundo de Garantia e multa de 40%, trezenos, férias acrescidas do terço constitucional e aviso prévio. Ademais, ainda que deferido o pagamento de horas extras, o que se admite apenas por amor ao argumento e em razão do princípio da eventualidade, ressalta a reclamada a inexistência habitualidade na prática de labor extraordinário, pelo que também não merecem procedência os reflexos pretendidos, conforme entendimento do Tribunal Superior do Trabalho, cristalizado nas Súmulas 172, 45 e 63. Ainda, caso alguma verba seja reconhecida ao obreiro a título de hora extra, vale lembrar que o reclamante era horista, ou seja, o valor da hora já lhe foi pago, sendo certo que, em caso de deferimento de pagamento de hora extra, somente é devido o respectivo adicional sobre a hora, sob pena de enriquecimento ilícito, ressaltando a natureza indenizatória da verba, não havendo que se falar em incidência das horas extras pagas nos DSR's, férias mais 1/3, gratificação natalina, FGTS por todo o contrato de trabalho. De tudo quanto exposto, insta dizer ainda que qualquer alegação em sentido contrário deve vir acompanhada de provas robustas, ônus que incumbe ao obreiro nos termos dos artigos 818 Consolidado e 333, inciso I do Código de Processo Civil e interpretação da Súmula 338 do Tribunal Superior do Trabalho. HORAS EXTRAS - ÔNUS PROBATÓRIO - É do trabalhador o ônus probatório do labor extraordinário. Arts. 818 da CLT e 333, inciso I, do CPC. Para que se possa exigir do empregador que arque com o ônus salarial decorrente da alegada prática de labor em sobrejornada, deve haver, nos autos, prova cabal de sua ocorrência. Se ausente esta, impossível acolher-se o pleito de horas extraordinárias. (TRT 15a R. - RO[NUMBER]Rel. [JUDGE] - DOESP[NUMBER]Grifo nosso) RECURSO DE REVISTA. HORAS EXTRAS. JORNADA DE TRABALHO. O Regional aplicou adequadamente as disposições dos arts. 818 da CLT e 333 do CPC, na medida em que cabia à reclamante provar a existência do seu direito frente à prova documental contrária, ônus probatório de que, conforme se depreende da narrativa regional, não logrou a reclamante se desincumbir. Ademais, é impossível concluir, a partir do presente quadro fático e probatório, pela existência de cartões de ponto britânicos, que atrairiam a incidência da Súmula no 338 do TST. (Omissis[NUMBER], Relator: [PERSON], Data de Julgamento: 2007, [ORGANIZATION], Data de Publicação: DJ[NUMBER]Grifo nosso) HORAS EXTRAS - PROVA DOS AUTOS - INSUFICIÊNCIA - Converge para o autor o ônus de comprovar a existência do labor extraordinário alegado. Constatando-se a insuficiência do universo probante existente nos autos, mantém-se a sentença que indeferiu as horas extras pleiteadas. ([ORGANIZATION] - RO[NUMBER]Rel. Juiz [JUDGE] - J. 2002) (Grifo nosso) Ademais, há que se falar pela inaplicabilidade da Súmula no 338, III, do C.TST, vez que a lei não estabelece presunção de que os cartões \\\"britânicos\\\" são inválidos. Corroborando e esmiuçando a tese ora debatida, cita-se o grande doutrinador [PERSON], que em suas palavras considera: \\\"A orientação (Súmula 338, III, do TST) toma por base as máximas da experiência no sentido de que o empregado não marca o controle de ponto dos os dias no mesmo horário, o que realmente é impossível. Entendo incorreta a orientação, pois a prova da jornada de trabalho é do empregado (Art. 818 da CLT e inciso I do art. 333 do CPC). Não se pode dizer que os cartões de ponto que demonstram horário de entrada e saída invariáveis são inválidos como meio de prova, que são os chamados cartões \\\"britânicos\\\", pois somente pode ser considerada tal regra quando o empregado faz prova testemunhal no sentido de invalidar a anotação de tais controles. Do contrário, não tendo o empregado feito prova da sua jornada de trabalho, prevalecem os cartões de ponto, que, portanto, são considerados válidos.\", \"ADICIONAL NOTURNO Assevera o Reclamante que se ativava habitualmente em jornada noturna. Segue afirmando que a Reclamada não remunerava corretamente o adicional noturno e tampouco considerava a redução da hora noturna para cálculo de horas extras. Razão nenhuma assiste o Reclamante, se não vejamos. Ora, o próprio artigo 73, § 2o da CLT, preceitua que se considera como horário noturno no interregno entre 22h00min às 05h00min, sendo certo que, predominantemente, o Reclamante não laborava em período noturno. Nesse diapasão, vale dizer que, uma vez atingida à jornada noturna, o Reclamante recebia a paga correspondente, acrescida do adicional legal. Portanto, nas ocasiões que houve labor em jornada noturna a Reclamada quitou corretamente o adicional noturno, sob as rubricas \\\"CÓD - 115 ADICIONAL NOTURNO - 20%\\\" como proventos na folha de pagamento e, ainda foi computada a hora reduzida, na forma da lei, conforme faz prova a documentação colacionada aos autos. Na mesma esteira, também indevidos os reflexos pretendidos, tendo em vista a improcedência do principal. Não resta aplicável, ainda que não suscitada na exordial, o item II da S. 60 do E. TST, in verbis: \\\"Adicional noturno. Integração no salário e prorrogação em horário diurno. I - O adicional noturno, pago com habitualidade, integra o salário do empregado para todos os efeitos. (Ex-Súmula n. 60). II - Cumprida integralmente a jornada no período noturno e prorrogada esta, devido é também o adicional quanto às horas prorrogadas.\\\" Tecendo comentários acerca da matéria, vejamos as lições de [PERSON] (Direito do Trabalho, 2011, p. 688): \\\"Todavia, a jurisprudência majoritária deu ao dispositivo legal [§5o do art. 73, CLT] outra interpretação, de que como trabalho extra prestado após às cinco horas da manhã, depois de cumprida integralmente a jornada noturna, deverá ser considerado, ficticiamente, noturno, apesar de ser de fato diurno - Súmula no 60, II, do TST\\\".\", \"A Súmula 437, item I, do C. TST, assim prevê: Súmula no 437 do TST INTERVALO INTRAJORNADA PARA REPOUSO E ALIMENTAÇÃO. APLICAÇÃO DO ART. 71 DA CLT (conversão das Orientações Jurisprudenciais nos 307, 342, 354, 380 e 381 da SBDI-1) - Res. 185/2012, DEJT divulgado em 25, 26 e[NUMBER]I - Após a edição da Lei no 8.923/94, a não-concessão ou a concessão parcial do intervalo intrajornada mínimo, para repouso e alimentação, a empregados urbanos e rurais, implica o pagamento total do período correspondente, e não apenas daquele suprimido, com acréscimo de, no mínimo, 50% sobre o valor da remuneração da hora normal de trabalho (art. 71 da CLT), sem prejuízo do cômputo da efetiva jornada de labor para efeito de remuneração. II - É inválida cláusula de acordo ou convenção coletiva de trabalho contemplando a supressão ou redução do intervalo intrajornada porque este constitui medida de higiene, saúde e segurança do trabalho, garantido por norma de ordem pública (art. 71 da CLT e art. 7o, XXII, da CF/1988), infenso à negociação coletiva. III - Possui natureza salarial a parcela prevista no art. 71, § 4o, da CLT, com redação introduzida pela Lei no 8.923, de 1994, quando não concedido ou reduzido pelo empregador o intervalo mínimo intrajornada para repouso e alimentação, repercutindo, assim, no cálculo de outras parcelas salariais. IV - Ultrapassada habitualmente a jornada de seis horas de trabalho, é devido o gozo do intervalo intrajornada mínimo de uma hora, obrigando o empregador a remunerar o período para descanso e alimentação não usufruído como extra, acrescido do respectivo adicional, na forma prevista no art. 71, caput e § 4o da CLT. Vale dizer que, ao contrário do que afirma o item I da Súmula 437 do C. TST, com a promulgação da citada Lei no 8.923/94, que acresceu o §4o ao artigo 71 da CLT, o legislador previu a seguinte redação: \\\"Art. 71 (omissis) § 4o Quando o intervalo para repouso e alimentação, previsto neste artigo, não for concedido pelo empregador, este ficará obrigado a remunerar o período correspondente com um acréscimo de no mínimo cinqüenta por cento sobre o valor da remuneração da hora normal de trabalho\\\". Ora, a letra da Lei prevê o pagamento do PERÍODO NÃO CONCEDIDO pelo empregador com o acréscimo de no mínimo cinquenta por cento, e não a HORA INTEIRA, sendo a interpretação extensiva Contra Legem. Além do robusto argumento de que Súmula não é Lei, mas mero direcionamento, verifica-se ainda que o entendimento da Súmula 437, I do C.TST afronta literalmente o artigo 71, §4o da CLT e não guarda compatibilidade principiológica com o Código Civil, pois afronta o seu artigo 413.\", \"Em atenção ao princípio da eventualidade, assim não entendendo Vossa Excelência, vale dizer que, considerando-se o gozo de parte considerável do intervalo intrajornada, conforme restará provado em instrução processual, somente é devido o pagamento do restante do período a título de horas extras, nos termos do art. 71, § 4° da CLT. Afigura-se este o entendimento mais justo, posto que o gozo de 1 hora de intervalo intrajornada de forma fracionada é fruto de negociação coletiva que observa as peculiaridades da atividade desenvolvida pelos integrantes da categoria. Portanto, 30 minutos já foram pagos e gozados de forma fracionada e os outros 30 foram usufruídos de forma continua, de modo que certamente caracterizará bis in idem novo pagamento deste título e enriquecimento indevido da reclamante, o que não pode ocorrer. Neste sentido, pede-se vênia para transcrever as seguintes ementas: \\\"A concessão de intervalo intrajornada inferior a uma hora dá direito apenas ao período faltante para completar a hora integral.Fere o senso de justiça o deferimento de uma hora inteira se o intervalo é concedido de forma parcial, eis que não podem ser tratados da mesma maneira o empregador que concede trinta minutos de intervalo e aquele que não concede intervalo algum\\\". ([ORGANIZATION] [NUMBER]RO - Ac. 09aT[NUMBER], DOE[NUMBER]Rel. [JUDGE]) (Grifo nosso) \\\"DO INTERVALO INTRAJORNADA. FRUIÇÃO PARCIAL. DIFERENÇA COM ADICIONAL DE 50%. ART. 71, § 4o, DA CLT. Tendo havido fruição parcial do intervalo intrajornada, somente o tempo faltante é que deve ser pago com o acréscimo legal, pena de enriquecimento ilícito do Autor, sendo aplicável nos termos supra o teor do art. 71, § 4o, da CLT. Recurso ordinário a que se dá provimento, no aspecto\\\". ([ORGANIZATION] [NUMBER]RO - Ac. 07aT[NUMBER], DOE[NUMBER]Rel. [JUDGE]) (Grifo nosso) \\\"Intervalo. Pagamento da diferença. Menciona o parágrafo 4o do artigo 71 da CLT que o adicional é devido pelo \\\"período correspondente\\\" ao intervalo não concedido. Período correspondente é o que não foi desfrutado pelo empregado e não todo o intervalo de uma hora.\", \"O demandante laborava em escala de revezamento 6x1, com folgas gozadas aos sábados ou domingos, conforme tabela pré-estabelecida pela chefia de tráfego, cumprindo seus préstimos predominantemente entre os seguintes horários: 17h00min/17h30min as 00h00min/00h30min. Referida jornada poderia ser menor, a depender do trânsito ou da rendição do obreiro. O reclamante gozava de, no mínimo, 1 hora de intervalo para refeição e descanso diariamente, sendo 30 minutos para refeição e descanso, sem exceção, consoante permissivo da Norma Coletiva da Categoria e os 30/40 minutos restantes goza de maneira fracionada durante a jornada de trabalho conforme o permissivo do parágrafo 5o do artigo 71 da CLT, bem como tinha o período remunerado em folha de pagamento. Por fim, esclarece que o obreiro teve seu contrato de trabalho rescindo em 2012., tendo em vista a aplicação de justa causa por excesso de faltas, percebendo como último salário o valor de R$ 4,89 (quatro reais e oitenta e nove centavos), por hora trabalhada. 6. HORAS EXTRAS E REFLEXOS O demandante alega labor em jornada superior a que efetivamente cumpria, pugna, ainda, por diferenças de horas extras. Cumpre dizer que improcede o pleito. O colaborador em questão laborou em diverso horários sendo predominantemente o período da noite, compreendido entre os horários das 17h00min/17h30min as 00h00min/00h30min. Esclarece as reclamadas que o reclamante recebeu pontualmente as horas extras devidas, acrescidas do respectivo adicional. Basta simplesmente comparar os holerites carreados aos autos e os espelhos de \\\"FOLHA DE PAGAMENTO\\\" carreados pelas reclamadas para verificar de maneira lídima o pagamento integral das horas extraordinárias sob as rubricas CÓD - 104 - HORAS EXTRAS e CÓD.- 111 - HE como proventos na folha de pagamento. Portanto, não há que se falar em pagamento de diferenças de horas extras. Insta considerar que toda a jornada laboral do demandante se encontra anotada em ÚNICA ficha diária de trabalho externo, sendo a anotação realizada pelos fiscais (do ponto de ônibus ou de plantão) e logo em seguida conferida e assinada pelo reclamante, sempre com base nos dias, horários e linha efetivamente trabalhados, resultando inverídicas todas as afirmações em sentido contrário. Esclarece as reclamadas que após 2011 o preenchimento do controle de jornada (fichas) é realizado pelo próprio empregado. Os horários do reclamante foram todos devidamente anotados nos controles de jornada que ora se anexam à defesa, esclarecendo as reclamadas que o documento denominado Relatório de Bordo não se trata de controle de jornada, mas sim de apontamento dirigido à SPTrans acerca da movimentação das linhas, não sendo [LOCATION]provar a jornada do reclamante. Vale dizer ainda que os cartões de ponto possuem presunção de veracidade, a teor da jurisprudência abaixo transcrita, e somente podem ser afastados por prova robusta em sentido contrário, e não por meras ilações contidas na peça inaugural: CARTÃO-PONTO.\"]\n\n[\"QUANTITATIVO DE HORAS EXTRAS - INOBSERVÂNCIA DO JULGADO Equivocado o cálculo da Ré quanto sua apuração das quantidades de horas extras, eis que não observou a jornada fixada na R. Sentença. Restou deferida apuração de horas extras observando a jornada das 13h00 às 1h30 com 30 minutos de intervalo, com tudo, apurou horas extras considerando a que o autor usufruía 50 minutos de intervalo. Pelo acima exposto, resta impugnado o cálculo da reclamada, eis que não observou os termos do julgado. 4. DEDUÇÃO DE VALORES PAGOS A TÍTULO DE DSR'S Equivocado o cálculo da Ré quanto sua apuração dos reflexos das horas extras nos DSR's, eis que os valores que considera para descontos se refere ao DSR's sobre o salário normal recebido pelo autor e não sobre horas extras. Pelo acima exposto, resta impugnado o cálculo patronal, eis que indevidamente deduz de sua apuração valores pagos a título diverso dos deferidos. 5. REFLEXOS DAS HORAS EXTRAS - DEDUÇÃO EM DUPLICIDADE Equivocado o cálculo da reclamada quanto à apuração dos reflexos das horas extras nos 13o salários e férias + 1/3, eis que pela forma de apuração adotada, acaba por deduzir duas vezes os valores pagos. Analisando o cálculo patronal, apurou os reflexos considerando como base as diferenças de horas extras, ou seja, primeiro deduziu os valores pagos, depois apurou os reflexos. Mesmo após apurar os reflexos das horas extras pelas diferenças, deduziram os valores pagos, valores estes que correspondiam a média das horas pagas que não foram consideradas na apuração da média de horas dos períodos aquisitivos. Pelo acima exposto, restam impugnados os cálculos patronais, eis que deduziram duas vezes os valores pagos a título de reflexos de horas extras nas férias + 1/3 e 13o salários. 6. REFLEXOS DAS HORAS EXTRAS NOS DSR'S - CRITÉRIO DE CÁLCULO Também está equivocado o cálculo da reclamada quanto sua apuração das horas extras nos DSR's, eis que considerar como DSR's apenas os domingos, sem considerar os feriados.\"]\n\n--- ATAS DE AUDIENCIA ---\n\nATA DE AUDIÊNCIA \n \n PROCESSO: endo que o [PERSON] trabalhava das 12h50/13h às 01h30/2h, com 15 a 20 minutos de intervalo; que \n ficavam parados em torno de 5 minutos entre uma viagem e outra; que fazia 4 viagens por dia com \n duração de 3h10/3h20 cada; que somente folgavam ou Natal ou Ano Novo, sendo que se folgasse no \n Natal trabalhava no Ano Novo; que tinham 3 folgas mensais; que pode afirmar quanto aos feriados que \n isso ocorria na linha em que o [PERSON] trabalhava, mas não tem certeza quanto as demais; que as fichas \n de controle ficavam com oo plantão. Nada mais. \n \n \n \n \n \n Testemunha única do reclamado(a): [PERSON], [IdentityNumber], casado(a), \n nascido em 1965, residente e domiciliado(a) na [LOCATION], [LOCATION]. Test \n ao argumento de possuir interesse e por ser testemunha contumaz. \n emunha contraditada \n Inquirida, \n Contradita rejeitada, uma vez que não comprovado o interesse bem como como o fato \n negou o interesse. \n de ter sido testemunha anteriormente não o torno suspeito. Protestos do patrono do reclamante. Advertida \n e compromissada. \n que o [PERSON] trabalha para a reclamada desde 1995, na função de \n Depoimento: \n cobrador reserva; que o [PERSON] também era cobrador, sendo que ao que tem conhecimento trabalhava \n principalmente na [LOCATION]; que já fez a [LOCATION] e nessa ocasião fez duas viagens com duração de 3 \n horas cada; que na ficha de controle o horário de entrada já vem impresso, mas confere com o horário de \n pegada, sendo que é o [PERSON] quem anota a saída, anotando corretamente o horário; que tem uma hora \n de intervalo sendo 30 minutos corridos e o restante intercalado entre as viagens; que dependendo da linha \n ficam parados de 5 a 10 minutos entre as viagens; que trabalha na escala 6x1; que trabalha feriados \n alternados; que a ficha de controle permanece com o funcionário durante o dia devolvendo após o \n término da jornada, momento em que anotam o horário de saída; que o [PERSON] trabalha entrando às \n 13h, 14h ou 15h conforme escala informada um dia antes, encerrando às 21h, 22 h ou 23h; que o [PERSON] \n trabalha na garagem Imperador. Nada mais[NUMBER]\n \n As partes não têm outras provas a produzir. Fica encerrada a instrução processual. \n \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [PERSON] - 2015 17:35:43 - cf8e473 \n ID. cf8e473 - Pág. 2 \n Fls. : 5 \n \n As partes \n apresentar razões finais, no prazo comum de 5 dias, sob pena de preclusão. \n poderão \n No mesmo prazo o reclamante poderá se manifestar sobre a defesa e documentos. \n \n Conciliação final rejeitada. \n \n Designa-se audiência de \n \n dia 2015 \n . \n JULGAMENTO para o \n , às 17h31min \n \n As partes serão intimadas da sentença pelo DEJT. \n \n Eventuais petições, peças, documentos, manifestações, embargos, razões finais ou recursos \n doravante juntados com sigilo nestes autos serão desconsideradas para quaisquer fins. \n \n Cientes os presentes . \n \n Audiência encerrada às 16h45min. \n \n Nada mais. \n \n [JUDGE] \n Juiz do Trabalho \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [JUDGE] - 2015 17:35:43 - cf8e473 \n ID. cf8e473 - Pág. 3 \n Fls. : 6 \n \n", "gold_answer.txt": "Aduz o [PERSON], na petição inicial, que cumpria a seguinte jornada de trabalho: de segunda a domingo, das 12h50min/13h às 01h30min/2h, em média. Afirma que laborava na maioria dos domingos e feriados; que havia apenas 3 folgas no mês. Mais, destaca que usufruía de apenas 20min de intervalo intrajornada; que o intervalo interjornada não era observado, bem como o adicional noturno não era adimplido de forma correta. Por tudo isso, requer o pagamento de horas extras, inclusive intrajornada e interjornada, adicional noturno e reflexos legais. As rés, em suma, afirmam que a jornada do [PERSON] era devidamente registrada e que eventuais horas extras foram adimplidas e/ou compensadas. Com parcial razão o [PERSON]. No caso em análise, entendo que os controles de ponto anexados pela [ORGANIZATION] não merecem credibilidade face a marcação quase britânica de horários, praticamente sem variação, com uniformidade próxima da constante, o que não é crível, já que atuando como cobrador no complicado trânsito da cidade de São Paulo seria de se esperar que o [PERSON] não fosse pontual na marcação de sua jornada, como ocorre com os controles trazidos pela [ORGANIZATION]. Destaco ainda, por oportuno, que tanto a testemunha do [PERSON] quanto a da [PERSON] declararam que o horário de entrada já vinha pré-anotado, o que, por si só, já denota a manipulação dos registros pela reclamada, uma vez que o empregado não poderia anotar horário de entrada diverso daquele preenchido previamente. Além disso, observo que a [ORGANIZATION] não trouxe a totalidade dos controles de jornada do período laborado pelo [PERSON]. O e. [ORGANIZATION] tem entendido que o [PERSON] não se desincumbe de seu ônus de provar a jornada laborada quando nos controles de jornada não há qualquer variação de horário de entrada e saída do [PERSON], pelo contrário, nessa situação o empregador atrai para si o ônus da prova (Súmula no 338, III). E ainda, analisando os referidos controles, observo que os horários de saída são anotados com diversas grafias diferentes , o que corrobora a assertiva do autor no sentido de que a marcação era feita pelos fiscais da ré e não pelos próprios empregados, conforme demonstrado pelo depoimento da sua testemunha. Diante de tais fatos, tem-se como verdade processual que a jornada de trabalho não era devidamente registrada, motivo pelo qual entendo que os controles de jornada não refletem a realidade, logo, a jornada disposta na inicial, limitada pela prova testemunhal, deve prevalecer. Pelo exposto, tenho por verdade processual que o autor, de fato, laborou em sobrejornada. Assim sendo, arbitro a jornada obreira da seguinte forma: de segunda a domingo, das 13h às 01h30min, com 01 hora de intervalo intrajornada (sendo 30 minutos corridos e o restante intercalado entre as viagens), com três folgas mensais (trabalhava nove dias e folgava no décimo). Além disso, o autor trabalhou em todos os feriados do ano, com exceção de um (natal ou ano novo). Prosperam, pois as horas extraordinárias excedentes da 7a diária e da 42a semanal (cláusula 50a e 51a, §§ 2o e 4o das CCTs carreadas), de forma não cumulativa, majoradas do adicional legal de 50%. Divisor 210. Defirotambém o pagamento como extra das horas laboradas em prejuízo ao intervalo destinado ao repouso semanal (art. 67 da CLT) no respectivo período. Os domingos e feriados laborados e não compensados deverão ser pagos em dobro, ante a ausência de folga compensatória respectiva. Na base de cálculo das horas extras serão computadas todas as verbas de natureza salarial, conforme o disposto na Súmula no 264 do e. TST. Além disso, tendo em vista que parte da jornada desenvolvida pelo [PERSON] incidia em período considerado noturno, defere-se o pagamento do referido adicional, no patamar legal de 20%, incidente sobre as horas trabalhadas das 22h às 5h, computando-se a hora noturna reduzida, com fundamento no artigo 73, parágrafos 1o e 2o da CLT. Quanto ao intervalo intrajornada, o pedido resta indeferido , tendo em conta que o art. 71, § 5o, da CLT, autoriza o fracionamento do intervalo do motorista de transporte coletivo de passageiros, sendo que a [PERSON] comprovou que fazia intervalo de 30 minutos e o restante era fracionado entre as viagens (fato também corroborado pelo [PERSON] e sua testemunha - 5/10 minutos entre cada viagem). Destaco que, com relação ao intervalo, o ônus da prova era do [PERSON], do qual entendo não ter se desincumbido em razão da colidência no depoimento da sua testemunha e da testemunha das reclamadas. E ainda, indefiro o pedido de pagamento do intervalo interjornadas tendo em vista que, pela jornada retro arbitrada, o intervalo de 11 horas entre cada jornada era respeitado pelas rés. Por fim, para evitar enriquecimento sem causa do [PERSON], determino que eventuais horas extras já adimplidas sejam deduzidas, tudo com base nos recibos salariais colacionados aos autos, observados os ditames da OJ 415 da [ORGANIZATION] do e. TST. Além disso, sob o argumento de que a sua elevada carga horária configura a existência de dupla jornada, postula o [PERSON] o pagamento de vale refeição e cesta básica dos dias em que houve dupla jornada , bem como dos dias em que laborou em domingos, feriados e folgas em compensação. Por outro lado, entendo que as horas laboradas além da sua jornada normal dão ensejo apenas ao pagamento de horas extras e não configuram dupla jornada, da forma como postulado.", "generated_answer.txt": "Na exordial aduz o reclamante que se ativava das 12h50/13h às 01h30min/02h, com 30 minutos de intervalo e três folgas mensais. Pugna por horas extras e reflexos.\nAo revés sustenta a reclamada que o autor laborava em horários variados, predominantemente das 17h00/17h30min às 00h00/00h30min, em escala 6x1, com uma hora de intervalo, sendo 30 minutos contínuos e o restante fracionado, conforme norma coletiva.\nEm depoimento pessoal, o preposto da ré admitiu que \"o horário de entrada já vem pré-anotado nas fichas de controles e o horário de saída é anotado pelo próprio empregado\", o que, por si só, invalida os controles de jornada apresentados, pois não refletem a real jornada cumprida.\nA testemunha do reclamante, por sua vez, corroborou a tese da Inicial, ao declarar que \"as fichas de controle eram preenchidas pelo plantão mas os horários não conferiam sendo que o depoente trabalhava das 12h50/13h às 01h30/2h, com 15 a 20 minutos de intervalo\".\nJá a testemunha da reclamada prestou depoimento vago e que não se presta a infirmar o dito pela testemunha obreira, limitando-se a descrever sua function valueBadgeClass(v) {
  if (v === null || v === undefined) return 'vbadge-null';
  const u = String(v).toUpperCase();
  if (u.includes('GRANTED') || u.includes('SUFFICIENT') || u.includes('SUPPORTS_CLAIMANT') || u.includes('UPHELD') || u.includes('CREDITED'))
    return 'vbadge-granted';
  if (u.includes('DENIED') || u.includes('INSUFFICIENT') || u.includes('AGAINST_CLAIMANT') || u.includes('REJECTED'))
    return 'vbadge-denied';
  if (u.includes('PARTIAL'))

  return 'vbadge-neutral';
}

/* LCS-based merge of two path arrays preserving order from both */
function mergePathsLCS(pathA, pathB) {
  const m = pathA.length, n = pathB.length;
  // Build LCS table
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (pathA[i-1] === pathB[j-1]) dp[i][j] = dp[i-1][j-1] + 1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  // Backtrack to get merged sequence
  const merged = [];
  let i = m, j = n;
  // We'll collect in reverse, then flip
  const revMerged = [];
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && pathA[i-1] === pathB[j-1]) {
      revMerged.push({node: pathA[i-1], inA: true, inB: true});
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      revMerged.push({node: pathB[j-1], inA: false, inB: true});
      j--;
    } else {
      revMerged.push({node: pathA[i-1], inA: true, inB: false});
      i--;
    }
  }
  return revMerged.reverse();
}

  }

  const box = document.createElement('div');
  box.className = 'tree-node ' + diffClass;

  const nameSpan = document.createElement('span');
  nameSpan.className = 'node-name';
  nameSpan.textContent = name;
  box.appendChild(nameSpan);

  const val = assignment ? assignment.value : null;
  const badge = document.createElement('span');
  badge.className = 'node-value ' + valueBadgeClass(val);
  badge.textContent = val !== null && val !== undefined ? val : 'null';
  box.appendChild(badge);

  // Inline basis tags
  if (assignment && assignment.basis_tags && assignment.basis_tags.length) {
    const basisLine = document.createElement('span');
    basisLine.className = 'node-basis';
    assignment.basis_tags.forEach(t => {

      tag.className = 'basis-tag';
      tag.textContent = t;
      basisLine.appendChild(tag);
    });
    box.appendChild(basisLine);
  }

  // Detail area
  const detail = document.createElement('div');
  detail.className = 'tree-detail';
  if (assignment) {
    if (assignment.supporting_text) {
      detail.innerHTML += '<div><span class="label">Supporting text:</span><div class="supporting-text">' + escHtml(assignment.supporting_text) + '</div></div>';
    }
    if (assignment.basis_tags && assignment.basis_tags.length) {
      let html = '<div><span class="label">Basis tags: </span>';
      assignment.basis_tags.forEach(t => { html += '<span class="basis-tag">' + escHtml(t) + '</span>'; });
      html += '</div>';
      detail.innerHTML += html;
    }
  }

  box.addEventListener('click', () => {
    detail.classList.toggle('open');
    // Sync expand: find the paired row on the other side
    const rowIndex = box.getAttribute('data-row-idx');
    if (rowIndex !== null) {
      const otherDetail = document.querySelector(
        (box.closest('#goldTree') ? '#genTree' : '#goldTree') +

  row.appendChild(detail);

  arrow.className = 'tree-arrow';
  row.appendChild(arrow);

/* Compare two basis_tags arrays */
function basisMatch(a, b) {
  const aSet = (a || []).slice().sort().join('|');
  const bSet = (b || []).slice().sort().join('|');
  return aSet === bSet;
}

function renderAlignedTrees(goldContainer, genContainer, indicatorContainer, summaryContainer, goldStr, genStr) {

  indicatorContainer.innerHTML = '';

  let goldG, genG;

  try { genG = genStr ? JSON.parse(genStr) : null; } catch(e) { genG = null; }

  if (!goldG && !genG) {
    goldContainer.innerHTML = '<div class="empty">No graph data</div>';
    genContainer.innerHTML = '<div class="empty">No graph data</div>';

  const genAssign = genG ? (genG.assignments || {}) : {};

  const merged = mergePathsLCS(goldPath, genPath);

  let matchCount = 0, basisDiffCount = 0, divergeCount = 0, pathDiffCount = 0;

      const valuesMatch = goldVal === genVal;

        genDiff = 'diff-match';
        indicatorClass = 'ind-match';

        const goldArrow = goldRow.querySelector('.tree-arrow');
        const arrowH = (goldArrow && goldArrow.offsetHeight > 0) ? goldArrow.offsetHeight : 0;
        const nodePartH = rowH - arrowH;
        indRow.style.height = Math.max(nodePartH, 14) + 'px';
      }
      indIdx++;

      // Set spacer height to match arrow
      if (indIdx < indChildren.length && r < merged.length - 1) {
        const goldArrow = goldRow.querySelector('.tree-arrow');
        const arrowH = (goldArrow && goldArrow.offsetHeight > 0) ? goldArrow.offsetHeight : 0;
        const spacer = indChildren[indIdx];
        if (spacer) spacer.style.height = arrowH + 'px';
        indIdx++;
      }
    }
  }

  // Store for re-alignment on detail toggle
  window._alignIndicators = alignIndicators;
  requestAnimationFrame(alignIndicators);

  // Side nodes (in assignments but not in path)
  const goldPathSet = new Set(goldPath);
  const genPathSet = new Set(genPath);

  function addSideNodes(container, assignments, pathSet) {
    const sideNames = Object.keys(assignments).filter(k => !pathSet.has(k));
    if (sideNames.length) {
      const label = document.createElement('div');
      label.className = 'side-nodes-label';
      label.textContent = 'Side nodes';
      container.appendChild(label);
      sideNames.forEach(name => {
        container.appendChild(buildSideNode(name, assignments[name]));
      });
    }
  }

  if (goldG) addSideNodes(goldContainer, goldAssign, goldPathSet);
  if (genG) addSideNodes(genContainer, genAssign, genPathSet);

  // Extras
  if (goldG) renderExtras(goldContainer, goldG);
  if (genG) renderExtras(genContainer, genG);

  // Diff summary bar
  summaryContainer.innerHTML =
    '<strong>Diff:</strong> ' +
    '<span class="diff-stat"><span class="diff-dot match"></span> ' + matchCount + '/' + totalNodes + ' full match</span>' +
    '<span class="diff-stat"><span class="diff-dot basis"></span> ' + basisDiffCount + ' basis difference' + (basisDiffCount !== 1 ? 's' : '') + '</span>' +
    '<span class="diff-stat"><span class="diff-dot diverge"></span> ' + divergeCount + ' value difference' + (divergeCount !== 1 ? 's' : '') + '</span>' +
    '<span class="diff-stat"><span class="diff-dot missing"></span> ' + pathDiffCount + ' path difference' + (pathDiffCount !== 1 ? 's' : '') + '</span>';
}

function loadCase(key) {
  const [judge, caseId] = key.split('/');
  const c = DATA[judge][caseId];
  document.getElementById('caseIdDisplay').textContent = judge.replace(/_/g, ' ') + '  ·  ' + caseId;
  document.getElementById('questionText').textContent = c['question.txt'] || '(no question file)';
  document.getElementById('goldAnswer').textContent = c['gold_answer.txt'] || '(no gold answer)';
  document.getElementById('genAnswer').textContent = c['generated_answer.txt'] || '(no generated answer)';
  renderAlignedTrees(
    document.getElementById('goldTree'),
    document.getElementById('genTree'),
    document.getElementById('treeIndicators'),
    document.getElementById('diffSummary'),
    c['gold_graph.json'],
    c['generated_graph.json']
  );
}

sel.addEventListener('change', () => loadCase(sel.value));
if (sel.options.length) loadCase(sel.options[0].value);
</script>
