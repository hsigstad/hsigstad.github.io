<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Comparison Viewer — eval4_graph</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: #f5f5f5; color: #222; }
header { background: #1a1a2e; color: #eee; padding: 12px 24px; display: flex;
         align-items: center; gap: 18px; flex-wrap: wrap; }
header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
header select { font-size: 14px; padding: 6px 10px; border-radius: 4px;
                border: 1px solid #555; background: #16213e; color: #eee; max-width: 500px; }
header select optgroup { color: #ccc; background: #16213e; }
header select option { color: #eee; }
.case-id { font-size: 13px; color: #aaa; margin-left: auto; }

.container { padding: 16px 24px; display: flex; flex-direction: column; gap: 16px; }

/* Collapsible question */
details.question { background: #fff; border: 1px solid #ddd; border-radius: 6px; }
details.question summary { padding: 10px 16px; cursor: pointer; font-weight: 600;
                           font-size: 14px; color: #555; user-select: none; }
details.question pre { padding: 12px 16px; white-space: pre-wrap; word-wrap: break-word;
                       font-size: 13px; line-height: 1.5; max-height: 400px; overflow-y: auto;
                       border-top: 1px solid #eee; }

/* Side-by-side panels */
.panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.panel-col { background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
.panel-col h2 { font-size: 13px; font-weight: 600; padding: 8px 14px;
                background: #f0f0f0; border-bottom: 1px solid #ddd; }
.panel-col h2.gold { background: #e8f5e9; color: #2e7d32; }
.panel-col h2.gen  { background: #e3f2fd; color: #1565c0; }

/* Text panel */
.text-body { padding: 12px 14px; white-space: pre-wrap; word-wrap: break-word;
             font-size: 13px; line-height: 1.55; max-height: 500px; overflow-y: auto; }

/* Diff summary bar */
.diff-summary { display: flex; gap: 16px; padding: 10px 16px; background: #fff;
                border: 1px solid #ddd; border-radius: 6px; font-size: 13px;
                align-items: center; flex-wrap: wrap; }
.diff-stat { display: inline-flex; align-items: center; gap: 5px; }
.diff-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.diff-dot.match { background: #4caf50; }
.diff-dot.basis { background: #ffca28; }
.diff-dot.diverge { background: #ef5350; }
.diff-dot.missing { background: #9e9e9e; }

/* Tree diff layout — 3-column: gold | indicators | gen */
.tree-diff-area { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 6px; }
.tree-col { background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
.tree-col h2 { font-size: 13px; font-weight: 600; padding: 8px 14px;
               border-bottom: 1px solid #ddd; }
.tree-col h2.gold { background: #e8f5e9; color: #2e7d32; }
.tree-col h2.gen  { background: #e3f2fd; color: #1565c0; }
.tree-body { padding: 12px 14px; }

/* Center indicator column — padding-top computed by JS to match h2+body padding */
.tree-indicators { display: flex; flex-direction: column; align-items: center; }
.indicator-row { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.indicator-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid transparent; }
.indicator-dot.ind-match { background: #4caf50; border-color: #388e3c; }
.indicator-dot.ind-diverge { background: #ef5350; border-color: #c62828; }
.indicator-dot.ind-basis { background: #ffca28; border-color: #f9a825; }
.indicator-dot.ind-missing { background: #bdbdbd; border-color: #9e9e9e; }
/* spacer for arrows between rows */
.indicator-spacer { flex-shrink: 0; }

/* Flowchart node */
.tree-row { position: relative; margin-bottom: 0; }
.tree-row:not(:last-child) .tree-arrow { display: block; }
.tree-arrow { display: none; width: 2px; height: 16px; background: #bbb;
              margin: 0 auto; position: relative; }
.tree-arrow::after { content: ''; position: absolute; bottom: 0; left: 50%;
                     transform: translateX(-50%); border-left: 5px solid transparent;
                     border-right: 5px solid transparent; border-top: 6px solid #bbb; }

.tree-node { border: 2px solid #e0e0e0; border-radius: 6px; padding: 8px 12px;
             font-size: 12px; cursor: pointer; user-select: none;
             transition: border-color 0.15s, background 0.15s; position: relative; }
.tree-node:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.tree-node .node-name { font-family: monospace; font-weight: 700; font-size: 12px; }
.tree-node .node-value { display: inline-block; padding: 1px 7px; border-radius: 3px;
                         font-size: 11px; font-weight: 600; margin-left: 6px; }

/* Basis tags inline on node */
.tree-node .node-basis { display: block; margin-top: 3px; }

/* Diff states */
.tree-node.diff-match { border-color: #4caf50; }
.tree-node.diff-basis { border-color: #ffca28; background: #fffde7; }
.tree-node.diff-diverge { border-color: #ef5350; background: #ffebee; }
.tree-node.diff-missing { border-color: #bbb; border-style: dashed; background: #fafafa; }
.tree-node.diff-placeholder { border: 2px dashed #ddd; background: #f9f9f9;
                               min-height: 36px; display: flex; align-items: center;
                               justify-content: center; color: #bbb; font-style: italic;
                               font-size: 11px; }

/* Value semantic colors */
.vbadge-granted { background: #e8f5e9; color: #2e7d32; }
.vbadge-denied { background: #ffebee; color: #c62828; }
.vbadge-partial { background: #fff8e1; color: #f57f17; }
.vbadge-neutral { background: #f5f5f5; color: #555; }
.vbadge-null { background: #f5f5f5; color: #999; font-style: italic; }

/* Expandable detail */
.tree-detail { display: none; padding: 8px 12px; font-size: 12px;
               border-top: 1px solid #eee; margin-top: 6px; }
.tree-detail.open { display: block; }
.tree-detail .label { font-weight: 600; color: #555; }
.tree-detail .supporting-text { color: #555; font-style: italic; margin: 2px 0 6px 0; }
.basis-tag { display: inline-block; background: #fff3e0; color: #e65100; padding: 1px 6px;
             border-radius: 3px; font-size: 11px; margin: 1px 2px; font-family: monospace; }

/* Side nodes cluster */
.side-nodes-label { font-size: 11px; color: #888; margin-top: 12px; margin-bottom: 4px;
                    font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.side-node { border: 1px solid #e0e0e0; border-radius: 4px; padding: 6px 10px;
             margin-bottom: 6px; font-size: 12px; cursor: pointer; user-select: none; }
.side-node .node-name { font-family: monospace; font-weight: 700; }
.side-node .node-value { display: inline-block; padding: 1px 7px; border-radius: 3px;
                         font-size: 11px; font-weight: 600; margin-left: 6px; }
.side-detail { display: none; padding: 6px 10px; font-size: 12px; border-top: 1px solid #eee;
               margin-top: 4px; }
.side-detail.open { display: block; }

/* Derived & warnings below trees */
.extra-section { margin-top: 8px; padding: 8px 12px; font-size: 12px;
                 border-top: 1px solid #eee; }
.extra-section .section-title { font-weight: 700; font-size: 12px; color: #444;
                                margin-bottom: 4px; }
.derived { font-family: monospace; font-size: 12px; }
.derived span { font-weight: 600; }
.warnings { color: #e65100; font-size: 12px; font-style: italic; }

.empty { color: #999; font-style: italic; padding: 12px; }
</style>
</head>

<header>
  <h1>Case Comparison Viewer</h1>
  <select id="caseSelect"></select>

</header>

<div class="container">

      <div class="text-body" id="goldAnswer"></div>

    <div class="panel-col">

      <div class="text-body" id="genAnswer"></div>

  <h3 style="font-size:14px; color:#555; margin-top:4px;">Decision Graph</h3>
  <div id="diffSummary" class="diff-summary"></div>
  <div class="tree-diff-area" id="treeDiffArea">
    <div class="tree-col">
      <h2 class="gold">Gold Graph</h2>
      <div class="tree-body" id="goldTree"></div>
    </div>
    <div class="tree-indicators" id="treeIndicators"></div>
    <div class="tree-col">
      <h2 class="gen">Generated Graph</h2>
      <div class="tree-body" id="genTree"></div>
    </div>
  </div>
</div>

60 (sessenta) minutos destinados à alimentação e repouso não desfrutado, como hora extraordinária. Destarte, faz jus, a Reclamante, ao percebimento de 60 (sessenta) minutos diários, com o adicional de hora extra, e reflexo em DSR’s, e com estes em férias + 1/3, 13o salário, aviso prévio, FGTS multa de 40%, uma vez que NÃO gozava do seu intervalo para refeição e descanso como previsto no artigo 71 da CLT. 07.- REFLEXOS DAS HORAS EXTRAS NOS DSR’S A Reclamante nunca recebeu os reflexos das horas extras sobre os DSR’s (Sumula 172 do C. TST) fazendo jus aos mesmos. Devido ao não pagamento dos reflexos das horas extras nos DSR’s, deixaram de ser integrados nas férias, 13o salários e recolhimento do FGTS, fazendo jus às diferenças com as correções legais, a serem apuradas em regular execução de sentença.\", \"HORAS EXTRAS A Reclamante cumpria jornada de trabalho em escala de 6 x 1, das 06h00 às 12:20 e das 07:00 às 13:20, com apenas uma pausa de 20 (vinte) minutos diários, que poderia ocorrer em duas pausas de 10 (dez) minutos cada uma. Registre-se que a Reclamante foi contratada para laborar seis horas diárias e trinta e seis horas semanais, porém, desde sua admissão, em total desrespeito, a Reclamante foi obrigada a laborar 20 (VINTE) minutos acima da sexta hora, já que laborava 06h20min diários. Em média a Reclamante laborava, considerando as jornadas excedentes acima mencionada, em média 01:00 hora semanal e 04:00 horas mensais, isso considerando a sexta diária e trigésima sexta semanal, as quais não eram pagas corretamente, já que algumas horas extras foram pagas. Pelo que se observa do caso, a Reclamante sempre trabalhou em jornada extraordinária, porém, as Reclamadas NUNCA remuneraram tal jornada corretamente nos meses, já que diariamente e semanalmente, se analisado os fatos, a jornada era extrapolada, sendo devidas horas extras por essa razão.\", \"Não obstante o acima mencionado, o Ministério do Trabalho e Emprego, através da Secretaria de Inspeção do Trabalho, aprovou, por meio da Portaria no 09, de 30 de março de 2007, publicada em 2007 no Diário Oficial da União, o Anexo II da NR 17, que dispõe, em resumo que segue, sobre o trabalho em tele atendimento e telemarketing, estipulando as seguintes regras a serem obedecidas e seguidas pelas empresas com relação à jornada de trabalho, merecendo destaque: - trabalho de 06 horas diárias, no máximo, incluí­das as pausas e o tempo necessário para a atualização do conhecimento do operador e para o ajuste do posto de trabalho, considerados como parte da jornada normal; - não haverá atividade aos domingos e feriados, seja total ou parcial, exceto nas empresas autorizadas previamente pelo Ministério do Trabalho e Emprego; - é assegurado aos trabalhadores, nos casos previamente autorizados, pelo menos um dia de repouso semanal remunerado coincidente com o domingo a cada mês, independentemente de metas, faltas e/ou produtividade; - as escalas de fins de semana e de feriados devem ser especificadas e informadas aos trabalhadores com a antecedência necessária, conforme previsto na CLT ou em acordos ou convenções coletivas e, os empregadores, deverão levar em consideração na elaboração das escalas necessidades especiais dos trabalhadores; - a duração das jornadas de trabalho somente poderá prolongar-se além do limite previsto nos termos da lei em casos excepcionais, por motivo de força maior, necessidade imperiosa ou para a realização ou conclusão de serviços inadiáveis ou cuja inexecução possa acarretar prejuí­zo manifesto, realizando a comunicação à autoridade competente no prazo de 10 (dez) dias e, havendo prorrogação, será obrigatório um descanso mí­nimo de 15 (quinze) minutos antes do iní­cio do perí­odo extraordinário do trabalho. - para prevenir sobrecarga psí­quica, muscular estática de pescoço, ombros, dorso e membros superiores, as empresas devem permitir a fruição de pausas de descanso e intervalos para repouso e alimentação aos trabalhadores, que deverão ser concedidas fora do posto de trabalho, em dois perí­odos de 10 (dez) minutos contí­nuos, após os primeiros e antes dos 60 (sessenta) últimos minutos de trabalho. Estas pausas não se confundem com o intervalo obrigatório para repouso e alimentação, assim, devem ser concedidas independentemente do intervalo, que deve ser de 20 (vinte) minutos; - para tempos de trabalho efetivo de tele atendimento/telemarketing de até 04 (quatro) horas diárias, deve ser observada a concessão de 01 pausa de descanso contí­nua de 10 (dez) minutos; A Portaria em análise prevê, ainda, garantia de pausas no trabalho em operações especialmente desgastantes, ou quando os trabalhadores sofrerem ameaças, abuso verbal, agressões, a fim de permitir ao operador recuperar-se e socializar conflitos e dificuldades com colegas, supervisores ou profissionais de saúde ocupacional.\", \"DAS DIFERENÇAS DO FGTS + 40% Conforme já exposto, o Reclamante fazia muitas horas extras, trabalhava em domingos e feriados, e esses direitos nunca foram observados para efeito de recolhimento correto do FGTS e INSS. Por conta disso, devem as Reclamadas serem condenadas ao pagamento das diferenças do FGTS + 40% de todo o período, observando-se para tanto as horas extras pagas a menor.\"]\n\n--- CONTESTACAO ---\n\n[\"- Rel. [PERSON] - DJe[NUMBER] INTERVALO DO ARTIGO 72 - DA CLT - Para a configuração da atividade de digitador, não basta o labor em terminal de computador. O direito ao intervalo previsto no art. 72 da CLT somente incide nas hipóteses de trabalho exclusivo e permanente com digitação. ([ORGANIZATION] - Proc[NUMBER]Rel. Des. [PERSON] - DJe[NUMBER] DIGITADOR - INTERVALO - OPERADOR DE TELEMARKETING - ATIVIDADES RELACIONADAS AO ATENDIMENTO TELEFÔNICO AO CLIENTE - A função de digitador pressupõe o trabalho exclusivo, mecânico e repetitivo de inserção de dados. Função de digitador não caracterizada. ([ORGANIZATION] - Proc[NUMBER]Rel. Des. Fed. [PERSON] - 2011 ) Outrossim, os cartões pontos ora acostados, refletem com rigor a realidade, e todas as eventuais horas extraordinárias foram devidamente remuneradas com o devido adicional previsto nas CCT's, conforme recibos de salários em anexo. Sendo assim, quanto ao pleito do pagamento de horas extras impagas, bem como dos reflexos que entende cabíveis, aduz-se que este não desenvolveu atividades além da carga horária prevista, e, sempre gozou do intervalo para descanso e remuneração a que tinha direito. Diante das evidências apresentadas, confirma-se que não havia habitualidade na realização de horas extras a caracterizar integração à remuneração e consequentes reflexos. Importante evidenciar, o entendimento do TRT2, em caso análogo, declarando indevidas, eventuais horas extras, quando há registro de cartão ponto assinado pela Reclamante, com anotações de horários não uniformes as quais atendem a jornada de trabalho para a qual a Reclamante foi contratada. \\\"DAS HORAS EXTRAS - SEM RAZÃO - Embora a jornada fosse cumprida externamente, o próprio reclamante confirmou \\\"(...) que anotava cartão de ponto (...)\\\", pelo que considero válidos os registros de horários apresentados pela reclamada, assinados pelo reclamante em sua totalidade, os quais apresentam anotações de horários não uniformes e demonstram o cumprimento da jornada contratual de segunda a sexta-feira, das 8h às 17h e aos sábados, das 8h às 12h, pelo que restam indeferidas as horas extras excedentes da 8a diária e da 44a semanal. Outrossim, cabia ao autor demonstrar diferenças de horas extras devidas e não pagas ou então comprovar que as informações constantes das folhas de ponto são inverídicas, ônus do qual não se desincumbiu. [...] ([ORGANIZATION] - RO[NUMBER]a T. - Rela [PERSON] - 2014 ) Dessa forma, improcedem os pedidos de horas extras praticadas além da 6a diária e da 36a semanal, bem como as decorrentes dos intervalos intrajornada não concedidos, com todos os reflexos e integrações pleiteadas, eis que se tratam de meros acessórios. Logo, quanto ao pleito do pagamento de horas extras impagas, intervalos intrajornada suprimidos, bem como dos reflexos e integrações que entende cabíveis, aduz-se que esta não desenvolveu atividades além da carga horária prevista, e, sempre gozou do intervalo para descanso e remuneração a que tinha direito. Frisa-se, improcede o pedido de integração dos valores de horas extras, uma vez que eram realizadas apenas eventualmente. Negando a ora contestante o trabalho extraordinário, constitui ônus da Reclamante a prova de que ainda tem algo a receber a este título, por força do artigo 373 do NCPC, como fato constitutivo do que pretende seja seu direito. Assim, improcedem os pedidos de pagamento de horas extras, reflexos e integrações pleiteadas, eis que se tratam de meros acessórios. Do Descanso Semanal Remunerado A Reclamada que sempre concedeu e remunerou corretamente o descanso semanal da Reclamante, efetuando o pagamento na forma prescrita em lei, considerando sua correta remuneração, inexistindo qualquer irregularidade ou diferença em favor da Autora. Outrossim, aduz-se ainda que, tendo havido faltas injustificadas e suspensão, a Reclamante, quando não cumpriu integralmente com seu horário de trabalho, pode ter eventualmente perdido, além do dia falta, a remuneração do dia de Repouso Semanal, tudo de acordo com o quanto determina a Lei 605 de 1949.\", \"Das Horas Extras e respectivos reflexos Como se esclareceu anteriormente, a Autora trabalhou em escala de 6x1, das 07h às 13h20m, em jornada de 6 horas diárias, sempre com um intervalo de 20 minutos e duas pausas de 10 minutos cada, e uma folga por semana, preferencialmente aos domingos, totalizando 36 semanais. Todo o trabalho extraordinário foi corretamente registrado e remunerado como tal, como comprovam os controles de horário e recibos de salário em anexo. A Reclamante gozou de intervalo de 20 minutos para alimentação e ainda mais duas pausas de dez minutos cada, de modo a atender plenamente o quanto determina a legislação vigente para uma carga horária de seis horas, conforme o artigo 71, §1o da CLT, a NR 17 e a Convenção Coletiva da categoria. Ainda, frente ao caráter não habitual da jornada além das seis horas diárias, nos termos da Súmula 437, IV, do TST, não é ilegal eventual não concessão do intervalo de 1 hora. Da mesma forma, o eventual trabalho em domingos e feriados sempre foi pago com o devido adicional, quando não compensado com folga em outro dia da semana. Ademais, a Reclamante não apontou, ainda que por mera amostragem, os feriados e domingos em que teria laborado, nem as diferenças de horas extras que seriam devidas.\", \"Segundo a inicial, a Reclamante laborava em escala de 6x1, das 06h às 12h20m e das 07h às 13h20m, com 20 minutos de intervalo para refeição e descanso e duas pausas de 10 minutos cada. Refere que jamais lhe foi concedido o intervalo de 10 minutos a cada 90 minutos laborados, o intervalo de 1h em razão da sobrejornada, bem como não foram remunerados os feriados e domingos laborados.\", \"Quanto ao horário de trabalho, refere-se que a Reclamante laborava em escala de 6x1, das 07h às 13h20m, realizando jornada de 6 horas diárias, sempre com 20 minutos de intervalo e duas pausas de 10 minutos cada, nunca excedendo 36 horas semanais, com uma folga, preferencialmente aos domingos. Normalmente não havia trabalho além desse horário. Todavia, eventual trabalho extraordinário foi corretamente remunerado como tal, assim como os trabalhos em domingos e feriados, como comprovam os recibos de salário e os controles de ponto ora acostados.\", \"A realização de outras atividades concomitantes, sem a digitação permanente, como in casu, afasta o direito à jornada de 6 horas e ao intervalo especial. Recurso ordinário a que se nega provimento. (TRT-02a R. - RO[NUMBER]a T. - Rel. [PERSON] - 2014 ) INTERVALO DO DIGITADOR - A realidade contratual do autor revela a inaplicação analógica das disposições do artigo 72 da CLT .\"]\n\n--- ATAS DE AUDIENCIA ---\n\n[ORGANIZATION] \n [ORGANIZATION] \n [ORGANIZATION] DE [LOCATION] \n \n ATA DE AUDIÊNCIA \n \n PROCESSO: \n [NUMBER]\n Reclamante: \n [PERSON] \n Reclamado: \n [ORGANIZATION] e outro \n Em 2016, na [LOCATION]sessões da [ORGANIZATION] \n DE [LOCATION]/[LOCATION], sob a presidência da Exmo(a). Juíza DANIELLE SANTIAGO FERREIRA DA \n ROCHA, realizou-se audiência relativa ao processo identificado em epígrafe. \n Às 13h47min, aberta a audiência, foram, de ordem da Exmo(a). Juíza do Trabalho, apregoadas \n as partes. \n Presente o(a) reclamante, acompanhado(a) do(a) advogado(a), Dr(a). ELOI SANTOS DA \n SILVA, OAB no 140961/SP. \n Presente o preposto do(a) reclamado(a) [ORGANIZATION], Sr(a). \n [PERSON], acompanhado(a) do(a) advogado(a), Dr(a). [PERSON] \n [PERSON], [ORGANIZATION] no 180459/SP. \n Ausente o(a) reclamado(a) [ORGANIZATION] e seu advogado. \n Ausente a(o) reclamada(o) [ORGANIZATION] apesar de regularmente notificada(o). Aplicam-se à \n reclamada, ausente, a revelia e confissão quanto à matéria de fato, nos limites da lei e dos elementos de \n convicção constantes dos autos, face a citação válida da mesma. \n Primeira tentativa de acordo frustrada. \n Requer o(a) reclamante o adiamento da presente audiência tendo em vista que sua testemunha, embora \n convidada, não compareceu. INDEFERE-SE, pois o(a) reclamante, apesar de devidamente intimado(a), \n NÃO apresentou rol de testemunhas no prazo deferido. Protestos. \n Apresentada(s) defesa(s) escrita(s) com documentos, com réplica já protocolada pela [PERSON] \n nos autos, razão pela qual não há que se falar em deferimento do prazo para réplica. \n A [PERSON] já apresentou réplica, inclusive, com quadro demonstrativo de horas extras, razão \n pela qual as partes ficam advertidas que não será permitida a produção de prova oral quanto a jornada de \n trabalho diante do reconhecimento da validade dos registros de jornada trazidos pela primeira [PERSON]. \n Protestos. \n Depoimento pessoal do(a) [PERSON]:“ desligou-se da [PERSON] porque estava se sentindo \n perseguida . Nada mais\"; \n Dispensado o depoimento pessoal do(a) preposto(a) da(s) [PERSON](s). \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: DANIELLE SANTIAGO FERREIRA DA ROCHA - 2016 15:23:21 - 66f05e6 \n ID. 66f05e6 - Pág. 1 \n Fls. : 3 \n \n O(a) reclamante não apresentou testemunhas. \n Primeira testemunha do(a) reclamado(a): [PERSON], RG/CPF no \n 23473974, residente e domiciliado(a) na [LOCATION]., [LOCATION], [LOCATION] -[LOCATION]. \n \n Advertida e compromissada. Depoimento:“ trabalha para a reclamada desde 2013, atualmente como \n supervisor; trabalhou com a reclamante, mas não foi supervisor da mesma; a reclamante pediu demissão, \n mas não explicou os motivos; a reclamante não era perseguida no local de trabalho; a Sra. [PERSON] era a \n supervisora da reclamante. Nada mais\"; \n As partes não têm outras provas a produzir. \n Fica encerrada a instrução processual. \n Razões finais no prazo comum de 5 dias, podendo a reclamada se manifestar sobre o quadro \n demonstrativo de horas extras, sob pena de preclusão \n Conciliação final rejeitada. \n Para \n \n JULGAMENTO designa-se a data de06/05/2016, às 13:50 horas. \n Cientes os presentes que a sentença será publicada nos termos da SÚMULA 197 DO COL. \n [ORGANIZATION]. \n Audiência encerrada às 13:55 horas. \n Nada mais. \n Ata assinada eletronicamente, nos termos da Lei n.o[NUMBER], art. 8o, § único. \n \n [JUDGE] \n [JUDGE] \n \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [PERSON] - 2016 15:23:21 - 66f05e6 \n ID. 66f05e6 - Pág. 2 \n Fls. : 4 \n \n\n\n[ORGANIZATION] \n [ORGANIZATION] \n 11a VARA DO TRABALHO DA ZONA [LOCATION] \n \n ATA DE AUDIÊNCIA \n \n PROCESSO: \n [NUMBER]\n Reclamante: \n [PERSON] \n Reclamado: \n [ORGANIZATION] e outro \n Em 2017, na [LOCATION]sessões da [ORGANIZATION] DA ZONA \n LESTE DE [LOCATION]/SP, sob a presidência da Exmo(a). [JUDGE] \n DA ROCHA, realizou-se audiência relativa ao processo identificado em epígrafe. \n Às 12h02min, aberta a audiência, foram, de ordem da Exmo(a). Juíza do Trabalho, apregoadas \n as partes. \n Ausente o(a) reclamante e o seu advogado(a). \n Presente o preposto do(a) reclamado(a) [ORGANIZATION], Sr(a). \n [PERSON], acompanhado(a) do(a) advogado(a), Dr(a). [PERSON] \n [PERSON], [ORGANIZATION] no 272475/[LOCATION]. \n Presente o preposto do(a) reclamado(a) [ORGANIZATION], Sr(a). [PERSON] \n [PERSON], acompanhado(a) do(a) advogado(a), Dr(a). [PERSON] \n [PERSON], [ORGANIZATION] no 165351/[LOCATION]. \n CONCILIAÇÃO PREJUDICADA. \n A reclamante protelou indevidamente o feito, pois logrou êxito em anular a sentença de mérito \n com o único objetivo de ouvir a sua testemunha. A presente audiência foi designada para isso e sem \n qualquer justificativa, não compareceram a reclamante e respectiva testemunha, razão pela qual, condena- \n se a parte autora em multa equivalente a 9% do valor da causa em benefício de cada uma das reclamadas. \n As reclamadas não têm outras provas a produzir. \n Fica encerrada a instrução processual. \n Designa-se para \n a data de \n JULGAMENTO \n 2017, às 18h20min. \n Cientes os presentes que a sentença será publicada nos termos da Súmula 197 do col. [ORGANIZATION]. \n Intime-se a reclamante pelo [ORGANIZATION]. \n Audiência encerrada às 12h06min. \n Nada mais. \n Ata assinada eletronicamente, nos termos da Lei n.o[NUMBER], art. 8o, § único. \n \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [PERSON] - [NUMBER]:34:14 - 8e313c7 \n ID. 8e313c7 - Pág. 1 \n Fls. : 23 \n \n [JUDGE] \n [JUDGE] \n \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [PERSON] - 2017 13:34:14 - 8e313c7 \n ID. 8e313c7 - Pág. 2 \n Fls. : 24 \n \n", "gold_answer.txt": "JORNADA DE TRABALHO\n[PERSON] alegou, em sua petição inicial, ter se ativado:\n* Das 06h00 às 12h20 ou das 07h00 às 13h20;\n* Escala 6x1;\n* Intervalo para descanso e refeição de 20min, que poderia ocorrer em duas pausas de 10min cada uma.\nEm sua defesa, a [PERSON] alegou jornada cumprida:\n* Das 07h00 às 13h20;\n* Escala 6x1;\n* Intervalo para descanso e refeição de 20min;\n* Duas pausas de 10min cada uma.\nA [PERSON] juntou os controles de ponto da [PERSON], cuja validade foi reconhecida pela [PERSON], em sua manifestação sobre defesa e documentos, ao apresentar quadro demonstrativo de horas extras.\nFica reconhecida a validade dos cartões de ponto trazidos aos autos pela 1a ré, inclusive quanto ao intervalo para descanso e refeição e pausas.\nHORAS EXTRAS\n[PERSON] não era digitadora, tampouco, executava digitação continuamente.\nConforme os autos, a função exercida era de operadora de telemarketing.\nNão fez jus aos intervalos de 10 minutos a cada 50 minutos trabalhados, já que a digitação era parte e instrumento do trabalho da parte, mas não a finalidade.\nNão era procedida de forma ininterrupta, pois, inclusive, havia os períodos de conversação com clientes.\n[PERSON] não fez jus à jornada pretendida, prevalecendo a limitação constante da NR 17 de 6 horas diárias ou 36 semanais, com duas pausas de 10 minutos e intervalo de 20 minutos.\nEm relação aos domingos, ainda que a reclamante tenha trabalhado, lhe foi garantida a fruição de uma folga semanal.\nA não concessão do descanso aos domingos, por si somente, não gera o direito ao recebimento do dia em dobro ou como jornada suplementar, desde que assegurado o descanso em outro dia da semana.\nA infração torna- se, meramente, administrativa, fazendo incidir as penalidades cabíveis Lei no 11.603, de 2007.\nO quadro demonstrativo de horas extras não está correto, pois [PERSON], ao apontar diferenças, não excluiu minutos destinados ao intervalo para descanso e refeição (20 minutos) e, por conseguinte, utilizou, indevidamente minutos que não podem ser considerados como jornada suplementar.\nRessalte-se que a NR-17, Anexo II, dispõe que o tempo de trabalho em atividade de telemarketing é de 06 horas diárias, incluídas as pausas e que estas serão concedidas em dois períodos de 10 minutos contínuos após os primeiros e antes dos últimos 60 minutos de trabalho, bem como, o intervalo para repouso e alimentação deve ser de 20 minutos.\nPortanto, o intervalo para descanso e refeição previsto no item 5.4.2 de referida norma não se confunde com as pausas e não integra a jornada de trabalho, nos termos do art. 71, §2o, CLT.\nA autora não demonstrou, robustamente, a existência de horas extras ainda inadimplidas, o que inclui trabalho em dias destinados ao descanso.\nNão procede.", "generated_answer.txt": "[PERSON], devidamente, qualificada nos autos ajuizou reclamatória trabalhista, alegando vício de consentimento em seu pedido de demissão, trabalho suplementar cumprido e não quitado, e supressão de intervalos. Visou obter a condenação da(s) reclamada(s) [ORGANIZATION] e outro no pagamento de verbas rescisórias decorrentes da dispensa sem justa causa, horas extras, intervalos não usufruídos e reflexos.\n\n**NULIDADE DO PEDIDO DE DEMISSÃO**\n\nA reclamante alegou que foi obrigada a pedir demissão por se sentir perseguida no ambiente de trabalho. A reclamada negou a existência de qualquer vício de consentimento.\n\nAo alegar a existência de coação, a reclamante atraiu, para si, o ônus da prova, nos termos do art. 818, I, da CLT. E, do mesmo, não se desincumbiu, satisfatoriamente.\n\nEm seu depoimento pessoal, a autora afirmou que “desligou-se da reclamada porque estava se sentindo perseguida”. A testemunha da reclamada, por sua vez, negou que a reclamante sofresse perseguição. Ademais, a reclamante, embora tenha tido a instrução processual reaberta com a finalidade específica de ouvir sua testemunha, não compareceu à audiência designada para tal fim, tampouco justificou sua ausência, o que resultou no encerramento da instrução e na aplicação de multa por litigância de má-fé.\n\nA mera sensação de perseguição, desprovida de qualquer elemento de prova, não é suficiente para caracterizar o vício de consentimento apto a anular o ato de demissão.\n\nNão procede.\n\n**JORNADA DE TRABALHO**\n\nDe acordo com a petição inicial, a reclamante trabalhou:\n*   Em escala 6x1, das 06h00 às 12h20 ou das 07h00 às 13h20;\n*   Com uma pausa de 20 minutos.\n\nEm sua defesa, a reclamada alegou jornada cumprida:\n*   Em escala 6x1, das 07h00 às 13h20;\n*   Com um intervalo de 20 minutos e duas pausas de 10 minutos cada.\n\nA reclamada juntou aos autos os cartões de ponto. A reclamante, em sua réplica, apresentou quadro demonstrativo de horas extras, utilizando-se dos horários registrados nos referidos documentos, reconhecendo, tacitamente, a sua validade. Diante disso, e da preclusão da oportunidade de produzir prova oral sobre a jornada, conforme consignado em ata de audiência, fica reconhecida a validade dos registros de ponto juntados aos autos.\n\n**HORAS EXTRAS**\n\nA reclamante apontou, em quadro demonstrativo, a existência de horas extras não quitadas. A reclamada, instada a se manifestar, não impugnou de forma específica os apontamentos.\n\nA jornada contratual da reclamante era de 6 horas diárias e 36 horas semanais. Da análise dos cartões de ponto, verifica-se o labor habitual para além dos limites pactuados.\n\nDevido o pagamento de horas extras, que serão calculadas sobre a jornada excedente da 6ª hora diária e 36ª hora semanal, de forma não cumulativa, sob pena de \"bis in idem\", observando-se, como parâmetros, globalidade e evolução salariais, dias de efetivo serviço, divisor 180, adicional legal ou convencional, o que for mais benéfico, e dedução dos valores pagos a idêntico título.\n\nProcede, em parte.\n\n**INTERVALO - ART. 72 DA CLT**\n\nA reclamante postula o pagamento do intervalo de 10 minutos a cada 90 minutos de trabalho, previsto no art. 72 da CLT, por analogia à função de digitador.\n\nO intervalo em questão destina-se, especificamente, aos empregados que exercem atividade exclusiva e permanente de digitação. Não é o caso da reclamante, que se ativava como operadora de telemarketing, cuja atividade é regida por norma específica (Anexo II da NR-17), a qual prevê pausas diversas, que a reclamada comprovou conceder.\n\nNão procede.\n\n**INTERVALO INTRAJORNADA**\n\nA reclamante alega que, por trabalhar mais de 6 horas diárias, faria jus ao intervalo de 1 hora para descanso e refeição, nos termos do art. 71 da CLT.\n\nConforme reconhecido nesta decisão, a reclamante cumpria, habitualmente, jornada de 6 horas e 20 minutos. O trabalho excedente de 6 horas diárias, ainda que por poucos minutos, atrai a incidência do art. 71, caput, da CLT, que determina a concessão de, no mínimo, 1 hora de intervalo. A supressão, ainda que parcial, do intervalo, confere ao empregado o direito ao pagamento da totalidade do período correspondente.\n\nEsse é o entendimento do Colendo TST, cristalizado através da Súmula nº 437, I:\n*“Após a edição da Lei nº 8.923/94, a não concessão ou a concessão parcial do intervalo intrajornada mínimo, para repouso e alimentação, a empregados urbanos e rurais, implica o pagamento total do período correspondente, e não apenas daquele suprimido, com acréscimo de, no mínimo, 50% sobre o valor da remuneração da hora normal de trabalho (art. 71 da CLT), sem prejuízo do cômputo da efetiva jornada de labor para efeito de remuneração.”*\n\nDevido, portanto, o pagamento de 1 hora extra por dia de efetivo trabalho, com os mesmos parâmetros e reflexos definidos para as horas extras.\n\nProcede.\n\n**REFLEXOS E FGTS**\n\nAs horas extras e o intervalo intrajornada, por sua habitualidade, integram a remuneração para todos os fins.\n\nDevidos os reflexos em DSR's, e com estes, em aviso prévio, 13º salários, férias acrescidas de 1/3, e FGTS com a multa de 40%. Devidas, ainda, as diferenças de FGTS decorrentes da integração das verbas ora deferidas.\n\nProcede.", "gold_graph.json": "{\n  \"numero_cnj\": \"1000326-15.2016.5.02.0611\",\n  \"judge\": \"DANIELLE_SANTIAGO_FERREIRA_DA_ROCHA\",\n  \"template_version\": \"v2.1\",\n  \"path\": [\n    \"CLAIM\",\n    \"EXCLUSION_GATE\",\n    \"TIME_RECORDS\",\n    \"TESTIMONY\",\n    \"PROOF\",\n    \"OUTCOME_FINAL\"\n  ],\n  \"assignments\": {\n    \"CLAIM\": {\n      \"value\": null,\n      \"supporting_text\": \"[PERSON] alegou, em sua petição inicial, ter se ativado: * Das 06h00 às 12h20 ou das 07h00 às 13h20; * Escala 6x1; * Intervalo para descanso e refeição de 20min, que poderia ocorrer em duas pausas de 10min cada uma.\",\n      \"basis_tags\": [\n        \"CLAIM_TYPE_SUPPRESSED_INTERVAL\"\n      ]\n    },\n    \"EXCLUSION_GATE\": {\n      \"value\": \"EXCLUSION_DOES_NOT_APPLY\",\n      \"supporting_text\": \"Conforme os autos, a função exercida era de operadora de telemarketing.\",\n      \"basis_tags\": []\n    },\n    \"TIME_RECORDS\": {\n      \"value\": \"TIME_RECORDS_CREDITED\",\n      \"supporting_text\": \"A [PERSON] juntou os controles de ponto da [PERSON], cuja validade foi reconhecida pela [PERSON], em sua manifestação sobre defesa e documentos, ao apresentar quadro demonstrativo de horas extras.\",\n      \"basis_tags\": [\n        \"CREDITED_BASIS_CLAIMANT_CONFIRMED\"\n      ]\n    },\n    \"TESTIMONY\": {\n      \"value\": \"TESTIMONY_NOT_USED\",\n      \"supporting_text\": \"Fica reconhecida a validade dos cartões de ponto trazidos aos autos pela 1a ré, inclusive quanto ao intervalo para descanso e refeição e pausas.\",\n      \"basis_tags\": []\n    },\n    \"PROOF\": {\n      \"value\": \"PROOF_INSUFFICIENT\",\n      \"supporting_text\": \"O quadro demonstrativo de horas extras não está correto, pois [PERSON], ao apont ração que a jornada realizada pela obreira igualmente extrapola a 8º diária e a 44 semanal, requer seja a Primeira Reclamada condenada a pagar a jornada extraordinária. Oportuno frisar, que a jornada extraordinária realizada pela obreira deverão ser remuneradas com 50% (cinqüenta por cento) e 100% (cem por cento) para os feriados, incidindo o percentual sobre o valor da hora normal. Referidas horas, pelo fato de estarem revestidas de habitualidade, deverão refletir sobre as demais verbas decorrentes do contrato de trabalho, quais sejam: saldo salarial, aviso prévio, férias +1/3 vencidas e proporcionais, 13º salário vencidos e proporcionais, DSR´s, FGTS+40% com a integração da equiparação salarial, horas extras (intervalos interjornada e intrajornada) e demais reflexos. XVIII – DA REMUNERAÇÃO A remuneração da Reclamante para efeito de cálculos deverá ser composta do salário mensal com a incorporação da jornada extraordinária (intrajornada e interjornada) e da equiparação salarial. Entende-se que as diferenças de horas extraordinárias, equiparação salarial, merecem integrarem a remuneração da Reclamante, a fim de que reflita quanto as verbas de natureza salariais e indenizatórias, as quais sejam saldo de salário, aviso prévio, 13º salário vencidos e proporcionais, férias vencidas e proporcionais + 1/3, FGTS+40% e DSR’s com a integração da equiparação salarial, horas extras (intervalos intrajornada) e demais reflexos. XIX - DO DESCANDO SEMANAL REMUNERADO NÃO PAGOS PELA PRIMEIRA RECLAMADA - REFLEXOS DAS HORAS EXTRAS ( _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 18 Av : Campanella, n. º125, [NUMBER], [LOCATION][LOCATION] - São Paulo / SP, Cep : [NUMBER], telefones : [PHONE NUMBER] / [NUMBER][PERSON] Advogado _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ INTRAJORNADA ), EQUIPARAÇÃO SALARIAL BEM COMO A INTEGRAÇÃO AO 13º SALÁRIO, FÉRIAS ACRESCIDAS DE 1 / 3, FGTS + MULTA DE 40 % E VERBAS RESCISÓRIAS. Pondera-se que a Primeira Reclamada durante todo o período na qual vigorou o contrato de trabalho nunca pagou corretamente o Descanso Semanal Remunerado sobre o salário Percebido pela Autora. Nos moldes do previsto na letra “a” a “d”, do artigo 7º da Lei [NUMBER] de 1949, estabelece a integração das horas extras sobre o descanso semanal remunerado ou descanso hebdomadário como querem alguns. Vejamos o que diz a letra b da referida lei: “para os que trabalham por hora, à sua jornada normal de trabalho, computadas as horas extraordinárias habitualmente prestadas”. Na mesma linha temos o Enunciado n. 172 do TST que dispõe: “Computam-se no cálculo do repouso remunerado as horas extras habitualmente prestadas. A doutrina trilha mesmo caminho. O professor e Juiz do Trabalho [JUDGE], no Jornal Trabalhista Consulex – JTb, de 2001, página 18-883/6, assim se posiciona: “O artigo 7º da Lei n. 605/49 c/c o artigo 457 da CLT dá margem à conclusão de que, não só as horas extras devem integrar o valor do repouso semanal, mas, também, toda e qualquer parcela de natureza salarial”. O professor [PERSON] em sua obra Curso de Direito do Trabalho, ano 1989, 8ª edição, [ORGANIZATION], página 491, afirma que: “No cálculo da remuneração dos repousos são computados todos os pagamentos de natureza salarial, inclusive adicionais salariais, ordenando a Lei n. 605 de 1949, o cômputo das horas extraordinárias habituais”. Por tais razões, levando em consideração a jornada extraordinária realizada pela Reclamante, a Primeira Reclamada deverá ser compelida a realizar os pagamentos de todos os reflexos das horas extras sobre _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 19 Av : Campanella, n. º125, [NUMBER], [LOCATION][LOCATION] - São Paulo / SP, Cep : [NUMBER], telefones : [PHONE NUMBER] [PERSON] _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ o Descanso Semanal Remunerado bem como sobre o 13º salário vencidos e proporcionais, férias vencidas e proporcionais acrescidas de 1 / 3, FGTS + multa de 40 % com a integração da equiparação salarial, horas extras ( intervalos intrajornada ) e demais reflexos. XX- DO INTERVALO DO ART. 384 DA CLT. NORMAS DE PROTEÇÃO (15 MINUTOS DE INTERVALO NÃO CONCEDIDO) A CLT, ao dispor sobre as normas de proteção, determina em seu art. 384 que “Em caso de prorrogação do horário normal, será obrigatório um descanso de 15 (quinze) minutos no mínimo, antes do início do período extraordinário do trabalho”. Assevera-se por oportuno que o referido dispositivo deve ser aplicado a luz do princípio da isonomia esculpido no art. 5º “caput” da Constituição Federal da República. Apesar de sempre ter prorrogado a sua jornada de trabalho além do legalmente permitido, jamais foi concedido a Reclamante o referido intervalo. Destaca–se que através do incidente de inconstitucionalidade IIN-R – [NUMBER], julgado no dia 2008, a Sessão de Dissídios individuais 1 (SDI -1) pacificou o entendimento de que o artigo 384 na CLT foi recepcionado pela CF/88. Neste mesmo diapasão, o Recurso Extraordinário 658.312, com repercussão geral, fixou a constitucionalidade do art. [PHONE NUMBER] da CLT, colocando dessa forma uma pá de cal sobre o assunto. Nesse contexto, com base no Art. 384 da CLT e, por analogia, no art. 71 § 4°, da CLT, requer a Reclamante que seja a primeirareclamada condenada a indenizar o intervalo de 15 (quinze) minutos não concedido, com o adicional do labor extraordinário de 50% (cinqüenta por cento), bem como a sua repercussão sobre as demais verbas que têm o salário como base de cálculos, a exemplo do aviso- prévio, saldo de salário, 13°salários (integrais e proporcionais), férias + 1/3 (simples em dobro, bem como as proporcionais), com a integração da equiparação salarial, horas extras (intervalos e intrajornada), adicional noturno e demais reflexos.\", \"Cumpria a jornada das 8:30 hs às 18:30 de segunda a sexta feira, sempre com 1:12 minutos de intervalo para descanso e refeição. Neste mesmo diapasão, entre 2018 a 2018 laborou todos os sábados das 8:00 ás 14:00, com 10 minutos de intervalo para descanso e refeição, laborando em todos os feriados estaduais das 8:30 as 18:30.\", \"A Reclamante cumpria jornada das 8:30 hs às 18:30 de segunda a sexta feira, sempre com 1:12 minutos de intervalo para descanso e refeição. Neste mesmo diapasão, entre 2018 a 2018 laborou todos os sábados das 8:00 ás 14:00, com 10 minutos de intervalo para descanso e refeição, laborando em todos os feriados estaduais das 8:30 as 18:30.\", \"Requer, assim, seja reconhecida a equiparação salarial com o paradigma indicada, bem como a anotação na CTPS da obreira e a conseqüente condenação da Primeira e Segunda reclamadas aos pagamentos da equiparação salarial de todo o período com a integração nas horas extras ( intrajornada ) e demais reflexos no saldo salarial, aviso prévio, 13º salários _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 12 Av : Campanella, n. º125, [NUMBER], [LOCATION][LOCATION] - São Paulo / SP, Cep : [NUMBER], telefones : [PHONE NUMBER] [PERSON] Advogado _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ vencidos e proporcionais, férias vencidas e proporcionais acrescidas de 1 / 3, FGTS e multa de 40 % e demais consectários legais. IX – DO SALDO SALARIAL Absurdamente deixou a Primeira Reclamada não pagou corretamente o saldo salarial, razão pela qual deverá a Primeira Reclamada ser condenada a efetuar o pagamento dos salários atrasados com a devida integração da equiparação salarial de todo o período, horas extras (intervalos interjornada e intrajornada) e demais consectários legais.\", \"E ( intrajornada + art. 384) excedentes da 6º diária ou 36 semanal (aplicação do CCT) e/ou da 8º diária e 44º semanal, com acréscimo de 50% e 100% de todo o período..........................................................R$ 4.675,00 13 – Integração da equiparação salarial sobre as horas extras......R$ 5.597,00 14 – Pagamento da equiparação salarial de todo o período..........R$ 15.851,00 15 – Pag. dos reflexos das H.E. (intrajornada + art. 384) sobre: a) Saldo salarial..................................................................R$ 212,00 b) aviso prévio...................................................................R$ 425,00 c) Descanso Semanal Remunerado........................................R$ 935,00 d) 13º Salários proporcionais[NUMBER]R$ 390,00 e) Férias propor.\"]\n\n--- CONTESTACAO ---\n\n[\"FILIAL [LOCATION] – [LOCATION], no 711, [NUMBER], [LOCATION], na cidade de [LOCATION]/SP, CEP[NUMBER]– ([NUMBER]DA BASE DE CÁLCULO DAS HORAS EXTRAS Restou fartamente comprovado que o Reclamante foi contratado e efetivamente realizou funções externas para a Reclamada, sem controle da jornada de trabalho, pelo que a mesma não faz jus ao recebimento de horas extraordinárias. Entretanto, no caso de condenação no referido pagamento, o que se admite apenas para efeito de argumentação, as horas extras devem incidir apenas sobre o salário base, isso porque, no que se refere as comissões (remuneração variável), incidirá apenas o adicional das horas extraordinárias, conforme previsto na Súmula 340, do C. TST, in verbis: \\\"COMISSIONISTA - HORAS EXTRAS - O empregado sujeito a controle de horário remunerado à base de comissões, tem direito ao adicional de, no mínimo 50% (cinqüenta por cento) pelo trabalho em horas extras, calculado sobre o valor-hora das comissões recebidas no mês, considerando-se como divisor o número de horas efetivamente trabalhadas.\\\" aduz: Em consonância com a Súmula acima, a Lei no[NUMBER], em seu Artigo 58-A § 1o A remuneração da hora extra será, pelo menos, 50% (cinquenta por cento) superior à da hora normal. E mais, no caso em apreço, tendo em vista que o obreiro foi contratado pela exceção do inciso I, do artigo 62, do Consolidado, bem como cumpria atividade externa, sem qualquer fiscalização em sua jornada laboral, e ainda, toda atividade interna supostamente desempenhada estava vinculada àquela contratação, não há que se falar em hora extra, ou ainda, não há que se falar na inaplicabilidade da dita Súmula, sob pena de afronta aos ditames legais. E para solucionar a questão, recentemente foi editada a Orientação Jurisprudencial no 397 da SBDI-1 do Colendo Tribunal Superior do Trabalho: OJ-SDI1-397. COMISSIONISTA MISTO. HORAS EXTRAS. BASE DE CÁLCULO. APLICAÇÃO DA SÚMULA N.o 340 DO TST. (DEJT divulgado em 02, 03 e[NUMBER]O empregado que recebe remuneração mista, ou seja, uma parte fixa e outra variável, tem direito a horas extras pelo trabalho em sobrejornada. Em relação à parte fixa, são devidas as horas simples acrescidas do adicional de horas extras. Em relação à parte variável, é devido somente o adicional de horas extras, aplicando-se à hipótese o disposto na Súmula n.o 340 do TST. Dessa forma, em havendo condenação no pagamento de horas extraordinárias, o que sinceramente não se acredita, requer a aplicação da Súmula acima consignada, ou seja, www.nwadv.com.br Matriz: São Paulo/SP – Filiais: Anápolis/GO Aracaju/SE [LOCATION] Belém/PA Belo Horizonte/MG Boa Vista/RR Brasília/DF Campinas/SP Campo Grande/MS Caxias do Sul/RS [LOCATION] Cuiabá/MT Curitiba/PR Florianópolis/SC Fortaleza/CE [LOCATION] João Pessoa/PB Juiz de Fora/MG [LOCATION] [LOCATION] [LOCATION] Natal/RN Palmas/TO Passo Fundo/RS Porto Alegre/RS Porto Velho/RO Recife/PE Ribeirão Preto/SP Rio Branco/AC Rio de Janeiro/RJ Salvador/BA [LOCATION]/SP São José dos Campos/SP São Luis/MA Teresina/PI Uberlândia/MG Vitória/ES. FILIAL [LOCATION] – [LOCATION], no 711, [NUMBER], [LOCATION], na cidade de [LOCATION]/SP, CEP[NUMBER]– ([NUMBER]aplicando-se a hora extraordinária simples acrescida de adicional em relação à parte fixa e apenas ao adicional de horas extras em relação à parte variável. É certo, ademais, que o salário fixo remunera o trabalho mensal do empregado dentro dos limites e horários regulados no contrato de trabalho, de acordo com o ordenamento jurídico vigente, de modo que em havendo condenação no pagamento de horas extraordinárias, as mesmas devem incidir apenas no salário base. Outrossim, verifica-se da redação da Súmula 340 do TST, que o mesmo determina nos casos de remuneração variável, como ocorre na presente reclamação, incidirá apenas o adicional de horas extras, observando-se o valor-hora das comissões percebidas no mês, sendo que este salário-hora será calculado considerando-se como divisor o número de horas efetivamente trabalhadas, e não o divisor 220. Destarte, requer-se, desde já, que, na existência de eventual condenação de horas extras, esta recaia somente sobre as horas efetivas e comprovadamente laboradas e não pagas ou compensadas (lembrando-se que o ônus da prova é do Reclamante), acrescidas tão somente pelo adicional legal (50%), conforme previsto na Súmula 340, do [ORGANIZATION]. DO INTERVALO PREVISTO NO ARTIGO 384 DA CLT Requer a reclamante a condenação desta Reclamada no pagamento de 15 minutos extras por dia de trabalho prestado com extrapolação dos módulos constitucionais, sob alegação de não ter sido observado o descanso previsto no artigo 384 da CLT. Como amplamente explanado acima, a jornada declinada pela Reclamante não compreende qualquer pagamento de horas suplementares, de modo que descabe a pretensão de indenização do descanso constante do art. 384 da CLT. Ainda que assim não fosse, também não prosperam as alegações obreiras, por tratar-se de matéria incompatível com o principio constitucional contido no artigo 5o, I, o qual garante direitos e obrigações iguais para homens e mulheres. Importa consignar que a Constituição Federal em seu artigo 5o dispõe acera da igualdade entre homens e mulheres perante a lei, de forma que tratamento diferenciado dado à mulher conforme preceitua o artigo 384 da CLT caracterizaria ao invés de direito protetor, privilegiando as mulheres, efeito inverso de discriminação, tornando-as seres inferiores ou incapazes que necessitam de proteção do Estado. Dessa forma, verifica-se que a norma contida no citado artigo consolidado não foi recepcionada pela Constituição Federal de 1988, por força da norma contida no art. 5o, I, CF, de forma que a aplicação da norma prevista no artigo 384 da CLT acarreta ofensa ao princípio da igualdade.\", \"DAS HORAS EXTRAS E REFLEXOS O Reclamante alega que a sua jornada de labor era de 08h30m às 18h30m, de segunda a sexta-feira, com intervalo intrajornada de 1h12m, que de 2018 a 2018 laborou aos sábados das 08h00m às 14h00, com intervalo intrajornada de 10 minutos, requerendo o pagamento de horas extras excedentes da 8a diária e 44a semanal. Sendo assim, sob a afirmação de que nunca percebeu por qualquer hora extraordinária prestada, requer a condenação das reclamadas ao pagamento de todas as horas extras, com acréscimo de 50%, bem como reflexos. Ocorre que, como flagrantemente demonstrado alhures, o Autor jamais teve vínculo empregatício com o Reclamado, não havendo que se falar em jornada de trabalho nem em qualquer dos caracteres referentes à relação de emprego. Ante à inexistência de vínculo de emprego, logo, não existe direito do Autor às horas extras, pois a prestação de serviços do Reclamante jamais teve como alvo a satisfação dos comandos do Reclamado. Mesmo que assim não o fosse, improcedem as alegações autorais, pois a jornada do Reclamante não ultrapassava os limites legais e contratuais, sendo sempre respeitado o mínimo de intervalo intrajornada fixado pela ordem justrabalhista, restando expressamente impugnada a jornada constante da inicial.\", \"FILIAL [LOCATION] – [LOCATION], no 711, [NUMBER], [LOCATION], na cidade de [LOCATION], CEP[NUMBER]– ([NUMBER]Assim, nunca houve serviço que excedesse o horário acordado, fora dos limites legais, e, nos momentos em que houve labor suplementar, tais horas extras foram devidamente remuneradas ou compensadas pela 1ª Reclamada. Insta ressaltar, ainda, que o pagamento das horas extraordinárias supostamente trabalhadas pelo empregado cabe exclusivamente à 1ª reclamada, sua real e única empregadora, tratando-se de obrigação personalíssima, que não pode ser imputada à Ré, ora contestante. De qualquer sorte, o ônus probandi do labor extraordinário, fato constitutivo do seu direito (NCPC, art. 373, I), pertence ao Reclamante, também em consonância com o artigo 818, da CLT e diante da interpretação do Enunciado no. 338 do TST, ônus do qual não se desincumbiu não tendo trazido aos autos demonstrativo de horas extras. Sendo certo que, conforme doutrina de [JUDGE] in Comentários à Consolidação das Leis do Trabalho: A falta de provas quanto ao fato que interessa ao processo e que poderá ter influência no julgado, prejudica aquele a quem incumbia o ônus da prova, ou seja, quem tinha a responsabilidade de provar: não tendo feito, a sentença terá o respectivo fato como inexistente. Nesse sentido posiciona-se pacificamente a jurisprudência trabalhista, como ilustram os seguintes acórdãos do C. Tribunal Superior do Trabalho e C. Tribunal Regional do Trabalho de Santa Catarina: 24034485 – HORAS EXTRAS – ÔNUS DA PROVA. Quando expressamente impugnada pelo empregador a jornada de trabalho declinada na inicial, cabe ao reclamante a prova do fato constitutivo do seu alegado direito ao labor extraordinário. (TRT 5ª R.; RO[NUMBER]; Terceira Turma; Rel. Des. Sônia Lima França; DEJTBA[NUMBER]HORAS EXTRAS – ÔNUS DA PROVA. Incumbe ao autor a demonstração do fato constitutivo de seu direito ao pagamento das horas extras. [...] (TRT 3ª R.; RO[NUMBER]; Primeira Turma; Rel. Des. Manuel Cândido Rodrigues; DJEMG[NUMBER]HORAS EXTRAS – ÔNUS DA PROVA. Alegado o labor em sobrejornada, aplicando-se as regras processuais descritas nos artigos 333 do CPC e 818 da CLT, cabe ao Demandante o ônus da prova do fato constitutivo de seu direito, competindo-lhe a demonstração irrefutável do tempo de efetivo trabalho para fazer jus ao recebimento das horas extras postuladas.\", \"Reconhecer à reclamante o direito ao pagamento de quinze minutos extraordinários pela não concessão de descanso antes do início da prorrogação da jornada, consiste em imprimir odiosa e inconstitucional distinção entre homens e mulheres que estão submetidos a um mesmo trabalho e em idênticas condições, implicando limitação ao já restrito mercado de trabalho da mulher\\\". Recurso ordinário da ré a que se dá parcial provimento para excluir esse item da condenação”. (TRT 2a R. – RO[NUMBER]– (Ac[NUMBER]– 11a T. – Rel. Dora Vaz Treviño – [ORGANIZATION] [NUMBER]Outrossim diante da reforma trabalhista aprovada pelo Congresso Nacional, Lei no 13.467, de 2017, ficou revogado o respectivo dispositivo não havendo que se falar em pagamento por ausência de descanso obrigatório de 15 (quinze) minutos, antes do inicio do período extraordinário. Assim, fica impedido a aplicação do art. 384 da CLT por todo o período laboral compreendido após[NUMBER], de acordo com o novo ordenamento jurídico. Sendo assim, não há que se falar em deferimento do pedido de indenização do período de intervalo previsto no artigo 384 da CLT.\", \"FILIAL [LOCATION] – [LOCATION], no 711, [NUMBER], [LOCATION], na cidade de [LOCATION]/SP, [PHONE NUMBER] – ([NUMBER]Deste modo, evidente que o Reclamante não realizava qualquer labor extraordinário, sendo certo, ainda, que se em alguma ocasião, por necessidade do serviço, o Autor necessitou estender sua jornada de trabalho, certamente a primeira Reclamada efetuou o correto pagamento das horas extraordinárias. Além disso, certamente o Reclamante jamais ultrapassou a 8a hora diária ou 44a hora semanal de labor e sempre cumpriu o intervalo intrajornada de 1:00 hora para refeição, sem qualquer trabalho nos feriados sendo que, se eventualmente laborou em jornada extraordinária, foi a mesma devidamente paga ou compensada pela 1ª reclamada. Desta forma, deve ser julgado totalmente improcedente o pleito autoral de pagamento de horas extras por elastecimento da jornada, pois além de carente de fundamentos, os fatos narrados se mostram completamente inverossímeis. No caso de condenação da Reclamada, o que não se espera e nem o direito admite, pela eventualidade, requer sejam excluídas da condenação as horas em que o Reclamante confessou ter sido remunerado. Ad cautela, para a remota hipótese de deferimento de quaisquer horas extraordinárias, deve-se atentar que não poderá ser deferido qualquer adicional por eventual labor no carnaval, quarta-feira de cinzas ou Corpus Christi, eis que tal data representa ponto facultativo, não sendo devido qualquer valor nesse sentido.\", \"FILIAL [LOCATION] – [LOCATION], no 711, [NUMBER], [LOCATION], na cidade de [LOCATION], CEP[NUMBER]– ([NUMBER]Nesse sentido tem entendido nossos Tribunais, conforme verifica-se pelo recente acórdão prolatado: “INTERVALO DO ARTIGO 384 DA CLT -INCONSTITUCIONALIDADE FRENTE AO DISPOSTO NOS ARTIGOS 5.o, INCISO I, E 7.o, INCISO XXX. \\\"O preceito constante do artigo 384 consolidado é discriminatório à luz dos princípios constitucionais insculpidos nos artigos 5.o, I e 7.o, XXX da Carta Magna de 1988, por estabelecer diferença que não se justifica.\"]\n\n[\"\\\"2 Ainda que se entenda que o artigo 384 da CLT tenha sido recepcionado pela Constituição Federal, o que se admite por amor ao debate, nenhum valor deveria ser conferido à Reclamante. Isso porque, se considerado que a empresa descumpriu referido artigo eventual sanção deve ser de ordem unicamente administrativa. Em verdade, as horas extraordinárias eventualmente laboradas pela Reclamante já foram remuneradas com o respectivo adicional e o pagamento desses minutos como hora extra configuraria enriquecimento ilícito da Reclamante 1 Comentários à CLT. 4a ed. São Paulo: Atlas, 2001. p[NUMBER]ADIn 521-9-DF- questão de ordem - Rel. Min. Paulo Brossard – DJU[NUMBER]págs. 4796 a 4800. 20 TEXT_SP[NUMBER]v2 12171.1 Destaca-se que o artigo 384 da CLT não faz nenhuma ressalva no sentido de que, caso o intervalo não fosse concedido, o período correspondente deveria ser pago como extra. Se fosse essa a consequência, o Legislador teria certamente feito essa determinação na Lei, como fez, por exemplo, quanto a não concessão de intervalo intrajornada. No mais, deve-se observar que a discussão referente ao intervalo intrajornada do artigo 384 tanto é matéria de repercussão geral (Tema 528) que estava em discussão no TST (Recurso Extraordinário n. 658312), à luz dos artigos 5o, I, e 7o, XXX, da Constituição Federal de 1988, sendo, portanto, notória a divergência jurisprudencial, discussão da constitucionalidade e transcendência da matéria. Portanto, sob qualquer ângulo que se analise a questão, o pedido em comento deverá ser julgado totalmente improcedente, o que resta expressamente requerido. Ainda que assim não fosse, o que não se espera e se admite apenas em relação ao princípio da eventualidade, deverá ser conferido atributo indenizatório a verba objeto da condenação, por se tratar de uma supressão por um intervalo não concedido, restando, assim, evidente o caráter indenizatório da verba. III.5. INTERVALO INTRAJORNADA Superada a inépcia da petição inicial quanto a falta de pedido de intervalo intrajornada, a [ORGANIZATION], em atenção ao princípio da eventualidade, passa a impugnar o mérito da questão. A Reclamante alega que no período de 2018 a 2018 teria trabalhado em todos os sábados das 08h00min. às 14h00min., com apenas 10 minutos de intervalo. Entretanto, nenhum valor é devido à Reclamante a título de horas extras pela supressão do intervalo intrajornada. Conforme o já destacado, por não ser a real empregadora da Reclamante, a [ORGANIZATION] não tem conhecimento sobre o intervalo intrajornada que esta realizava, contudo, por ser a 01a Reclamada empresa idônea, por certo este cumpria os requisitos legais, não sendo jamais inferior a 1 hora quando a Reclamante realizava jornada de 08 horas diárias e a 15 minutos quando sua jornada era de 06 horas. 21 TEXT_SP[NUMBER]v2 12171.1 Sendo assim, nos termos do artigo 818 da CLT, a [ORGANIZATION] impugna expressamente a alegação de que a Reclamante não gozava de 15 minutos de intervalo para refeição quando trabalhou aos sábados. \\\"Ad cautelam\\\", em caso de eventual condenação, o que novamente não se espera e se admite apenas em relação ao princípio da eventualidade, esta deverá limitarse aos minutos não usufruídos (05 minutos), não se podendo acolher o pedido de uma hora extra cheia por dia. Entendimento contrário configuraria enriquecimento sem causa, vedado pelos artigos 884 a 886 do Código Civil. O artigo 71, § 4o da CLT, com a redação trazida pela Lei 13.467/17, dispõe que somente o \\\"período suprimido” deverá ser remunerado como hora extra. “§ 4o A não concessão ou a concessão parcial do intervalo intrajornada mínimo, para repouso e alimentação, a empregados urbanos e rurais, implica o pagamento, de natureza indenizatória, apenas do período suprimido, com acréscimo de 50% (cinquenta por cento) sobre o valor da remuneração da hora normal de trabalho”. (Redação dada pela Lei no 13.467, de 2017) E nem poderia ser diferente. A obrigação de pagar sempre deverá ser proporcional ao dano causado, de modo que a supressão total não pode ser equiparada à supressão parcial. A esse respeito, vejam-se alguns julgados dos E. Tribunais Regionais: “INTERVALO INTRAJORNADA - SUPRESSÃO - DEVIDO APENAS O PERÍODO NÃO USUFRUÍDO. A Orientação Jurisprudencial n. 307 da Subseção de Dissídios Individuais I, do C. TST, ao dispor que a supressão total ou parcial do intervalo intrajornada implica no pagamento total do período correspondente, diz respeito apenas aos minutos não aproveitados, sem acrescer aqueles já usufruídos, sob pena de enriquecimento sem causa do obreiro”. (TRT[NUMBER]PR[NUMBER], Relator: [JUDGE], 1A. TURMA, Data de Publicação: 2012) “INTERVALO INTRAJORNADA. CONCESSÃO PARCIAL. PAGAMENTO APENAS DOS MINUTOS FALTANTES PARA COMPLETAR O PERÍODO CONTRATUAL. ORIENTAÇÃO JURISPRUDENCIAL No 307 DA SBDI I DO [ORGANIZATION]. O intervalo intrajornada, quando suprimido parcialmente, não pode ser deferido em sua integralidade, pois tal implicaria evidente pagamento duplo, o que não se admite. Se o § 4o do art. 71 da CLT menciona claramente \\\"período correspondente\\\" ao intervalo não concedido, não se tem qualquer dúvida quanto à abrangência de período parcial nos casos em que a supressão não é inteira.\", \"Reforçando o entendimento sobre a questão, destaca-se que a posição doutrinária do professor Ives Gandra Martins é a mesma do julgado acima, inserida no artigo intitulado “A Natureza Não Salarial do Adicional de Horas Extras: Caráter Indenizatório e Não Sujeição à Incidência do Imposto Sobre a Renda e das Contribuições Sociais”. III.4. DO INTERVALO PREVISTO NO ARTIGO 384 DA CLT. A Reclamante pretende também o pagamento das horas extras, em decorrência do disposto no artigo 384 da CLT. Novamente, razão alguma lhe socorre. Isso porque, a Lei[NUMBER], que alterou a Consolidação das Leis do Trabalho, revogou expressamente o artigo 384 da CLT. Logo, é mais do que evidente que o pedido da Reclamante deverá ser julgado totalmente improcedente. Caso não seja esse o entendimento desse MM. Juiz, o que não ntervalo para descanso e refeição de 01h12.\nAlegou ainda, previsão de jornada de trabalho de 44 horas semanais em seu contrato de trabalho.\nNegou ter a autora exercido a função de telemarketing.\nAlegou trabalho em dois sábados, no período de 27/02 a 2018, devidamente quitados.\nA 1a reclamada juntou os espelhos de ponto da [PERSON], devidamente, assinados.\nPelo [JUDGE], foi deferido prazo para manifestação sobre defesa e documentos.\nA reclamante, entretanto, quedou-se silente, atraindo a incidência do art. 411, III, CPC, aplicado face ao disposto no art. 769, CLT.\nAs testemunhas ouvidas nos autos nada mencionaram sobre os horários cumpridos pela [PERSON].\nFica reconhecida a validade dos registros de ponto juntados aos autos pela defesa.\nHORAS EXTRAS\nQuanto ao exercício de operadora de telemarketing, de acordo com o Anexo II da NR-17 que dispõe sobre o trabalho em teleatendimento/telemarketing, item 1.1.2:\n\"Entende-se como trabalho de teleatendimento/telemarketing aquele cuja comunicação com interlocutores clientes e usuários é realizada à distância por intermédio da voz e/ou mensagens eletrônicas, com a utilização simultânea de equipamentos de audição/escuta e fala telefônica e sistemas informatizados ou manuais de processamento de dados\".\nDepreende-se do depoimento pessoal da [PERSON] e dos termos da petição inicial que as suas atividades resumiam-se na análise e verificação de processos da 3a ré e, eventualmente, poderia contatar [PERSON] e fornecedores para fornecer ou receber informações.\nA testemunha da [PERSON] declarou que durante 50% da jornada de trabalho contatavam [PERSON] por telefone.\nJá a [PERSON] declarou que o telefone era utilizado durante 10% da jornada diária.\nA prova oral demonstrou que as atividades da [PERSON] eram mais abrangentes, não se resumiam a realizar e receber ligações e, portanto, não exercia a função de operadora de telemarketing.\nAssim, não faz jus à jornada prevista no item 5.3 de referida norma regulamentadora.\nAs Convenções Coletivas do Trabalho juntadas aos autos pelas partes possuem vigência no período de 01 /01/2017 a 2018.\nE, se não bastasse, a jornada de trabalho de 36 horas semanais prevista em referidas normas refere-se aos operadores de telemarketing, que não era o caso da [PERSON], como analisado acima.\nAssim, não há que se falar em jornada excedente à 6a hora diária e 36a semanal.\nConstou nos comprovantes de pagamento de salário a quitação de horas extras.\nUma vez juntados os espelhos de ponto e comprovantes de pagamento de salário, a [PERSON] tinha o ônus de demonstrar, de forma pormenorizada, a existência de diferenças em seu favor, inclusive quanto ao labor em feriados não compensados, o que não fez.\nO artigo 384 da CLT foi expressamente revogado pela Lei[NUMBER], em seu artigo 5o, inciso I, letra \"i\".\nPortanto, indevido o pagamento.\nNão procede.\nIV- NO MÉRITO, JULGA IMPROCEDENTES OS PEDIDOS.", "generated_answer.txt": "[PERSON], devidamente, qualificada nos autos ajuizou reclamatória trabalhista, alegando prestação de serviços em benefício da segunda e terceira reclamadas, equiparação salarial, saldo salarial não quitado, corretamente, trabalho suplementar cumprido e não quitado, o que inclui o intervalo previsto no art. 384, CLT, e reflexos. Visou obter a condenação da(s) reclamada(s) no pagamento de diferenças salariais por equiparação, horas extras, e verbas consectárias.\n\n**JORNADA DE TRABALHO**\n\n[PERSON] alegou, em sua petição inicial, ter se ativado:\n*   De segunda a sexta-feira, das 8h30 às 18h30, com 1h12 de intervalo;\n*   De 2018 a 2018, em todos os sábados, das 8h00 às 14h00, com 10 minutos de intervalo;\n*   Em todos os feriados estaduais.\nPostulou o pagamento de horas extras excedentes à 6ª diária e 36ª semanal, com base em norma coletiva para operadores de telemarketing, ou, subsidiariamente, excedentes à 8ª diária e 44ª semanal.\n\nEm sua defesa, a primeira [PERSON] alegou jornada cumprida:\n*   De segunda a sexta-feira, das 08h00 às 18h00 ou das 08h30 às 18h30, com 01h12 de intervalo;\n*   Labor em apenas dois sábados no período de 2018 a 2018, das 08h00 às 14h00, com 1h12 de intervalo, com o devido pagamento das horas extras.\n\nCom a defesa, foram juntados os espelhos de ponto. A reclamante, em seu prazo para manifestação, não apontou, de forma pormenorizada, a existência de diferenças de horas extras cumpridas e não quitadas. Manteve-se silente.\n\nNão se convenceu, este Juízo, pela aplicação da jornada especial de 6 horas diárias. A reclamante, em seu depoimento pessoal, descreveu suas funções como \"análise de faturas, verificação de contrato, alteração de valores de ajuste\", atividades que não se enquadram naquelas típicas de operador de telemarketing, nos termos do Anexo II da NR 17 do MTE. A prova oral, ademais, foi dividida quanto ao uso de telefone, não sendo suficiente para caracterizar a atividade preponderante como de teleatendimento.\n\nQuanto ao labor suplementar, a [PERSON] juntou os registros de jornada. O ônus de demonstrar a existência de horas extras cumpridas e não quitadas era da reclamante, a teor do Art. 818, CLT, c/c art. 373, I, Novo CPC. E, do mesmo, não se desincumbiu, satisfatoriamente.\n\nFica reconhecida a validade dos registros de ponto juntados aos autos pela primeira [PERSON].\nNão procede.\n\n**INTERVALO - ART. 384 DA CLT**\n\nO art. 384 da CLT, tratando-se de norma de proteção ao trabalho da mulher, foi, sim, recepcionado pela atual Ordem Constitucional. Nesse sentido, já se manifestou o Colendo STF, em sede de repercussão geral, no julgamento do RECURSO EXTRAORDINÁRIO 658.312 SANTA CATARINA:\n\n> \"DIREITO DO TRABALHO. RECURSO EXTRAORDINÁRIO. MULHER. INTERVALO DE 15 MINUTOS ANTES DE LABOR EM SOBREJORNADA. CONSTITUCIONALIDADE DO ART. 384 DA CLT EM FACE DO ART. 5º, I, DA CF. 1. O art. 384 da CLT impõe intervalo de 15 minutos para a mulher antes de iniciada a jornada extraordinária. (...) 2. A igualdade de gênero é conquista fundamental do Estado Democrático de Direito. (...) 4. A diferenciação entre homens e mulheres, para fins de estabelecimento de condições especiais de trabalho, é autorizada pela Constituição Federal, quando fundada em elementos de discriminação positiva que visem à proteção da mulher, considerando-se suas particularidades físicas e sociais. (...) 5. Recurso extraordinário da reclamada de que se conhece e a que se nega provimento\".\n\nContudo, com o advento da Lei nº 13.467/2017, o referido artigo foi expressamente revogado.\n\nAssim, devido o pagamento de 15 minutos, como extras, com adicional de 50%, para cada dia em que houve prorrogação da jornada contratual, conforme espelhos de ponto, limitando-se a condenação ao período anterior a 11/11/2017. Para o período posterior, indevida a parcela.\n\nDevidos os reflexos em DSRs, aviso prévio, férias acrescidas de 1/3, 13º salários e FGTS + 40%.\nProcede, em parte.\n\n**EQUIPARAÇÃO SALARIAL**\n\nA reclamante postulou o pagamento de diferenças salariais por equiparação com a paradigma [PERSON], alegando identidade de funções. A [PERSON] negou a identidade, afirmando que a paradigma exercia função de maior complexidade e responsabilidade, estando em nível hierárquico superior.\n\nAtraiu, para si, o ônus da prova do fato constitutivo de seu direito, vale dizer, a identidade de funções. Art. 818, CLT, c/c art. 373, I, Novo CPC. E, do mesmo, não se desincumbiu, satisfatoriamente.\n\nHouve contrariedade entre os depoimentos das testemunhas. A testemunha da reclamante afirmou que não havia qualquer distinção entre as funções da autora e da paradigma. Já a testemunha da reclamada, que era supervisor de ambas, declarou que a paradigma desempenhava tarefas de maior complexidade, como auditoria de processos, abertura de processos de forma proativa, controle de horas extras e o substituía em suas ausências, funções não exercidas pela reclamante.\n\nNão se convenceu, este Juízo, pela identidade de funções. O depoimento da testemunha da reclamada mostrou-se mais
