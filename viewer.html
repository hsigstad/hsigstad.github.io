F\"\n    },\n    {\n      \"from\": \"PROOF\",\n      \"to\": \"OUTCOME_FINAL\"\n    }\n  ],\n  \"warnings\": []\n}"}, "1001770-49.2017.5.02.0611": {"question.txt": "--- PETICAO INICIAL ---\n\n[\"DAS HORAS EXTRAS PAGAS - REFLEXO EM D.S.R 11- A reclamada não realizava o reflexo das horas extras pagas aos títulos \\\"valor normal horas extras, acréscimo horas extras, pagamento antecipado horas extras, pagamento integração horas extras\\\" no [ORGANIZATION]. 12- Ademais, a Reclamada sustentava este procedimento em pretende incorporação do D.S.R, sobre o salário hora á partir de 1996. 13- Todavia, completamente equivocado tal entendimento, eis que os [ORGANIZATION] proveniente do salário da jornada paga para jornada regular não se confundem com as integrações de horas extras dos D.S.R ́s. 14- Aliás, o procedimento que diz ter adotado não proporcionou aumento salarial e, portanto, não a eximia de proceder os reflexos ora pretendidos. 15- Neste sentido, se assim não fosse, também não haveria reflexos em D.S.R., das horas extras pagas para os trabalhadores mensalistas, que recebem seus salários com valor fixo pré-estabelecido, no qual encontra-se incluído o valor destinado ao D.S.R. 16- Acompanhando este entendimento fora editado a, Súmula 172 do Colendo TST, a qual se transcreve: \\\"REPOUSO REMUNERADO - HORAS EXTRAS - CÁLCULO - Computam-se no cálculo do repouso remunerado as horas extras habitualmente prestadas\\\".\"]\n\n--- CONTESTACAO ---\n\n[\"DA JORNADA DE TRABALHO O reclamante durante seu contrato de trabalho laborou cumprindo a seguinte jornada, sempre gozando de 1 hora para refeição e descanso: - 2012 até 2014, das 07h00 às 17h00 (segunda-feira à quinta-feira) e das 07h00 às 16h00 (sexta-feira); - 2014, das 14h20min às 22h35 (segunda-feira à sábado); - Março até 2014, das 07h00 às 17h00 (segunda-feira à quinta-feira) e das 07h00 às 16h00 (sexta-feira); - 2014, das 22h30min às 06h00 (segunda-feira à sábado); - 2014 até a demissão, das 07h00 às 17h00 (segunda a quinta-feira) e das 07h00 às 16h00 (sexta-feira). Assim, resta impugnada qualquer jornada divergente da acima descrita ou ainda, dos espelhos de ponto. DAS DIFERENÇAS DE HORAS EXTRAS E REFLEXOS - INDEVIDA Alega o reclamante que excedia a a jornada de 8 horas diárias e 44 semanais, sem ser devidamente remunerado, bem como, que as horas extras não refletiam nas demais verbas. Assim, requer a condenação da Reclamada ao pagamento de horas extras + reflexos por todo período contratual. Todavia, o pleito do obreiro resta impugnado, nos termos abaixo expostos: Primeiramente, cumpre esclarecer que o reclamante trabalhava na jornada declinada nesta defesa, sempre com uma hora de intervalo. Oportuno destacar, que era o próprio reclamante quem registrava seu horário de entrada e saída, de forma biométrica. A Reclamada impugna qualquer jornada de trabalho diversa desta defesa e dos espelhos de ponto, eis que, o reclamante sempre cumpriu a jornada constante nos referidos documentos, os quais retratam os dias e horários cumpridos pelo mesmo, devendo ser considerados como prova.\", \"A reclamada não nega que o reclamante tenha laborado em sobrejornada em raríssimas oportunidades, porém, nestas as ocasiões, tais horas foram devidamente registradas e corretamente remuneradas, inclusive com o adicional legal, sob as rubricas abaixo elencadas: - 111 para as horas extras prestadas em dias normais; - 114 para as horas extras prestadas em horário considerado noturno; - 117 para as horas extras prestadas em feriados; - 118 para as horas extras prestadas em feriados em horário considerado noturno. Assim, resta demonstrado que a Reclamada sempre procedeu a integração das horas extras em todas as verbas tais como DSR's, férias + 1/3 e 13o salários. Com relação ao FGTS, a Reclamada sempre considerou as horas extras para fins de depósitos fundiários, conforme demonstrado nas fichas financeiras anexas. Aliás, não se trata de integração e sim de incidência no FGTS. Esclarece a Reclamada que, para viabilizar o fechamento da folha de pagamento, tendo em vista a grande quantidade de funcionários em dezenas municípios, as horas laboradas até o dia 20 são pagas até o 5o dia útil do mês seguinte, enquanto que as horas trabalhadas entre 21 e 31 são pagas junto com o salário do mês subsequente, com base no salário do mês do efetivo pagamento.\"]\n\n--- ATAS DE AUDIENCIA ---\n\n[ORGANIZATION] \n [ORGANIZATION] \n 11a VARA DO TRABALHO DA ZONA [LOCATION] \n \n ATA DE AUDIÊNCIA \n \n PROCESSO: \n [NUMBER]\n Reclamante: \n [PERSON] \n Reclamado: \n [ORGANIZATION] \n Em 2017, na [LOCATION]sessões da [ORGANIZATION] DA ZONA \n LESTE DE [LOCATION]/[LOCATION], sob a presidência da Exmo(a). Juíza [JUDGE] \n DA ROCHA, realizou-se audiência relativa ao processo identificado em epígrafe. \n Às 10h55min, aberta a audiência, foram, de ordem da Exmo(a). Juíza do Trabalho, apregoadas \n as partes. \n Presente o(a) reclamante, acompanhado(a) do(a) advogado(a), Dr(a). CARLOS ALBERTO DA \n SILVA PRADO, OAB no 173596/[LOCATION]. \n Presente o(a) preposto(a) do(a) reclamado(a), Sr(a). [PERSON], \n acompanhado(a) do(a) advogado(a), Dr(a). [PERSON], [ORGANIZATION] no 113781/SP. \n Primeira tentativa de acordo frustrada. \n Apresentada(s) defesa(s) escrita(s) com documentos foi deferido O PRAZO DE 05 \n (CINCO) DIASpara manifestação do(a) reclamante. \n Depoimento pessoal do(a) reclamante:“o depoente sofria assédio moral e ofensas verbais ditas \n pelo [PERSON]; somente o [PERSON] ofendia o [PERSON], colocando apelidos como tufão, bunda \n de elefante; o [PERSON] não sabia tratar com o depoente, que o desrespeitava, utilizando palavras de \n arrogância ao dar ordens; em uma ocasião, na presença do [PERSON], [PERSON] e o [PERSON], \n apontou para o [PERSON] e disse \"está vendo este aqui? Já deveria estar na boca do jacaré\"; o [PERSON] \n indagou o motivo e ouviu como resposta \"Ah! porque você é um\" e abanou a cabeça; as ofensas \n ocorreram desde o ano de 2012; o [PERSON] permaneceu afastado durante 1 ano; o [PERSON], após o \n retorno, continuou a ouvir as mesmas ofensas e mesmo assim optou em manter o contrato; o [PERSON] \n trabalhava com o [ORGANIZATION] e ouvia piadas que o [PERSON] dizia a outros empregados em relação ao \n trabalho do mesmo; acredita que trabalhou por mais 1 ano após o retorno de seu afastamento; o [PERSON] \n relatou os fatos para o [PERSON] que nada fez, embora tenham feito reunião para tratar sobre \n esse assunto com o mesmo e com a [PERSON], técnica de segurança do trabalho; não se recorda \n quando a reunião ocorreu, mas foi no ano de 2016. Nada mais\"; \n Depoimento pessoal do(a) preposto(a) do(s) reclamado(a)(s):“o reclamante sempre se \n queixava com seus superiores, [PERSON] e [PERSON], sobre o comportamento do [PERSON]; o Sro. \n [PERSON] conversou com o [PERSON] que negou as ofensas, alegando que tinha um jeito mais rude de \n falar, já que utilizava tom de voz mais alto, pois era o jeito do mesmo; as queixas ocorreram em 2 ou 3 \n ocasiões; após o retorno do afastamento médico, o reclamante se queixou 1 ou 2 vezes; outros \n empregados também se queixaram sobre o comportamento do [PERSON]; a reclamada não adotou \n outro procedimento além da conversa entre o [PERSON] e o Sro. Marcelo, já que as ofensas não \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: DANIELLE SANTIAGO FERREIRA DA ROCHA - 2017 11:49:55 - 8e84eb2 \n ID. 8e84eb2 - Pág. 1 \n Fls. : 3 \n \n procediam de acordo com o relatado pelo [PERSON]; o [PERSON], após a conversa, mudou o seu \n jeito de falar; indagado sobre a informação prestada de queixas do reclamante em 2 ou 3 ocasiões, \n confirmou que o [PERSON] mudou o modo ríspido de falar e as reclamações do autor não procediam; \n o [PERSON] não colocou apelidos no reclamante. Nada mais\"; \n Primeira testemunha do(a) reclamante: [PERSON], [IdentityNumber], \n residente e domiciliado(a) na [LOCATION], [LOCATION], [LOCATION], [LOCATION] -[LOCATION]. Te \n ao argumento de interesse na solução do feito. Inquirida, alegou que tem ação \n stemunha contraditada \n trabalhista na qual pleiteou danos morais por se sentir violado em virtude da conduta da reclamada; \n somente deseja que a [ORGANIZATION] melhore a situação do [PERSON] para que o mesmo não mais adote \n comportamento que usou em relação aos empregados; não está aqui para ajudar o reclamante; viria como \n testemunha da [PERSON], já que trabalhou para a mesma durante 17 anos, o que lhe traz orgulho; não se \n considera inimigo do [PERSON]. A testemunha litiga em face da reclamada alegando danos morais, \n portanto, violado em seus direitos de personalidade, entretanto, afirmou que foi movido pela conduta de \n uma pessoa, Sro. [PERSON], tendo orgulho do período que trabalhou para a [PERSON], razão pela qual esse \n [JUDGE] não vislumbra isenção de ânimos. \n Protestos. Advertida e \n CONTRADITA REJEITADA. \n compromissada. \n \" trabalhou para a [PERSON] desde 2006 até 2017, ao final de \n Depoimento: \n encarregado operacional de aterro; trabalhava com o [PERSON] que era líder do [PERSON]; o [PERSON] \n [PERSON] era superior hierárquico do autor e [PERSON]; o [PERSON] [PERSON] chamava o [PERSON] de burro, \n afirmou que o [PERSON] havia cavado sua própria cova, embora o [PERSON] nada tivesse feito; o [PERSON] \n [PERSON] gritava com o [PERSON], dizendo que se o [PERSON] não estivesse com a perna quebrada, o \n jacaré já o havia comido, o que significava que mandaria o [PERSON] embora se o mesmo não estivesse \n em período de garantia de emprego; o [PERSON] solicitou 3 reuniões para tratar sobre o assunto e \n participaram a Sra. [PERSON] que era encarregada geral da segurança do trabalho, engenheiro [PERSON], \n os líderes [PERSON] e [PERSON] e o [PERSON]; o [PERSON] soube da reunião e disse ao [PERSON] que o \n mesmo havia cavado a sua cova e o [PERSON] foi dispensado; após 4 meses da última reunião, houve a \n dispensa do [PERSON]; as 3 reuniões ocorreram e trataram sobre os mesmos assuntos, com as mesmas \n pessoas; acha que não foi dispensado depois da primeira reunião, pois se sentia um bom trabalhador e por \n isso era mantido; depois das reuniões não houve qualquer alteração no comportamento do [PERSON]; \n autor e [PERSON] trabalhavam, em alguns momentos, no mesmo horário, das 07:00 horas às 17:00 horas \n ou das 22:00 horas às 06:00 horas; confirma os termos de seu depoimento pessoal, inclusive quanto aos \n horários de trabalho noticiados perante o M.M. Juízo da 5a Vara conforme ata de audiência juntada pelo \n [PERSON]; o [PERSON] presenciou as ofensas inclusive pelo HT que é um aparelho de comunicação, o \n que ocorria quando os 3 trabalhavam no mesmo horário, autor, [PERSON] e [PERSON]; no período em \n que o [PERSON] trabalhou no período noturno, não se ativou com o [PERSON], o que ocorreu entre 2014 e \n 2015; o [PERSON] era superior hierárquico do [PERSON]; somente o [PERSON], dentre os participantes da \n última reunião, foram dispensados. Nada mais”. \n Primeira testemunha do(a) reclamado(a): [PERSON], RG no \n 33175574, residente e domiciliado(a) na [LOCATION], [LOCATION], [LOCATION] -[LOCATION]. \n \n \n Advertida e compromissada. Depoimento: “trabalha para a reclamada desde 2013, como engenheiro \n ambiental; trabalhou com o Sro. [PERSON] e participou de reunião em que foi discutido o comportamento \n do mesmo; pelo que se recorda, houve apenas uma reunião em que participaram o [PERSON], o \n [PERSON] e o [PERSON]; não se recorda quando a reunião foi realizada, mas tratou sobre o jeito que o \n [PERSON] conversava com os empregados; nunca presenciou o [PERSON] ofender ou gritar com \n alguém; o [PERSON] costumava se queixar sobre o comportamento do [PERSON] que demorava para \n cumprir as ordens recebidas, dizendo que o [PERSON] preferia ficar no celular; o [PERSON] disse para o \n [PERSON] que o mesmo deveria mudar a forma com que falava, já que o tom de voz era alto e \n utilizava linguajar rude, como \"faz aquilo\"; o [PERSON] não era superior hierárquico do [PERSON] e \n em um período trabalharam no mesmo horário, o que ocorreu entre os anos de 2016 a 2017; o [PERSON] \n trabalhou com o Sro. [PERSON] de meados de 2015 até 2017; pelo que se recorda, o \n [PERSON] não colocou apelido no reclamante; após a reunião, não houve mais queixas sobre o \n comportamento do [PERSON] e esse passou a usar tom de voz mais baixo. Nada mais\"; \n Indeferida(s), sob protestos, a(s) seguinte(s) pergunta(s) do(a) patrono(a) do(a) reclamante, por \n se tratar de indução à resposta da testemunha: \" se é possível concluirmos que após a reunião, o Sro. \n [PERSON] passou a respeitar os empregados . Nada Mais\". \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: DANIELLE SANTIAGO FERREIRA DA ROCHA[NUMBER]:49:55 - 8e84eb2 \n ID. 8e84eb2 - Pág. 2 \n Fls. : 4 \n \n As partes não têm outras provas a produzir. \n Fica encerrada a instrução processual. \n Razões finais no prazo de réplica. \n Conciliação final rejeitada. \n Para \n \n \n JULGAMENTO designa-se a data de 2017 às 19:00 horas. \n Cientes os presentes que a sentença será publicada nos termos da SÚMULA 197 DO COL. \n [ORGANIZATION]. \n Audiência encerrada às 11:33 horas. \n Nada mais. \n Ata assinada eletronicamente, nos termos da Lei n.o[NUMBER], art. 8o, § único. \n \n [JUDGE] \n [JUDGE] \n \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://pje.trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [PERSON] - 2017 11:49:55 - 8e84eb2 \n ID. 8e84eb2 - Pág. 3 \n Fls. : 5 \n \n", "gold_answer.txt": "Formulou pedido de horas extras e reflexos, bem como indenização por danos materiais, mas não fez constar, em seus fundamentos, as respectivas causas de pedir. A petição inicial, portanto, é inepta nos termos do art. 485, VI, c/c art. 330, I, §1o, I, Novo CPC, aplicados face ao disposto no art. 769, parágrafo único, CLT. Extingue-se, sem resolução do mérito, as causas de pedir horas extras e indenização por danos materiais. I- EXTINGUE, SEM RESOLUÇÃO DO MÉRITO, AS CAUSAS DE PEDIR HORAS EXTRAS E INDENIZAÇÃO POR DANOS MATERIAIS;", "generated_answer.txt": "[PERSON], devidamente, qualificado nos autos ajuizou reclamatória trabalhista, alegando incorreção no pagamento dos reflexos de horas extras em descansos semanais remunerados e destes nas demais verbas contratuais. Visou obter a condenação da reclamada no pagamento das respectivas diferenças.\n\n**REFLEXOS DAS HORAS EXTRAS EM DSR**\n\nAlegou o reclamante que a reclamada não realizava, corretamente, o reflexo das horas extras pagas nos descansos semanais remunerados (DSRs) e que, a majoração destes, deveria repercutir no cálculo das demais verbas, como férias, 13º salário e FGTS.\n\nEm sua defesa, a reclamada sustentou que sempre procedeu à correta integração das horas extras em todas as verbas devidas, incluindo DSRs.\n\nA pretensão do autor de que os reflexos das horas extras nos DSRs gerem novos reflexos nas demais parcelas contratuais (férias, 13º salários, aviso prévio e FGTS) não pode prosperar.\n\nIsso porque tal procedimento configuraria \"bis in idem\", vale dizer, a dupla incidência da mesma verba sobre a mesma base de cálculo. O repouso semanal remunerado, majorado pelas horas extras, não se transforma em uma nova parcela autônoma a compor a remuneração para todos os fins.\n\nEsse é o entendimento pacificado pelo Colendo Tribunal Superior do Trabalho, cristalizado através da Orientação Jurisprudencial nº 394 da SDI-1:\n\n> \"A majoração do valor do repouso semanal remunerado, em razão da integração das horas extras habitualmente prestadas, não repercute no cálculo das férias, da gratificação natalina, do aviso prévio e do FGTS, sob pena de caracterização de 'bis in idem'.\"\n\nDessa forma, indevida a repercussão pleiteada.\n\nNão procede.", "gold_graph.json": "{\n  \"numero_cnj\": \"1001770-49.2017.5.02.0611\",\n  \"judge\": \"DANIELLE_SANTIAGO_FERREIRA_DA_ROCHA\",\n  \"template_version\": \"v2.1\",\n  \"path\": [\n    \"CLAIM\",\n    \"EXCLUSION_GATE\",\n    \"TIME_RECORDS\",\n    \"TESTIMONY\",\n    \"PROOF\",\n    \"OUTCOME_FINAL\"\n  ],\n  \"assignments\": {\n    \"CLAIM\": {\n      \"value\": null,\n      \"supporting_text\": \"Formulou pedido de horas extras e reflexos, bem como indenização por danos materiais, mas não fez constar, em seus fundamentos, as respectivas causas de pedir.\",\n      \"basis_tags\": []\n    },\n    \"LEGAL_ANALYSIS\": {\n      \"value\": \"CLAIMANT_INTERPRETATION_REJECTED\",\n      \"supporting_text\": \"A petição inicial, portanto, é inepta nos termos do art. 485, VI, c/c art. 330, I, §1o, I, Novo CPC, aplicados face ao disposto no art. 769, parágrafo único, CLT.\",\n      \"basis_tags\": []\n    },\n    \"OUTCOME_FINAL\": {\n      \"value\": \"DENIED\",\n      \"supporting_text\": \"Extingue-se, sem resolução do mérito, as causas de pedir horas extras e indenização por danos materiais.\",\n      \"basis_tags\": []\n    },\n    \"EXCLUSION_GATE\": {\n      \"value\": \"EXCLUSION_DOES_NOT_APPLY\",\n      \"supporting_text\": \"A petição inicial, portanto, é inepta nos termos do art. 485, VI, c/c art. 330, I, §1o, I, Novo CPC, aplicados face ao disposto no art. 769, parágrafo único, CLT.\",\n      \"basis_tags\": []\n    },\n    \"PROOF\": {\n      \"value\": \"PROOF_INSUFFICIENT\",\n      \"supporting_text\": \"Formulou pedido de horas extras e reflexos, bem como indenização por danos materiais, mas não fez constar, em seus fundamentos, as respectivas causas de pedir.\",\n      \"basis_tags\": []\n    },\n    \"OUTCOME_DENIED_DIRECT\": {\n      \"value\": \"DENIED\",\n      \"supporting_text\": \"Extingue-se, sem resolução do mérito, as causas de pedir horas ex nforme disposto no artigo 384 da CLT segundo a média declinada no corpo da presente ação, considerando para o cálculo das mesmas todas as parcelas salariais ( Súmulas 60, 109 e 264 do C. TST ), com a inserção do adicional constitucional de 50 % sobre as horas extraordinárias pleiteadas de segunda à sexta e 100 % nas horas pleiteadas no repousos semanais remunerados, ou seja, aos sábados, domingos e feriados, com aplicação do divisor 150, pela jornada semanal máxima e Sumula 431 por analogia, ou, sucessivamente, divisor 180, ou caso Vossa Excelência entenda como compromisso legal de prestar oito horas diárias, ( ao invés de seis, como postulado ), o que não se crê, requer que as horas extras sejam deferidas a partir da 8ª ( oitava ) hora diária e 40ª semanal, com aplicação do divisor 200, conforme Súmula 431 do C. TST, ou sucessivamente, aplicação do divisor 220, com os devidos reflexos, pela sua habitualidade após a integração das parcelas acima arroladas nos repousos semanais remune ##rados, inclusive sábados e feriados e, posteriormente a esse agregamento, nas férias acrescidas de um terço, décimo terceiro salários, décimo quarto salários, nas verbas de Participações nos lucros e resultados conforme determinam as convenções coletivas da categoria, por se tratar de verba fixa de natureza salarial ( regra básica das CCT ' s ) conforme fundamentação R $ 150.\"]\n\n--- CONTESTACAO ---\n\n[\": ([NUMBER][EMAIL] Delgado, Data de Julgamento: 2013, 3a Turma, Data de Publicação: 2013) No presente caso, a 1a Reclamada apresentou os cartões de ponto, cumprindo sua obrigação de fazer, nos termos do artigo 74, parágrafo 2o da CLT e Súmula 338, do C. TST. DA JORNADA – DAS HORAS EXTRAS ALÉM DA SEXTA HORA DIÁRIA – DOS REFLEXOS A jornada e o período apontados na inicial estão impugnados, diante da prova documental encartada, uma vez que nestes controles há horário variado. E quando houve eventual excesso, está registrado, sendo pago no mês seguinte ao do labor, com o adicional legal e reflexos, conforme se comprova por meio dos recibos salariais encartados. Note-se que no período imprescrito, o autor exerceu as funções de CAIXA até 2015, nos termos do “caput” do artigo 224 da CLT, com jornada de seis horas diárias e 30 horas semanais, tais como das 10h00 às 17h00 e demais variações conforme cartões de pontos ora juntados, sempre usufruindo de no mínimo 15 minutos de intervalo. Nas funções de SUPERVISOR ADMINISTRATIVO (2015 a 2018), exerceu cargos de chefia e confiança bancária, nos termos do parágrafo 2o do artigo 224 da CLT, com jornada de oito horas, tais como das 8h00 às 17h00 e demais variações, e intervalo de 1h00, no mínimo, conforme cartões de ponto, ora juntados. [LOCATION] – conjs. 181/183 CEP: [NUMBER][LOCATION] Tel. : ([NUMBER][EMAIL] O horário de trabalho (entrada, saída, intervalo), conforme se nota nos controles de ponto, são variados. Eventual excesso, antecipação ou prorrogação de seus horários, o reclamante deixou registrado e recebeu por todo excesso corretamente. Impugna-se assim, os horários apontados na inicial, conforme acima já feito, eis que eventual excesso de um mês era pago no mês subsequente ao de prestação. Há, ainda, que ser desconsiderado da jornada os minutos que antecedem e sucedem o horário diário, laborado pelo obreiro, (parágrafo 1o do artigo 58 da CLT. Ainda, não há que se falar em habitualidade na realização de horas extras, conforme anotações realizadas nos cartões de ponto da Obreira. Caso sobrevenha alguma condenação, devem ser observados os limites impostos pela Norma Coletiva de Trabalho, cuja validade foi recepcionada pela Constituição Federal, bem como a compensação dos valores já pagos sob este título, deferindo apenas diferença. Inaplicável a Súmula 146 do [ORGANIZATION]. Da mesma forma, não há que se falar em habitualidade na realização de horas extras, uma vez que as mesmas eram eventualmente realizadas, conforme comprovam os controles de ponto ora anexados. Assim, improcede o pedido de pagamento das horas extras além da 6a diária ou além da 8a diária, com adicionais, reflexos e integrações pretendidas na exordial.\", \"As alegações do Autor não podem prevalecer, eis que os controles de jornada acostados a esta Defesa noticiam o real horário cumprido pelo reclamante durante todo o período, inclusive, eventual excesso. Além disso, a Súmula 50 do TRT 2ª Região assim dispõe: SÚMULA 50 DO [ORGANIZATION] [LOCATION] – conjs. 181/183 CEP: [NUMBER][LOCATION] Tel. : ([NUMBER][[EMAIL]] 50 - Horas extras. Cartões de ponto. Ausência de assinatura do empregado. Validade. (Res. TP no[NUMBER]DOEletrônico 2016) A ausência de assinatura do empregado nos cartões de ponto, por si só, não os invalida como meio de prova, pois a lei não exige tal formalidade. Precedentes: “Vale ressaltar que a assinatura do empregado não é requisito de validade dos controles de frequência, como se depreende do disposto no § 2o do artigo 74 da CLT. A omissão, portanto, não implica a presunção da imprestabilidade dos documentos, salvo na hipótese de comprovada falsidade, o que não é o caso dos autos. A juntada destes registros, ainda que se trate da segunda via dos controles de horário, desonera o empregador da prova que lhe incumbe e a impugnação às anotações lançadas nos controles não assinados inverte o ônus, afastando-se a aplicação da Súmula 338, I, do C. TST na forma como pretendida pela recorrente. Ademais, os recibos de pagamento juntados demonstram a contraprestação da sobrejornada e o reclamante não logrou comprovar qualquer irregularidade nos pagamentos documentados, na medida em que não apresentou a existência de diferenças. (TRT 2ª REGIÃO – RECURSO ORDINÁRIO – PROCESSO No[NUMBER]– RELATORA [PERSON] - 2015 PUBLICADO O EDITAL[NUMBER], DO ACÓRDÃO No[NUMBER][LOCATION] – [LOCATION] CEP: [NUMBER][LOCATION] Tel. : ([NUMBER][EMAIL] Sendo assim, os cartões/espelhos de pontos juntados pela Reclamada são válidos como meio de prova da efetiva frequência e da jornada de trabalho do autor, pois registram horários de entrada e saída variáveis, sendo certo que todas as horas extras que o reclamante fazia jus foram registradas e pagas em sua integralidade, não havendo que se falar em diferenças de horas extras. O artigo 74, parágrafo 2o, da CLT trata da obrigação de anotação da hora de entrada e saída, em registro manual, mecânico ou eletrônico, conforme instruções do Ministério do Trabalho, devendo ter pré assinalação do período de descanso. Tal dispositivo nada estabelece acerca da necessidade da assinatura do empregado no espelho do registro de ponto eletrônico para validade e eficácia dele. Nesse sentido, temos também o seguinte precedente do Colendo Tribunal Superior do Trabalho: RECURSO DE REVISTA. HORAS EXTRAS. CARTÃO DE PONTO SEM ASSINATURA DO RECLAMANTE. Esta Corte tem entendido que o fato de o cartão de ponto não ser assinado pelo trabalhador, por si só, não tem o condão de torná-lo inválido como meio de prova.\", \"A gratificação de função, por si só, afasta o direito a jornada de trabalho prevista no caput do artigo 224 da CLT. O fato de o reclamante marcar cartões de ponto, advindo da determinação prevista no artigo 74, parágrafo 2o da CLT, c/c o art. 5o, Inc. II da Constituição Federal, não afasta o seu enquadramento no parágrafo 2o do artigo 224 CLT. E também, está evidente a VANTAGEM, pois, o valor de gratificação de função é maior que o montante de duas horas extras mais o adicional de 50%, percebendo referida vantagem durante o período que exerceu as funções de chefia e confiança bancária, inclusive com a incidência do percentual para efeito de FGTS. Conforme já exposto, durante o período não prescrito a jornada diária do reclamante era de 8 horas, eventual excesso, antecipação ou prorrogação de seus horários, o reclamante deixou registrado e recebeu por todo excesso corretamente. Ad cautelam, na improvável hipótese de ser ignorado o cargo de confiança ocupado pelo reclamante, sendo-lhe deferidas horas extras decorrentes da 7a e 8a hora trabalhadas, requer-se a aplicação do divisor 220, bem como sejam compensados os valores apurados em relação à 7o e Av. Presidente Juscelino Kubitscheck, 1726 – conjs. 181/183 CEP: [NUMBER][LOCATION] Tel. : ([NUMBER][[EMAIL]] 8a hora diária com a Gratificação de Função, visto que esta, de qualquer forma, acaba por lhe remunerar a jornada em apreço, já que os bancários de 6hs diárias não recebem tal paga. Assim, improcede o pedido de pagamento das horas extras além da 6a diária ou além da 8a diária, com adicionais, reflexos e integrações pretendidas na exordial. Pela improcedência! DA BASE DE CÁLCULO DAS HORAS EXTRAS Na remota hipótese de deferimento de quaisquer títulos, o que se admite apenas para argumentar, requer que para os cálculos seja observada a remuneração efetivamente recebida mês a mês, dentro do período imprescrito, utilizando-se as verbas fixas salariais, com exclusão das de caráter variável e das de natureza indenizatória, bem como os dias efetivamente trabalhados. Requer-se, ainda: seja determinado à desconsideração dos cinco minutos que sucedem e antecedem a jornada nos termos do art. 58, § 1o da CLT; em relação à base de cálculo e adicionais incidentes sobre eventual jornada extraordinária, seja aplicado o entendimento pacificado pela OJ 397, da SDI 1, TST. Requer, por fim, sejam compensados os valores já pagos ao mesmo título. DAS INTEGRAÇÕES E REFLEXOS SOBRE DSR’S E HORAS EXTRAS Ainda requer o reclamante que seja condenada a Reclamada aos reflexos e integrações das horas extras sobre DSR e demais verbas, porém tal pleito não merece procedência diante de total ausência de amparo legal [LOCATION] – conjs. 181/183 CEP: [NUMBER][LOCATION] Tel. : ([NUMBER][[EMAIL]] para incidência de reflexos em horas extras, e, novamente, refletir sobre DSR de sábados, domingo e feriados.\", \"DA PROVA DOCUMENTAL A prova documental que se procede com a juntada da presente peça defensiva, cartões de ponto eletrônico originais, foram extraídos do sistema do Reclamada e demo gold_answer.txt": "[PERSON], devidamente, qualificado nos autos ajuizou reclamatória trabalhista, alegando dispensa discriminatória, trabalho suplementar cumprido e não quitado, descumprimento de cláusulas convencionais, danos suportados em virtude de conduta faltosa da [PERSON]. Visou obter a condenação da [PERSON] em sua reintegração e no pagamento de parcelas do BANCO [ORGANIZATION] período de afastamento ou indenização compensatória, horas extras, reflexos, indenização por danos materiais e morais. No mérito, negou os direitos demandados. Produzida prova documental. Produzida prova em audiência. Encerrada a instrução processual. O autor, em manifestação sobre defesa e documentos, alegou cerceamento de defesa ao argumento de que pretendia ouvir outra testemunha para fazer contraprova do cargo de confiança, além de prova quanto à doença profissional e dispensa discriminatória. No presente caso, o [PERSON] pretendia ouvir outra testemunha para ratificar o depoimento já colhido, conforme constou na ata de audiência. A prescrição ora acolhida abrange o pedido de pagamento de [ORGANIZATION], pois o pedido tem, como causa de pedir, o pagamento de horas extras formulado nesta reclamatória trabalhista. O [PERSON] alegou, em sua petição inicial, ter se ativado: * De segunda a sexta-feira, das 08h00 às 18h00; * Usufruía intervalo para descanso e refeição de 01h. Postulou o pagamento de horas extras além da 6a hora diária ou, sucessivamente, além da 8a hora diária. [PERSON], ao contestar, alegou que, do período imprescrito do contrato de trabalho a 2015, o [PERSON] exerceu a função de caixa, com jornada de seis horas diárias, e a partir de 2015, a função de supervisor administrativo, com jornada de oito horas, nos termos do art. 224, §2o, CLT. [PERSON], ao alegar fato impeditivo ao recebimento de horas extras, atraiu, para si, o ônus da prova. Art. 818, CLT, c/c art. 373, II, CPC. Primeiramente, é de ressaltar o erro material contido na contestação quanto ao período laborado na função de supervisor administrativo citado no tópico \"da jornada - das horas extras além da sexta hora diária - dos reflexos\", pois constou nos registros de ponto e recibos de pagamento, a função de supervisor administrativo, desde 2013. Além disso, a [PERSON] informou em sua contestação, no tópico \"dados do contrato de trabalho\", a função de supervisor administrativo I, no período de novembro de 2013 a 2018. Outrossim, as testemunhas ouvidas nos autos confirmaram que, no período imprescrito do contrato de trabalho, o [PERSON] não exerceu a função de caixa. Assim, não há que se falar em horas extras acima da 6a hora diária do período imprescrito do contrato de trabalho a 2015, na função de caixa, como alegado pelo [PERSON] em sua manifestação sobre defesa e documentos. Conforme o dispositivo legal invocado pela ré, dois critérios objetivos devem ser preenchidos para que o cargo de confiança reste caracterizado, vale dizer, exercício de cargo de direção, gerência, fiscalização, chefia e equivalentes, ou que o empregado desempenhe outro cargo de confiança e pagamento de gratificação de função. O pagamento da gratificação de função restou demonstrado, conforme se observou dos recibos de pagamento juntados aos autos. No tocante às atribuições desempenhadas pelo [PERSON], a prova oral, demonstrou que estava sujeito à exceção legal. Isso porque a própria testemunha do [PERSON] declarou que o mesmo tinha carimbo para validação de assinatura conferida e participava de comitê de crédito. A [PERSON] declarou que o [PERSON] tinha cartão nível 85, fato confirmado por ele, em depoimento pessoal, cuja finalidade era vistar cheque administrativo e a assinatura de alguns contratos. Referida testemunha declarou ainda que o [PERSON] fazia liberações eventuais no caixa, tinha alçada para transferência interbancárias, assinatura de cheque administrativo, liberação de transação sobre vínculo. O documento Id b398b75 demonstrou que o [PERSON] possuía assinatura autorizada. As funções desempenhadas pelo [PERSON], de forma alguma, podem ser equiparadas àquelas desempenhadas por caixas e escriturários. Existia maior grau de fidúcia depositado em seu contrato de trabalho, pois as atribuições exigiam maior responsabilidade, já que influenciavam, diretamente, no alcance do objeto social, economicamente, perseguido - lucro máximo. [PERSON] esteve enquadrado na exceção legal e sujeito à jornada diária de 8 horas. Não há que se falar em pagamento da jornada excedente à 6a hora diária e, por consequência, na aplicação do divisor 150. [PERSON], em sua manifestação sobre defesa e documentos, reconheceu a validade dos controles de ponto juntados pela defesa. Fica reconhecida a validade dos cartões de ponto trazidos aos autos pela ré. [PERSON], em sua manifestação sobre defesa e documentos, apontou horas extras cumpridas e não quitadas. A manifestação não deve ser acolhida por este [JUDGE]. Isso porque, da leitura da ata da audiência UNA realizada, observa-se que, em momento algum, postulou prazo para apresentação de quadro demonstrativo de horas extras. Assim, concordou com o encerramento da instrução processual, mantendo- se pendente, apenas, a prova pericial acerca da doença profissional. Além disso, a apuração realizada não está correta, pois computou minutos residuais inferiores a 10minutos por dia em afronta ao disposto no art. 58, §1o, CLT. E, se não bastasse, não há qualquer pedido na exordial de pagamento de minutos residuais. [PERSON], em manifestação sobre defesa e documentos, tentou inovar alegando existência de diferenças de horas extras diante da incorreção no divisor utilizado e ausência de pagamento do DSR. Referidos fundamentos, em momento algum, foram utilizados em sua petição inicial, para pleitear o pagamento de horas extras. Não poderia, em réplica, alterar os termos de sua petição inicial, já que os limites objetivos da lide já estavam fixados. O [JUDGE] está adstrito aos limites objetivos da pretensão, sob pena de julgamento \"extra petita\". O reclamante não fez prova de trabalho suplementar cumprido e não quitado. Não procede.", "generated_answer.txt": "JORNADA DE TRABALHO\n\n[PERSON], devidamente, qualificada nos autos ajuizou reclamatória trabalhista, alegando exercício de função técnica, sem fidúcia especial, trabalho suplementar cumprido e não quitado, e inobservância do intervalo previsto no art. 384 da CLT. Visou obter a condenação do reclamado no pagamento de horas extras a partir da 6ª diária e 30ª semanal.\n\nDe acordo com a petição inicial, a parte autora trabalhava:\n*   De segunda a sexta-feira, das 8:00 às 18:00;\n*   Com 01 (uma) hora de intervalo para refeição e descanso.\n\nEm sua defesa, o reclamado alegou que a autora exerceu, até 2015, a função de caixa, com jornada de seis horas, e, a partir de 2015, a função de Supervisora Administrativa, enquadrada na exceção do art. 224, §2º, da CLT, com jornada de oito horas. Juntou os cartões de ponto.\n\nA reclamada, como fato impeditivo ao direito da autora, alegou exercício de cargo de confiança bancária nos termos do art. 224, §2º, da CLT, a partir de 2015. Atraiu, para si, o ônus da prova. E, do mesmo, não se desincumbiu, satisfatoriamente.\n\nA autora, em depoimento pessoal, confessou que registrava toda a jornada cumprida por meio de cartão magnético. Diante da expressa confissão, fica reconhecida a validade dos registros de ponto juntados pela defesa, que demonstram labor habitual das 08h00 às 18h00.\n\nA controvérsia, portanto, cinge-se à natureza da função de \"Supervisor Administrativo\".\n\nNão se convenceu, este Juízo, que a reclamante exercesse cargo de confiança. A prova oral produzida demonstrou que as atividades da autora eram meramente técnicas.\n\nA testemunha da reclamante declarou que a autora \"trabalhava no consignado e fazia proposta de empréstimos... mas a aprovação era do gerente\" e que a autora \"não tinha alçada para liberação de valores\".\n\nA testemunha do reclamado, por sua vez, apresentou depoimento contraditório. Embora tenha afirmado que a autora tinha alçada de até R$ 50.000,00 para certas transações, admitiu que a reclamante \"não tinha referida alçada para liberar credito consignado\", que era sua principal atividade. A fidúcia especial exigida pelo art. 224, §2º, da CLT, pressupõe um poder de decisão e responsabilidade diferenciados, o que não restou comprovado.\n\nAssim, a gratificação de função paga visou, apenas, remunerar a maior complexidade da tarefa e não a fidúcia especial. A reclamante estava, portanto, sujeita à jornada de 6 horas diárias durante todo o pacto laboral. Indevida a compensação da gratificação de função com as horas extras deferidas. Esse é o entendimento do Colendo TST, cristalizado através da Súmula nº 109.\n\nDevido o pagamento de horas extras que serão calculadas sobre a jornada excedente da 6ª hora diária e 30ª hora semanal, de forma não cumulativa, sob pena de \"bis in idem\", observando-se, como parâmetros, globalidade e evolução salariais (Súmula 264 do C. TST), dias de efetivo serviço, adicional de 50%, divisor 180 (Súmula 124, I, \"a\", do C. TST) e os horários registrados nos cartões de ponto.\n\nProcede, em parte.\n\nINTERVALO - ART. 384 DA CLT\n\nO art. 384 da CLT, tratando-se de norma de proteção ao trabalho da mulher, foi recepcionado pela atual Ordem Constitucional. A matéria foi objeto de análise pelo Egrégio STF, em sede de Repercussão Geral, no RECURSO EXTRAORDINÁRIO 658.312 SANTA CATARINA, que fixou a seguinte tese: \"O art. 384 da CLT, em sua redação anterior à Lei 13.467/2017, foi recepcionado pela Constituição Federal de 1988, aplicando-se a todas as mulheres trabalhadoras\".\n\nDevido o pagamento de 15 minutos extras por dia de efetivo labor em sobrejornada, com adicional de 50% e reflexos, observando-se os mesmos parâmetros fixados para as demais horas extras.\n\nProcede.", "gold_graph.json": "{\n  \"numero_cnj\": \"1001799-65.2018.5.02.0611\",\n  \"judge\": \"DANIELLE_SANTIAGO_FERREIRA_DA_ROCHA\",\n  \"tem  às 17h30, usufruindo de apenas 15 minutos e intervalo para refeição e descanso. Importante salientar que, muito embora a autora se ativasse no horário supracitado, não havia a correta anotação nos controles de ponto - ainda que mantenham horas extras anotadas, pois não correspondem com a verdadeira jornada realizada. Desta forma, restam veementemente impugnados referidos controles de jornada, já que não servem como prova do horário trabalhado. Portanto, e em face do ora noticiado, existem horas extras em favor da autora, bem como eventuais diferenças, já que laboradas e não pagas. Assim, roga seja a reclamada condenada a satisfazer o pagamento das horas extraordinárias excedente da 6a hora diária e 30a semanal, com base no horário acima declinado ou, com base nos controles de jornada, caso juntados e validados e, reflexos, primeiramente, nos DSR’s (incluídos os dias de sábado e feriados, nos termos do parágrafo 1o da Cláusula 8a da Convenção Coletiva de Trabalho da categoria1), e, após a somatória destes com as horas extras, em aviso prévio, 13o salário, férias acrescidas de 1/3 e FGTS + 40%. Pleiteia seja adotado adicional de 50% para pagamento das horas extraordinárias, assim como o divisor 150 para cálculo destas, na forma determinada pela nova redação da Súmula 124, I, do Colendo TST, in verbis: 1 “Quando prestadas durante toda a semana anterior, os bancos pagarão, também, o valor correspondente ao repouso semanal remunerado, inclusive sábados e feriados.” II BANCÁRIO. SALÁRIO-HORA. DIVISOR I – O divisor aplicável para o cálculo das horas extras do bancário, se houver ajuste individual expresso ou coletivo no sentido de considerar o sábado como dia de descanso remunerado, será: a) 150, para os empregados submetidos à jornada de seis horas, prevista no caput do art. 224 da CLT; b) 200, para os empregados submetidos à jornada de oito horas, nos termos do § 2o do art. 224 da CLT. Na base de cálculo das horas extras devem ser incluídas todas as parcelas remuneratórias percebidas pela reclamante e pagas com habitualidade, nos termos da Súmula 264 do Colendo TST e do parágrafo 2o da Cláusula 8a da Convenção Coletiva de Trabalho dos Bancários2. 3. DO INTERVALO INTRAJORNADA Como acima informado, a reclamante não usufruía integralmente o seu horário destinado à refeição e descanso, perfazendo, em média, apenas 15 minutos de intervalo, mesmo trabalhando em jornada superior a de seis horas diárias. Assim, tendo em vista que laborava mais de 6 horas por dia, pugna pelo pagamento de 01 hora extra diária, referente ao intervalo para refeição e descanso, na forma da Súmula 437, inciso IV, do Colendo TST e do artigo 71, parágrafo 4o, da CLT, cujos termos seguem abaixo, aplicado subsidiariamente aos bancários (artigo 8o da CLT3), em vista da falta de regulamentação específica para os bancários que trabalham além de 6 horas por dia. “Art. 71 IV - Ultrapassada habitualmente a jornada de seis horas de trabalho, é devido o gozo do intervalo intrajornada mínimo de uma hora, obrigando o empregador a remunerar o período para descanso e alimentação não usufruído como extra, acrescido do respectivo adicional, na forma prevista no art. 71, caput e § 4o da CLT” [...] “§ 4o Quando o intervalo para refeição e alimentação, previsto neste artigo, não for concedido pelo empregador, este ficará obrigado a remunerar o período correspondente com um acréscimo de no mínimo 50% (cinquenta por cento) sobre o valor da remuneração da hora normal de trabalho” Ainda, a Súmula no 437, em seu inciso I, é taxativa ao dizer que o período a ser indenizado é o correspondente ao total do intervalo a que o trabalhador teria direito e não só o correspondente ao período suprimido, in verbis: Súmula no 437 do TST INTERVALO INTRAJORNADA PARA REPOUSO E ALIMENTAÇÃO. APLICAÇÃO DO ART. 71 DA CLT (conversão das Orientações Jurisprudenciais nos 307, 342, 354, 380 e 381 da SBDI-1) - Res. 185/2012, DEJT divulgado em 25, 26 e[NUMBER] 2 “O cálculo do valor da hora extra será feito tomando-se por base o somatório de todas as verbas salariais fixas, entre outras, ordenado, adicional por tempo de serviço, gratificação de caixa e gratificação de compensador” 3 “As [ORGANIZATION] e a Justiça do Trabalho, na falta de disposições legais ou contratuais, decidirão, conforme o caso, pela jurisprudência, por analogia, por eqüidade e outros princípios e normas gerais do direito, principalmente do direito do trabalho, e, ainda, de acordo com os usos e costumes, o direito comparado, mas sempre de maneira que nenhum interesse de classe ou particular prevaleça sobre o direito público.” III I - Após a edição da Lei no 8.923/94, a não-concessão ou a concessão parcial do intervalo intrajornada mínimo, para repouso e alimentação, a empregados urbanos e rurais, implica o pagamento total do período correspondente, e não apenas daquele suprimido, com acréscimo de, no mínimo, 50% sobre o valor da remuneração da hora normal de trabalho (art. 71 da CLT), sem prejuízo do cômputo da efetiva jornada de labor para efeito de remuneração. Requer, ainda, o pagamento dos reflexos, tal como preceitua a mesma Súmula 437, em seu inciso III: III - Possui natureza salarial a parcela prevista no art. 71, § 4o, da CLT, com redação introduzida pela Lei no 8.923, de 1994, quando não concedido ou reduzido pelo empregador o intervalo mínimo intrajornada para repouso e alimentação, repercutindo, assim, no cálculo de outras parcelas salariais. Tais reflexos devem ser considerados os mesmos que aqueles transcritos no item anterior, ou seja, primeiramente nos DSR’s (incluídos os dias de sábado e feriados, nos termos do parágrafo 1o da Cláusula 8a da Convenção Coletiva de Trabalho da categoria), e, após a somatória destes com as horas referentes ao intervalo, em aviso prévio, 13o salário, férias acrescidas de 1/3 e FGTS + 40%. item 2 acima. A base de cálculo, o divisor e o adicional deverão ser aqueles consignados no 4. DO INTERVALO REFERENTE AO ARTIGO 384 DA CLT Em que pese a jornada de trabalho declinada, a reclamada não concedia a reclamante, em razão da necessidade imperiosa do serviço, o descanso obrigatório de 15 minutos entre a jornada ordinária e a extraordinária, desrespeitando o quanto contido no artigo 384 da CLT, que versa: “Art. 384. Em caso de prorrogação do horário normal, será obrigatório um descanso de 15 (quinze) minutos no mínimo, antes do período extraordinário do trabalho.” Tal descanso deverá ser considerado como horas extras, já que trabalhado e não usufruído. Região: Nesse sentido, a Súmula 28 do Egrégio Tribunal Regional do Trabalho da 2a 28 - Intervalo previsto no artigo 384 da CLT. Recepção pela Constituição Federal. Aplicação somente às mulheres. Inobservância. Horas extras. (Res.TP no 02/2015 DOEletrônico[NUMBER]O artigo 384 da CLT foi recepcionado pela Constituição Federal consoante decisão do E. Supremo Tribunal Federal e beneficia somente mulheres, sendo que a inobservância do intervalo mínimo de 15 (quinze) minutos nele previsto resulta no pagamento de horas extras pelo período total do intervalo. E a jurisprudência majoritária, quanto à constitucionalidade do indigitado artigo e pagamento deste como hora extra, não destoa: IV Art. 384 da CLT. Recepção pela Constituição de 1988. O art. 384 da CLT foi recepcionado pela Constituição da República de 1988, sendo devida a concessão apenas às pessoas do sexo feminino, entendimento sedimentado por meio da Súmula 28 do TRT da 2ª Região: \\\"Intervalo previsto no artigo 384 da CLT. Recepção pela Constituição Federal. Aplicação somente às mulheres. Inobservância. Horas extras. O artigo 384 da CLT foi recepcionado pela Constituição Federal consoante decisão do E. Supremo Tribunal Federal e beneficia somente mulheres, sendo que a inobservância do intervalo mínimo de 15 (quinze) minutos nele previsto resulta no pagamento de horas extras pelo período total do intervalo\\\". (TRT 2ª Região, 8ª Turma, Processo no[NUMBER], Acórdão[NUMBER], Rel: [JUDGE], DOE/SP: 2016) INTERVALO DO ARTIGO 384 DA CLT. A supressão do intervalo em questão implica o pagamento do período correspondente, como extraordinário, não se tratando de mera infração administrativa. (TRT 2ª Região, 14ª Turma, Processo no[NUMBER], Acórdão[NUMBER], Rel: [PERSON], DOE/SP: 2016) Portanto, faz jus a autora ao pagamento de 15 minutos por dia, já que excedia sua jornada. Postula, dessa forma, o pagamento de 15 minutos diários, por violação literal ao artigo 384 da CLT, com reflexos, primeiramente, nos DSR’s (incluídos os dias de sábado e feriados, nos termos do parágrafo 1o da Cláusula 8a da Convenção Coletiva de Trabalho da categoria), e, após a somatória destes com este intervalo, em aviso prévio, férias acrescidas de 1/3, 13o salários e FGTS + 40%. item 2 acima. A base de cálculo, o divisor e o adicional deverão ser aqueles consignados no 5. DO RECÁLCULO DAS HORAS EXTRAS PAGAS Como informado acima, a reclamante era bancária com sua jornada de trabalho prevista no caput do artigo 224 da CLT. Ocorre que a reclamada não efetivou o correto pagamento das horas extraordinárias para a reclamante, tendo em vista que o divisor utilizado não corresponde com aquele emanado pela Súmula 124, I, do C. TST, cujo teor pede-se a devida venia para transcrevê-lo: BANCÁRIO. SALÁRIO-HORA. DIVISOR (redação alterada na sessão do Tribunal Pleno realizada em[NUMBER]– Res. 185/2012, DEJT divulgado em 25, 26 e[NUMBER]I – O divisor aplicável para o cálculo das horas extras do bancário, se houver ajuste individual expresso ou coletivo no sentido de considerar o sábado como dia de descanso remunerado, será: a) 150, para os empregados submetidos à jornada de seis horas, prevista no caput do art. 224 da CLT; b) 200, para os empregados submetidos à jornada de oito horas, nos termos do § 2o do art. 224 da CLT. V Note-se que a reclamada, durante o contrato de trabalho, utilizou-se do divisor 180 para cálculo das horas extras, divisor este que não tem fundamento jurídico para ser utilizado no caso da reclamante. Assim, uma vez que a autora sempre esteve enquadrada no caput do artigo 224 da CLT e, postula pelo recálculo de todas as horas extras pagas, admitindo-se, para tanto, o divisor 150, na forma da Súmula 124, I do Colendo TST. Tais diferenças deverão gerar reflexos em, primeiramente, DSR’s (incluídos os dias de sábado e feriados, nos termos do parágrafo 1o da Cláusula 8a da Convenção Coletiva de Trabalho da categoria) e, após a integração destes, em aviso prévio, 13o salários, férias acrescidas de 1/3 e FGTS + 40%. item 2 supra. A base de cálculo, o divisor e o adicional deverão ser aqueles consignados no 6. REFLEXOS DAS HORAS EXTRAS PAGAS Conforme demonstram os anexos recibos de pagamento, muito embora a reclamada efetuasse o pagamento de horas extraordinárias a menor do que o efetivamente devido, não procedia ao pagamento dos reflexos, notadamente em DSR’s. Ora, as Convenções Coletivas, através das suas cláusulas 8a, parágrafos 1o (repetida ipsis litteris em cada ano de vigência), são taxativas quanto ao caso em questão, a saber: “Quando prestadas durante toda a semana anterior, os bancos pagarão, também, o valor correspondente ao repouso semanal remunerado, inclusive sábados e feriados.” Desta forma, postula pelo pagamento dos reflexos das horas extras pagas em, primeiramente, DSR’s (incluídos os dias de sábados e feriados) e, após a integração destes com as horas extras pagas, em aviso prévio, 13o salários, férias acrescidas de 1/3 e FGTS acrescido da indenização de 40%.\"]\n\n--- CONTESTACAO ---\n\n[\"Logo, não houve, portanto, manifestação definitiva da Corte Suprema quanto a constitucionalidade do art. 384 da CLT, além de não ter sido determinado o pagamento de horas extras em favor das empregadas pela não aplicação do art. 384 da CLT pelos empregadores. Portanto, no âmbito da Justiça do Trabalho, a discussão ainda não foi pacificada pelo TST, razão pela qual permanece aceso o debate na jurisprudência trabalhista. Dessa forma, insurge-se a Reclamada contra o teor do art. 384 da CLT, por violar o princípio da isonomia insculpido no art. 5o, \\\"caput\\\" e inciso I, da Constituição Federal, razão pela qual, não há como se admitir que o tenha sido recepcionado pela novel carta magna, pugnando aqui que este D. Juízo afaste sua aplicabilidade para que se mantenha integro a força normativa da atual Constituição Federal. Quanto ao prisma de ser devido os quinze minutos a título de horas extras, melhor sorte não assiste a Reclamante, afinal, não há previsão legal na CLT neste sentido, sendo que o deferimento de tal verba irá afrontar diretamente o teor do art. 5o, inciso II, da CRFB/88. O máximo que se poderá cogitar é em uma infração administrativa, rememorando que em verdade tal dispositivo sequer foi recepcionado pela novel Constituição Federal; assim sendo, salienta-se o entendimento da [JUDGE], em decisão proferida no Processo no[NUMBER], da 1a Vara do Trabalho de Osasco, nos seguintes temos: \\\"Tendo em vista que o plenário do STF reconheceu, nos autos do Recurso Extraordinário no 658312, com repercussão geral, que o art. 384 da CLT foi recepcionado pela CF/88, ressalvo entendimento anterior, passando a acolher a decisão da Corte Suprema, por disciplina judiciária. Em que pese o direito da reclamante ao referido intervalo, entendo que sua violação, não enseja o pagamento dos 15 minutos suprimidos, com adicional de 50%, uma vez que não há previsão legal, nem normativa para tanto. Ressalto que o §4o do art. 71 da CLT, aplica-se, exclusivamente, ao intervalo intrajornada previsto neste dispositivo legal, não sendo possível, portanto, a extensão desta norma a outros intervalos estabelecidos ao longo da CLT, vejamos: \\\"Art. 71 - Em qualquer trabalho contínuo, cuja duração exceda de 6 (seis) horas, é obrigatória a concessão de um intervalo para repouso ou alimentação, o qual será, no mínimo, de 1 (uma) hora e, salvo acordo escrito ou contrato coletivo em contrário, não poderá exceder de 2 (duas) horas. § 1o - Não excedendo de 6 (seis) horas o trabalho, será, entretanto, obrigatório um intervalo de 15 (quinze) minutos quando a duração ultrapassar 4 (quatro) horas. § 4o - Quando o intervalo para repouso e alimentação, previsto neste artigo, não for concedido pelo empregador, este ficará obrigado a remunerar o período correspondente com um acréscimo de no mínimo 50% (cinquenta por cento) sobre o valor da remuneração da hora normal de trabalho.\\\" Destaco, ainda, que a supressão de tal intervalo, enseja, tão somente, a aplicação de multa administrativa por órgão do MTE. Sendo assim, improcede o pedido da alínea \\\"c\\\" do rol de pedidos da petição inicial e seus reflexos.\\\" (Grifos Nossos). De fato, o art. 384 da CLT traz uma previsão que fere o princípio da igualdade entre homens e mulheres, preconizados nos art. 5o, I, e 7o, XXX, ambos da Constituição Federal. O mencionado art. 384 da CLT apenas determina que: \\\"Art. 384 - Em caso de prorrogação do horário normal, será obrigatório um descanso de 15 (quinze) minutos no mínimo, antes do início do período extraordinário do trabalho.\\\" Esse dispositivo não impõe ao empregador obrigação alguma de converter em pagamento de horas extras o intervalo de 15 minutos eventualmente não concedido. Sendo assim, incabível deferir o pedido da autora relativo ao pagamento de 15 minutos de intervalo como horas extras. Em verdade, a penalidade para eventual descumprimento da referida norma encontra-se no art. 401 da CLT, que comina sanção meramente administrativa para a não concessão do referido intervalo pelo empregador. Também as decisões proferidas pelo Tribunal Regional do Trabalho da 2a Região amparam a tese de que não é cabível pagamento de horas extras pelo descumprimento do art. 384 da CLT, conforme segue: \\\"INTERVALO DO ARTIGO 384 CLT. Destinado à proteção da mulher na extensão da jornada, a ausência do intervalo de quinze minutos não enseja hora extra, mas apenas multa administrava prevista no artigo 401 da CLT. Recurso Ordinário da reclamante a que se nega provimento neste aspecto. (TRT-2 - RO: [NUMBER][LOCATION], 3ª TURMA, Data de Publicação: 2014).\\\" (Grifos Nossos). \\\"INTERVALO ARTIGO 384 CLT. Destinado à proteção da mulher na extensão da jornada, a ausência do intervalo de quinze minutos não enseja hora extra, mas apenas multa administrava prevista no artigo 401 da CLT. (TRT-2 - RO: [NUMBER][LOCATION] Relator: [JUDGE], 3ª TURMA, Data de Publicação: 2014).\\\" (Grifos Nossos). Seguindo a mesma linha de entendimento, decidiu a 3ª Turma do [ORGANIZATION] o seguinte: \\\"PRORROGAÇÃO DE JORNADA - INTERVALO PARA DESCANSO - ARTIGO 384, CLT - conforme decisão plenária do c. TST, a norma que prevê um repouso de quinze minutos para a empregada do sexo feminino antes da prestação de trabalho extraordinário, foi recepcionada pela Constituição da República. Inconstitucionalidade afastada. Não observado o repouso cabível exclusivamente penalidade administrativa e não o pagamento como horas extras. Aplicabilidade não extensiva, por analogia, aos empregados do sexo masculino. ([ORGANIZATION] - RecOrd: [NUMBER][LOCATION], Relator: [PERSON], 3a. TURMA, Data de Publicação: 2012.).\\\" (Grifos Nossos). Por tudo o que foi exposto, fica demonstrado que rejeitado o pleito de pagamento de 15 minutos como horas extras, o que requer a Reclamada. Por cautela extrema, tem-se que o deferimento implicará em bis in idem, visto já estarem englobadas na condenação da sétima e oitava horas trabalhadas, neste sentido o [JUDGE], [PERSON], no processo no[NUMBER], publicada em 2014, assim pontuou em sua r. sentença: \\\"Para esgotar o debate, há de se dizer, em face dos expressos termos previstos pelo inciso II do artigo 5o da Constituição Federal, que a disposição prevista pelo artigo 384 da CLT não foi recepcionada. De qualquer modo, deferindo-se as horas extras após o tempo diário apontado, mesmo tais intervalos já serão naturalmente remunerados.\", \"Investiu o reclamado expressiva soma, para implantação do sistema eletrônico de assinalação de jornada de trabalho de seus funcionários, exatamente para coibir abusos e para que seus funcionários, tenham um registro seguro de suas horas de labor. Tal investimento, não se restringe, como mencionado anteriormente, apenas ao local de trabalho propriamente dito, mas também envolveu a criação de um setor no seu Departamento de Recursos Humanos e Departamento de Processamento de Dados, para que não houvesse condições de burla e mais, para que fossem os registros neles constantes, fiel expressão da realidade, como efetivamente vem ocorrendo. No mais, a Reclamada certifica a veracidade dos dados constantes nos cartões de ponto, que foram colhidos eletronicamente, sem qualquer interferência ou alteração daquilo registrado pela própria Reclamante. Sem prejuízo, disponibiliza desde já seus arquivos para perícia técnica, caso V. Exa. entenda necessário avaliar qualquer dado neste aspecto. No entanto, ratifica que os controles de ponto desta [ORGANIZATION] são aparelhos que rigorosamente acompanham as reais jornadas de trabalho anotadas e cumpridas pelos seus funcionários, o que também restará provado durante a instrução processual. A reclamante, no período imprescrito trabalhou das 09h55 às 16h10, com variações. Caso fizesse hora extra, esta era devidamente registrada no cartão de ponto que, ao final do mês, era conferido o espelho de ponto e assinado pela reclamante. Horas extras, quando prestadas, foram oportunamente pagas, com os devidos e corretos adicionais, como comprovam os demonstrativos de pagamento ora anexados. Além disso, note-se que sempre houve o cumprimento dos correspondentes intervalos intrajornada. Cumpria, a reclamante, normalmente sua jornada legal de trabalho, não havendo necessidade de elastecê-la como quer fazer crer, em caso em dias de mais movimento. Nas ocasiões que teve de laborar em regime extraordinário, o que ficou integralmente registrado nos controles de ponto anexos, conforme já explicitado, as horas extras foram pagas no mês subsequente ao da prestação dos serviços, cujos valores tomam por base a remuneração do mês do efetivo pagamento, com os adicionais devidos, conforme os comprovantes de pagamento acostados à presente, restando refutado as alegações em sentido contrário. Esclarecemos que as horas extras realizadas em um mês são quitadas no mês subsequente, em virtude da impossibilidade de se fazê-lo no próprio mês em razão do fechamento da folha de pagamento dar-se no penúltimo dia útil do mês. Não há, entretanto, qualquer prejuízo ao empregado. Consigne-se, ainda, que ao apresentar os controles de jornada, que não consignam jornada britânica, a Reclamada desincumbe-se do ônus da prova, sendo que cabe a Reclamante comprovar suas alegações. Assim, restam impugnadas todas as ponderações de que a jornada extraordinária não foi remunerada. Improsperável, ainda, o pedido de pagamento de uma hora extra por intervalo não gozado, pois a Reclamante trabalhava seis horas diárias, estando portanto sujeita ao intervalo de 15 minutos. Pela improcedência. INTERVALO INTRAJORNADA Primeiramente, resta totalmente impugnados os horários descritos na exordial, pois inverídicos, devendo prevalecer os horários constantes nos controles de ponto. A Reclamante, durante todo o período que prestou serviços para Reclamada, trabalhou em jornada de 6 horas, nos termos do \\\"caput\\\" do art. 224 da CLT. Além disso, SEMPRE que precisou laborar em horas extraordinárias, recebeu corretamente o valor que lhe era devido, conforme constam nos demonstrativos de pagamentos anexados aos autos. Conforme esclarecido alhures, a Reclamante durante o período imprescrito, exerceu a função de Escriturária e Caixa, cumprindo jornada de trabalho de seis horas, ativando-se nos horários das 10:00 às 16:15 e inúmeras outras variações e horários constantes dos controles de jornada. No que diz respeito ao intervalo, a Reclamante cumpriu integralmente o descanso diário de 15 minutos. Não houve intervalo inferior ao mínimo legal previsto. Requerendo-se, com o devido respeito, o decreto de improcedência total da presente reclamatória. Assim, não há que se falar em uma hora extra diária, tampouco reflexos em aviso prévio, férias + 1/3, 13o salários, DSR's e FGTS + 40%. Contudo, a ausência de intervalo, infração até então administrativa, tomou escultura legal, com a correspondente sanção. Ou seja, com ao acréscimo previsto no parágrafo 4o do artigo 71 consolidado. O dispositivo não traz e nem introduziu comando equivalente a \\\"hora extra\\\". Nota-se que o repouso legal vem tratado em Seção distinta daquela que trata das horas extras. Ao tratar do tema das horas extras o legislador o fez no Capitulo II, Seção II, artigos 59 a 65, relativo à duração e da jornada do trabalho. De modo que, ao se referir aos períodos de descansos o legislador o fez no capítulo II, porém, na Seção III, incluindo nesta mesma seção (seção III) o parágrafo 4o no que respeita a sanção legal incidente pela ausência de intervalo mínimo intrajornada. Muito embora a Reclamante sempre usufruiu de regular intervalo para sua refeição, leva-se a concluir que, deve ser afastado o pedido, pois, a não concessão de intervalo mínimo, não havendo excesso além deste interregno, implica em penalidade ao infrator, portanto, naturezas indenizatórias, não gerando a pagamento do período de descanso com o acréscimo de 50% tampouco o reflexo em aviso prévio, férias + 1/3, 13o salários, PLR e FGTS + 40%. Há, ainda, que ser desconsiderado da jornada os minutos que antecedem e sucedem o horário diário, laborado pelo obreiro, (parágrafo 1o do artigo 58 da CLT).\", \"DAS HORAS EXTRAS PAGAS: Cumpria o reclamante normalmente sua jornada legal de trabalho. Nas ocasiões que teve de laborar em regime extraordinário, o que ficou integralmente registrado nos controles de ponto anexos, conforme já explicitado, as horas extras foram pagas no mês subsequente ao da prestação dos serviços, cujos valores tomam por base a remuneração do mês do efetivo pagamento, com os adicionais devidos, conforme observa-se dos comprovantes de pagamento acostados à presente, restando refutado as alegações em sentido contrário. Desta forma, nada é devido a título de horas extras, seja a qual título for (além da sexta, nos sábados, domingos ou feriados), vez que o pedido já foi satisfeito. Em assim não entendendo, requer que na eventual apuração de horas extras, seja compensado sobre os valores pagos nos recibos dos meses subsequentes ao labor, ou seja, as horas extras apuradas em um mês devem ser compensadas com os valores pagos do mês subsequente, constante nos recibos. Não há se falar em diferenças de horas extras e reflexos, vez que todas as horas foram anotadas e pagas corretamente no mês subsequente. Pela improcedência dos pedidos. Há, ainda, que ser desconsiderado da jornada os minutos que antecedem e sucedem o horário diário, laborado pela obreira, (parágrafo 1o do artigo 58 da CLT). Pela improcedência do pedido de horas extras e integrações. DOS REFLEXOS DAS HORAS EXTRAS Conforme já salientado, a reclamante não faz jus as supostas horas extras, posto que as horas extras efetivamente laboradas constam dos controles de jornada e foram devidamente quitadas pelo pagamento, inclusive com os reflexos legais. Absurda a pretensão de reflexos das horas extras em vale refeição, o que não deve prosperar por falta de amparo legal. Não existindo diferenças de horas extras a favor do Reclamante, também não há o que se falar em reflexos sobre férias e abono (vencidas e proporcionais), gratificações natalinas, descansos semanais remunerados (sábados, domingos e feriados), FGTS e multa, verbas contratuais e rescisórias, visto que o acessório segue a sorte do principal. Também não são devidas as integrações sobre os DSRs, eis que na oportunidade em que as mesmas foram pagas já refletiram nos DSRs, bem como outras verbas, tendo em vista que a reclamante era mensalista, com base no art. 64 da CLT e art. 7o, parágrafo segundo da Lei 605/49. Ainda, verifica-se que o sábado não é dia de repouso semanal remunerado e sim dia útil não trabalhado, conforme entendimento jurisprudencial de há muito pacificado, substanciado no Enunciado no 113 do C. TST, não devendo prosperar o pleito dos reflexos nos sábados.\", \"DO MERITO DAS ALEGADAS HORAS EXTRAS DO CONTROLE DE JORNADA A Reclamada requer que sejam acolhidos os controles de jornada da Reclamante que ora apresenta, registros fiéis da jornada de trabalho efetivamente cumprida durante o período laborado, dos quais nota-se que não fazer jus a qualquer saldo de hora extra. Impugna expressamente a jornada de trabalho descrita na exordial, pois como se comprova da análise dos documentos anexos, a Reclamante sempre cumpriu a jornada para a qual foi contratada, que trabalhava, com as devidas pausas para refeição e descanso. A reclamante registrou sua jornada em listagens de ponto eletrônico. A jornada era registrada eletronicamente, com o uso do Sistema de Ponto Eletrônico, através de cartão magnético (de uso exclusivo e pessoal) que passado pelo relógio coletor, deixa gravado precisamente seus horários de entrada, saída e intervalo. Nota-se ademais, que raras foram as vezes que houve a necessidade da reclamante elastecer o labor, conforme controle de jornada. Referido sistema de ponto eletrônico, funciona da seguinte forma: SISTEMA DE PONTO ELETRÔNICO: Em local de fácil acesso aos funcionários e no âmbito de visão da [ORGANIZATION], encontra-se um relógio de ponto eletrônico, denominado coletor de ponto, onde há visor digital do horário e o dia do mês.\", \"A cláusula oitava da CCT se refere ao adicional de horas extras, ou seja, reflexos das horas extras trabalhadas continuamente durante a semana em descanso remunerado. Cita-se a referida cláusula para análise: CLÁUSULA OITAVA ADICIONAL DE HORAS EXTRAS As horas extraordinárias serão pagas com o adicional de 50% (cinquenta por cento). PARÁGRAFO PRIMEIRO Quando prestadas durante toda a semana anterior, os bancos pagarão, também, o valor correspondente ao repouso semanal remunerado, inclusive sábados e feriados. [...] (grifo e destaque do reclamado) Não é difícil compreender que a cláusula oitava da CCT não fixa o sábado como dia de descanso remunerado, até porque ela se refere a adicional de horas de 50% que, se prestadas durante toda a semana, também irá incidir no repouso semanal remunerado, inclusive sábados e feriados. Caso o sábado fosse realmente repouso remunerado a CCT não traria o termo \\\"inclusive\\\", pois já estaria considerando o sábado como repouso remunerado.\", \"DA NÃO RECEPÇÃO DO ART. 384 DA CLT PELA CONSTITUIÇÃO FEDERAL DE 1988 - DA ANULAÇÃO DA DECISÃO DO STF E DA APLICABILIDADE DE MULTA ADMINISTRATIVA Inviável o pleito da Reclamante de condenação da Reclamada ao pagamento relativo ao intervalo previsto no art. 384 da CLT. Cumpre dizer, precipuamente, que a matéria relativa à recepção pela Constituição de 1988 do art. 384 da CLT, que dispõe sobre o intervalo de 15 minutos para trabalhadora mulher antes do serviço extraordinário, foi objeto de análise no STF, o qual reconheceu a princípio a validade da referida norma frente à Constituição Federal no julgamento do Recurso Extraordinário 658.312, em 2014.\"]\n\n--- ATAS DE AUDIENCIA ---\n\n[ORGANIZATION] \n [ORGANIZATION] \n 11a VARA DO TRABALHO DA ZONA [LOCATION] \n \n ATA DE AUDIÊNCIA \n \n PROCESSO: \n [NUMBER]\n Reclamante: \n [PERSON] \n Reclamado: \n [ORGANIZATION] \n Em 2016, na [LOCATION]sessões da 11a VARA DO TRABALHO DA ZONA \n LESTE DE [LOCATION]/[LOCATION], sob a presidência da Exmo(a). [JUDGE] \n DA ROCHA, realizou-se audiência relativa ao processo identificado em epígrafe. \n Às 12h08min, aberta a audiência, foram, de ordem da Exmo(a). Juíza do Trabalho, apregoadas \n as partes. \n Presente o(a) reclamante, acompanhado(a) do(a) advogado(a), Dr(a). [PERSON] \n FIORINI, OAB no 250074/SP. \n Presente o(a) preposto(a) do(a) reclamado(a), Sr(a). [PERSON], acompanhado(a) do \n (a) advogado(a), Dr(a). [PERSON], [ORGANIZ evendo a \n \n [PERSON] comparecer no local: [LOCATION], [LOCATION], \n \n [LOCATION], [LOCATION] - [LOCATION], CEP: 01136-010, em referida data e horário, munida de \n documento pessoal e exames médicos anteriores. Faculta-se o acompanhamento dos trabalhos pela \n parte demandada apenas através de assistente técnico também médico. Resta dispensado o \n compromisso do perito nos termos do artigo 422 do CPC. \n Saliente-se que a data fixada na aba perícia no [ORGANIZATION] serve tão somente para controle fictício, \n tratando-se da data correta para a realização da perícia a acima informada. \n Número do processo: [NUMBER]\n Número do documento: [NUMBER]\n https://[ORGANIZATION].trt2.jus.br/primeirograu/Processo/ConsultaDocumento/listView.seam?nd=[NUMBER]\n Assinado eletronicamente por: [PERSON] - 2016 11:57:16 - 0ba2370 \n ID. 0ba2370 - Pág. 3 \n Fls. : 6 \n \n A parte reclamante, neste ato, sai ciente de que o não comparecimento, sem justificativa \n prévia, no dia e horário designados, será tido como recusa à perícia médica e acarretará a preclusão em \n relação à prova, nos termos dos artigos 231 e 232 do Código Civil. \n No prazo de 10 DIAS, contados a partir do dia seguinte ao vencimento do prazo acima \n \n deferido à [PERSON] para juntada de documento, essa efetuará e comprovará nos autos o depósito de R$ \n \n 1.000,00 para pagamento de honorários prévios, sob pena de penhora online, pois inadmissível, para \n este [JUDGE], a imposição de trabalho gratuito ao profissional designado para elaboração do laudo, já que \n os seus honorários também são dotados de natureza alimentar. Os honorários prévios não são exigidos \n neste momento da [PERSON] porque ela é beneficiária da [ORGANIZATION], não podendoo [JUDGE] \n restringir o acesso à Justiça nem tampouco impedir a produção de prova essencial ao deslinde da lide \n (art. 5o, XXXV daCF/88). Protestos da [PERSON]. \n No mesmo prazo deverão as partes apresentar quesitos e indicar assistentes técnicos, sob \n pena de preclusão. A [PERSON] deverá, ainda, se manifestar sobre defesa e documentos, inclusive \n sobre o que será juntado pela [PERSON], sob idêntica cominação. \n Em seu prazo, deverá a [PERSON] juntar cópias dos LTCAT (Laudo Técnico de Condições \n Ambientais de Trabalho), PCMSO (Programa de Controle Médico de Saúde Ocupacional) e PPRA \n (Programa de Prevenção de Riscos Ambientais) relativos ao períodoem que o [PERSON] prestou \n serviços,não abrangido pelos documentos juntados com a defesa, sob pena de multa diária de R$ \n 500,00. Protestos. \n As partes tomarão ciência do laudo pericial independentemente de intimação em 2017, \n devendo apresentar, caso necessárias, suas manifestações em 05 dias contados da ciência do laudo. \n Os esclarecimentos do perito serão apresentados na data de \n \n 2017 dos quais as partes \n tomarão ciência independentemente de intimação, devendo apresentar eventuais manifestações nos 05 \n dias subsequentes, sob pena de preclusão. Na mesma oportunidade, poderão apresentar razões finais. \n QUESITOS DO [JUDGE]: \n O laudo deve esclarecer, de forma clara e objetiva os seguintes pontos controvertidos: \n a) qual o diagnóstico preciso da parte reclamante; \n b) se a moléstia se classifica como doença profissional, doença do trabalho, acidente do \n trabalho típico ou equiparado (Art. 20 da Lei 8.213/91); \n c) se o meio-ambiente de trabalho representou causa ou concausa para a doença ou acidente do \n trabalho. \n d) se a [PERSON] tem direito a benefício previdenciário decorrente do acidente ou doença do \n trabalho; \n e) se foi expedida a respectiva CAT; \n f) se houve perda ou redução permanente da capacidade laborativa do [PERSON]; \n g) caso afirmativo, queira o Sr (a). [JUDGE] mensurar, em termos percentuais, a redução \n da capacidade laborativa para a prestação de serviços, \n h) se apesar da doença ou do acidente, o [PERSON] poderia ser readaptado em outras funções. \n Se o [LOCATION] estiver ativo e a natureza da moléstia assim ERSON] alegou jornada cumprida: * De segunda a sexta-feira, das 10h00 às 16h15; * Intervalo para descanso e refeição de 15minutos. [PERSON] juntou os registros de ponto da [PERSON], impugnados em manifestação sobre defesa e documentos, ao argumento de não refletirem a real jornada cumprida. [JUDGE] não se convenceu pela invalidade dos cartões de ponto. Não consta, nos mesmos, registro invariável de horários de trabalho, e estes foram devidamente assinados pela [PERSON]. Além disso, [PERSON], em depoimento, afirmou que registrava corretamente a jornada com cartão magnético e tinha acesso aos espelhos de ponto ao final do mês. Em que pese o depoimento da [PERSON] que afirmou ter realizado a conferência do espelho de ponto e, em um determinado mês, verificou que nem todas as horas trabalhadas constavam no registro, a [PERSON] confirmou que conferia os horários e que estavam corretamente registrados. Fica reconhecida a validade dos registros de ponto juntados pela [ORGANIZATION]. HORAS EXTRAS [PERSON] não provou trabalho suplementar cumprido e não quitado, o que inclui intervalo previsto no artigo 384, CLT. Em relação ao intervalo, [PERSON] esteve sujeita à jornada diária de 6h. Fez jus, portanto, ao intervalo para descanso e refeição de 15min. Segundo a petição inicial, usufruía intervalo de 15min, o que torna indevido qualquer pagamento. Não procede. HORAS EXTRAS - DIFERENÇAS - BASE DE CÁLCULO Segundo a petição inicial, o pagamento das horas extras era calculado utilizando-se, incorretamente, o divisor, sendo o correto, 150. [PERSON], em defesa, alegou ser aplicável o divisor 180, pois as normas coletivas não fixam o sábado como dia de descanso remunerado. O sábado não é dia útil não trabalhado, conforme Súmula no 113 do Colendo [ORGANIZATION]. O divisor aplicável para cálculo das horas extras do bancário submetido à jornada de seis horas é definido com base na regra geral prevista no art. 64 da CLT, vale dizer, 180, já que não há previsão expressa, nas Convenções Coletivas de Trabalho, considerando o sábado como dia de descanso semanal remunerado. Esse é o entendimento do Egrégio [ORGANIZATION] proferido nos autos do Incidente de Recursos de Revista Repetitivos, TST-IRR[NUMBER]Altera, este [JUDGE], entendimento anterior. Não procede.", "generated_answer.txt": "Com base na petição inicial, contestação, e atas de audiência fornecidas, e replicando o estilo, estrutura e raciocínio da Juíza DANIELLE SANTIAGO FERREIRA DA ROCHA, redijo a seguinte sentença:\n\n***\n\n**SENTENÇA**\n\n[PERSON], devidamente, qualificada nos autos ajuizou reclamatória trabalhista, alegando trabalho suplementar cumprido e não quitado, intervalo para descanso e refeição não usufruído, intervalo do art. 384 da CLT não concedido, diferenças de horas extras pagas face ao uso de divisor incorreto e reflexos. Visou obter a condenação da reclamada, [ORGANIZATION], no pagamento das parcelas elencadas na petição inicial.\n\n**JORNADA DE TRABALHO / HORAS EXTRAS**\n\n[PERSON] alegou, em sua petição inicial, ter se ativado:\n*   De segunda a sexta-feira, das 10h00 às 17h30;\n*   Com 15 minutos de intervalo para descanso e refeição.\n\nEm sua defesa a [PERSON] alegou jornada cumprida:\n*   Das 09h55 às 16h10, com variações;\n*   Com 15 minutos de intervalo para descanso e refeição.\n\nCom a defesa, foram juntados os espelhos de ponto da autora. Em seu prazo para manifestação, a reclamante os impugnou, de forma genérica, afirmando não corresponderem à real jornada cumprida.\n\nNão se convenceu, este Juízo, pela invalidade dos registros de ponto.\n\nA uma, pois a reclamante, em depoimento pessoal, confessou que tinha acesso aos espelhos de ponto ao final do mês, mas que nunca os conferia. A omissão da autora em apontar, à época, eventuais incorreções, enfraquece a impugnação apresentada em Juízo.\n\nA duas, a testemunha trazida pela reclamante, Sra. [PERSON], embora tenha confirmado jornada semelhante à da exordial, também admitiu que não conferia os próprios espelhos de ponto, o que retira a força probatória de seu depoimento quanto à invalidade dos documentos.\n\nA três, a testemunha da reclamada confirmou que os empregados poderiam registrar toda a jornada de trabalho cumprida e que seus próprios registros estavam corretos.\n\nDiante do exposto, e considerando que os documentos juntados não apresentam horários britânicos, fica reconhecida a validade dos espelhos de ponto juntados aos autos pela reclamada.\n\nA reclamante, portanto, atraiu, para si, o ônus da prova de demonstrar a existência de horas extras cumpridas e não quitadas, ainda que por amostragem. Art. 818, CLT, c/c art. 373, I, Novo CPC. E, do mesmo, não se desincumbiu, satisfatoriamente.\n\nNão procede.\n\n**INTERVALO INTRAJORNADA**\n\nConforme cartões de ponto, cuja validade foi reconhecida, a reclamante, habitualmente, laborava em jornada superior a 06 horas diárias.\n\nAssim, fazia jus ao intervalo para descanso e refeição de, no mínimo, 01 hora, o que não era concedido, fato incontroverso nos autos.\n\nA concessão parcial do intervalo para descanso e refeição não atinge a finalidade da norma contida no art. 71 da CLT, qual seja, a de garantir a saúde e segurança do trabalhador. Esse é o entendimento do Colendo TST cristalizado através da Súmula no 437, I.\n\nDevido, portanto, o pagamento de 01 hora extra por dia de efetivo trabalho, observando-se, como parâmetros, globalidade e evolução salariais, dias de efetivo serviço, adicional de 50%, divisor 180 (conforme tópico próprio), e os dias em que houve labor superior a 06 horas diárias, conforme cartões de ponto. Devidos, ainda, os reflexos em descansos semanais remunerados, incluindo os sábados (por expressa previsão em norma coletiva), e, com estes, em aviso prévio, 13os salários, férias acrescidas de 1/3 e FGTS com multa de 40%.\n\nProcede, em parte.\n\n**INTERVALO - ART. 384 DA CLT**\n\nO art. 384 da CLT, tratando-se de norma de proteção ao trabalho da mulher, foi, sim, recepcionado pela atual Ordem Constitucional. A questão, inclusive, já foi objeto de análise pelo E. STF no julgamento do Recurso Extraordinário 658.312, com repercussão geral reconhecida.\n\nA inobservância do intervalo mínimo de 15 minutos previsto em referido dispositivo acarreta o pagamento do período correspondente como hora extra, não se tratando de mera infração administrativa. Nesse sentido, o entendimento consubstanciado na Súmula no 28 deste Egrégio TRT da Segunda Região.\n\nDevido, assim, o pagamento de 15 minutos como extras nos dias em que houve prorrogação da jornada contratual de 06 horas, conforme apurado nos cartões de ponto, com os mesmos parâmetros e reflexos fixados para o intervalo intrajornada.\n\nProcede.\n\n**DIVISOR / DIFERENÇAS DE HORAS EXTRAS PAGAS**\n\nA reclamante postula a aplicação do divisor 150, ao argumento de que as normas coletivas consideram o sábado como dia de descanso semanal remunerado.\n\nSem razão.\n\nA norma coletiva, ao prever a repercussão das horas extras nos sábados, não o equiparou, para todos os fins, ao repouso semanal remunerado. O sábado, para o bancário, continua sendo dia útil não trabalhado. Assim, não há que se falar em aplicação do divisor 150.\n\nFica fixado o divisor 180 para o cálculo das horas extras. Por consequência, indevidas as diferenças de horas extras pagas com base na aplicação de referido divisor.\n\nNão procede.\n\n**REFLEXOS DAS HORAS EXTRAS PAGAS**\n\nA reclamante alegou que a reclamada não efetuava o pagamento dos reflexos das horas extras pagas em descansos semanais remunerados.\n\nAo se defender, a reclamada alegou que as horas extras foram quitadas com os reflexos legais.\n\nCabia à reclamante, portanto, demonstrar, ainda que por amostragem, a existência de diferenças a seu favor. E, de seu ônus, não se desincumbiu.\n\nNão procede.", "gold_graph.json": "{\n  \"numero_cnj\": \"1001836-63.2016.5.02.0611\",\n  \"judge\": \"DANIELLE_SANTIAGO_FERREIRA_DA_ROCHA\",\n  \"template_version\": \"v2.1\",\n  \"path\": [\n    \"CLAIM\",\n    \
